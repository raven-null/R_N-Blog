[build]
  command = "echo 'Static site with Functions'"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ===== API 路由 → Netlify Functions =====
[[redirects]]
  from = "/api/news"
  to = "/.netlify/functions/news"
  status = 200

[[redirects]]
  from = "/api/comments"
  to = "/.netlify/functions/comments"
  status = 200

[[redirects]]
  from = "/api/comments/*"
  to = "/.netlify/functions/comments"
  status = 200

[[redirects]]
  from = "/api/upload"
  to = "/.netlify/functions/upload"
  status = 200

[[redirects]]
  from = "/api/image"
  to = "/.netlify/functions/image"
  status = 200

[[redirects]]
  from = "/api/refresh"
  to = "/.netlify/functions/refresh"
  status = 200

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200

[[redirects]]
  from = "/api/admin-image"
  to = "/.netlify/functions/admin-image"
  status = 200

[[redirects]]
  from = "/api/article-image"
  to = "/.netlify/functions/article-image"
  status = 200

[[redirects]]
  from = "/api/avatar-image"
  to = "/.netlify/functions/avatar-image"
  status = 200
