[build]
  # 部署前跑类型检查（netlify/functions + scripts）；CSS/JS 产物已提交在 public/，
  # 不在部署时重建。stylelint 在 GitHub Actions CI 里跑（warning 不阻断）。
  command = "pnpm typecheck"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ===== 页面路由 =====
# Excalidraw 白板页：/excalidraw（无后缀）→ /excalidraw.html
[[redirects]]
  from = "/excalidraw"
  to = "/excalidraw.html"
  status = 200

# ===== API 路由 → Netlify Functions =====
[[redirects]]
  from = "/api/news"
  to = "/.netlify/functions/news"
  status = 200

# GitHub 仓库列表（主页「我的项目」卡片）
[[redirects]]
  from = "/api/github"
  to = "/.netlify/functions/github"
  status = 200

# 图库清单代理（带 Blobs 缓存，主页轮播与图库视图共用）
[[redirects]]
  from = "/api/gallery"
  to = "/.netlify/functions/gallery"
  status = 200

# 任务 + 日记（仅后台登录可用，按月归档）
[[redirects]]
  from = "/api/life"
  to = "/.netlify/functions/life"
  status = 200

[[redirects]]
  from = "/api/comments"
  to = "/.netlify/functions/comments"
  status = 200

[[redirects]]
  from = "/api/comments/*"
  to = "/.netlify/functions/comments"
  status = 200

[[redirects]]
  from = "/api/upload"
  to = "/.netlify/functions/upload"
  status = 200

[[redirects]]
  from = "/api/image"
  to = "/.netlify/functions/image"
  status = 200

[[redirects]]
  from = "/api/refresh"
  to = "/.netlify/functions/refresh"
  status = 200

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/admin-image"
  to = "/.netlify/functions/admin-image"
  status = 200

[[redirects]]
  from = "/api/admin-document"
  to = "/.netlify/functions/admin-document"
  status = 200

[[redirects]]
  from = "/api/article-image"
  to = "/.netlify/functions/article-image"
  status = 200

[[redirects]]
  from = "/api/avatar-image"
  to = "/.netlify/functions/avatar-image"
  status = 200

# 图片库只读列表（给「智能工作台 → 图库 → 博客的图片」用）
[[redirects]]
  from = "/api/gallery-list"
  to = "/.netlify/functions/gallery-list"
  status = 200

# ===== 静态资源长缓存 =====
# Netlify 默认给静态文件 must-revalidate，导致每次访问都要回源验证（慢）。
# 改为 immutable：文件名带版本号（?v=）或内容变更时更新 URL，缓存 7 天绝对安全。
[[headers]]
  for = "/images/Default/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

# Excalidraw bundle：文件名带版本号，内容更新时改名（v1 → v2）即可全量换新
[[headers]]
  for = "/js/vendor/excalidraw/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 自定义脚本 / 样式：URL 上都带 ?v= 版本号，内容一变就换 URL，因此可以长期强缓存。
# 这一条能省掉每次导航时的回源校验（Netlify 默认 must-revalidate）。
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 思维导图 bundle：文件名带版本号（v33 → v34 换名即换新）
[[headers]]
  for = "/js/vendor/mindmap/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 站点图标
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Vditor（后台编辑器）：本地固定版本，按需懒加载，可长缓存
[[headers]]
  for = "/js/vendor/vditor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML 一律回源校验：防止中间 CDN/浏览器长期缓存旧页面导致改版不生效
# 边缘缓存：原来写 no-cache，导致每次访问都穿越 CDN 回源（TTFB 1.1~1.8s）
# 现在让 Cloudflare 边缘存 60 秒，期间所有访客直接拿边缘副本；过期后先给旧页再后台刷新
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=60, stale-while-revalidate=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=60, stale-while-revalidate=86400"

# ===== 站点根图标 =====
# 五个页面 head 已统一声明 favicon；/favicon.ico 也返回同一张图标，
# 保证直接访问根路径图标、爬虫抓取、旧书签一致。
# 字体：文件名带版本/内容不变，长缓存
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/favicon.ico"
  to = "/images/Default/web-logo.webp"
  status = 200

# ===== 屏保原版（KumengScreen 构建产物放在 /screensaver/）=====
# 构建出来的页面用根绝对路径引用资源（/_next/...、/art/...），
# 这里把这两类请求改写到 /screensaver/ 下，子路径挂载才能正常加载。
[[redirects]]
  from = "/_next/*"
  to = "/screensaver/_next/:splat"
  status = 200

# 素材已压成 webp（PNG 10.2MB → 1.46MB），保持原版 .png 路径不变、换实际文件
[[redirects]]
  from = "/art/kumeng-albedo.png"
  to = "/screensaver/art/kumeng-albedo.webp"
  status = 200

[[redirects]]
  from = "/art/kumeng-closed-eyes.png"
  to = "/screensaver/art/kumeng-closed-eyes.webp"
  status = 200

[[redirects]]
  from = "/art/kumeng-normal-v3.png"
  to = "/screensaver/art/kumeng-normal-v3.webp"
  status = 200

[[redirects]]
  from = "/art/kumeng-normal.png"
  to = "/screensaver/art/kumeng-normal.webp"
  status = 200

[[redirects]]
  from = "/art/petal.png"
  to = "/screensaver/art/petal.webp"
  status = 200

[[redirects]]
  from = "/art/white-rose-petal.png"
  to = "/screensaver/art/white-rose-petal.webp"
  status = 200

[[redirects]]
  from = "/art/*"
  to = "/screensaver/art/:splat"
  status = 200
