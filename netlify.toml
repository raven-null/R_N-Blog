[build]
  command = "echo 'Static site with Functions'"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ===== API 路由 → Netlify Functions =====
[[redirects]]
  from = "/api/news"
  to = "/.netlify/functions/news"
  status = 200

[[redirects]]
  from = "/api/comments"
  to = "/.netlify/functions/comments"
  status = 200

[[redirects]]
  from = "/api/comments/*"
  to = "/.netlify/functions/comments"
  status = 200

[[redirects]]
  from = "/api/upload"
  to = "/.netlify/functions/upload"
  status = 200

[[redirects]]
  from = "/api/image"
  to = "/.netlify/functions/image"
  status = 200

[[redirects]]
  from = "/api/refresh"
  to = "/.netlify/functions/refresh"
  status = 200

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/admin-image"
  to = "/.netlify/functions/admin-image"
  status = 200

[[redirects]]
  from = "/api/admin-document"
  to = "/.netlify/functions/admin-document"
  status = 200

[[redirects]]
  from = "/api/article-image"
  to = "/.netlify/functions/article-image"
  status = 200

[[redirects]]
  from = "/api/avatar-image"
  to = "/.netlify/functions/avatar-image"
  status = 200

# ===== 静态资源长缓存 =====
# Netlify 默认给静态文件 must-revalidate，导致每次访问都要回源验证（慢）。
# 改为 immutable：文件名带版本号（?v=）或内容变更时更新 URL，缓存 7 天绝对安全。
[[headers]]
  for = "/images/Default/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

# Excalidraw bundle：文件名带版本号，内容更新时改名（v1 → v2）即可全量换新
[[headers]]
  for = "/js/vendor/excalidraw/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
