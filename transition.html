<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hacker Red Alert Terminal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000000;
  font-family:Consolas,Monaco,monospace;
  color:#ff0000;
}
#matrixCanvas{
  position:fixed;
  top:0;left:0;
  width:100vw;height:100vh;
  z-index:1;
}
.vignette{
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 62%, rgba(0,0,0,0.82) 100%);
}
.glitch-wrap{
  position:fixed;
  inset:0;
  z-index:3;
  transition:transform 0s;
}
.glitch-active{
  transform:translateX(6px);
}
.glitch-active::after{
  content:"";
  position:absolute;
  top:42%;
  left:0;
  width:100%;
  height:14%;
  background:inherit;
  transform:translateX(-10px);
  pointer-events:none;
}
.red-alert-border{
  position:fixed;
  inset:0;
  z-index:5;
  pointer-events:none;
  border:3px solid transparent;
  animation:alertFlash 0.7s infinite;
}
@keyframes alertFlash{
  0%,100%{
    border-color:rgba(255,0,0,0.15);
    box-shadow:inset 0 0 30px rgba(255,0,0,0.05);
  }
  50%{
    border-color:rgba(255,0,0,0.75);
    box-shadow:inset 0 0 80px rgba(255,0,0,0.25);
  }
}
.terminal-box{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:min(760px, 90vw);
  height:min(520px, 70vh);
  background:rgba(0,0,0,0.72);
  border:1px solid #ff0000;
  box-shadow:
    0 0 14px rgba(255,0,0,0.35),
    inset 0 0 18px rgba(255,0,0,0.08);
  padding:20px;
  z-index:6;
  overflow:hidden;
  animation:pulseBorder 3.2s ease-in-out infinite;
}
@keyframes pulseBorder{
  0%,100%{
    box-shadow:0 0 14px rgba(255,0,0,0.35), inset 0 0 18px rgba(255,0,0,0.08);
  }
  50%{
    box-shadow:0 0 26px rgba(255,0,0,0.62), inset 0 0 24px rgba(255,0,0,0.14);
  }
}
.terminal-log{
  height:calc(100% - 34px);
  overflow:hidden;
  font-size:14px;
  line-height:1.65;
  text-shadow:0 0 6px #ff0000;
}
.log-line{
  margin:2px 0;
  color:#aa0000;
}
.prompt-line{
  margin-top:8px;
  font-size:14px;
  text-shadow:0 0 6px #ff0000;
}
.cursor{
  display:inline-block;
  width:9px;
  height:16px;
  background:#ff0000;
  margin-left:5px;
  vertical-align:text-bottom;
  box-shadow:0 0 8px #ff0000;
  animation:blink 1s step-end infinite;
}
@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:0}
}
</style>
</head>
<body>
<div class="glitch-wrap" id="glitchContainer">
  <canvas id="matrixCanvas"></canvas>
  <div class="vignette"></div>
  <div class="red-alert-border"></div>
  <div class="terminal-box">
    <div class="terminal-log" id="logArea"></div>
    <div class="prompt-line">root@anonymous:~# <span class="cursor"></span></div>
  </div>
</div>

<script>
var canvas = document.getElementById('matrixCanvas');
var ctx = canvas.getContext('2d');
var w, h;

var charSet = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜｦﾝ";
var warningTexts = ["ACCESS DENIED", "BREACH", "WARNING", "ALERT", "INTRUSION"];
var fontSize = 16;
var columns;
var drops = [];

function resizeCanvas(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  columns = Math.floor(w / fontSize);
  drops = [];
  for(var i=0;i<columns;i++){
    drops[i] = Math.random() * -h;
  }
}

function drawMatrix(){
  ctx.fillStyle = "rgba(0, 0, 0, 0.06)";
  ctx.fillRect(0,0,w,h);
  ctx.fillStyle = "#ff0000";
  ctx.font = fontSize + "px Consolas";

  for(var i=0;i<drops.length;i++){
    var randChar = charSet[Math.floor(Math.random()*charSet.length)];
    ctx.fillText(randChar, i*fontSize, drops[i]*fontSize);
    var speed = 0.8 + Math.random() * 1.4;
    drops[i] += speed;
    if(drops[i]*fontSize > h && Math.random()>0.975){
      drops[i] = Math.random() * -60;
    }
  }
  drawScrollWarning();
  requestAnimationFrame(drawMatrix);
}

var scrollOffset = 0;
function drawScrollWarning(){
  ctx.save();
  ctx.fillStyle = "rgba(180,0,0,0.18)";
  ctx.font = "bold 42px Consolas";
  var text = warningTexts[Math.floor(Date.now()/3200) % warningTexts.length];
  scrollOffset -= 1.2;
  if(scrollOffset < -ctx.measureText(text).width * 2) scrollOffset = w;
  ctx.fillText(text, scrollOffset, h * 0.28);
  ctx.fillText(text, scrollOffset + ctx.measureText(text).width + 120, h * 0.28);
  ctx.restore();
}

var logPool = [
  "[SEC] INTRUSION ATTEMPT DETECTED",
  "[ACCESS] Login rejected. Credentials invalid",
  "[NET] Firewall breach detected",
  "[SYSTEM] Security protocol triggered",
  "[WARN] Unauthorized socket connection",
  "[CRYPT] Key validation FAILED",
  "[ALERT] Trace route active",
  "[KERNEL] Access permission DENIED",
  "[MONITOR] Suspicious packet stream",
  "[CRITICAL] Perimeter compromised"
];
var logArea = document.getElementById("logArea");

function appendLog(){
  var randomText = logPool[Math.floor(Math.random()*logPool.length)];
  var div = document.createElement("div");
  div.className = "log-line";
  div.textContent = randomText;
  logArea.appendChild(div);
  logArea.scrollTop = logArea.scrollHeight;
  if(logArea.children.length > 32){
    logArea.removeChild(logArea.firstChild);
  }
}
setInterval(appendLog, 950);

var glitchContainer = document.getElementById("glitchContainer");
function triggerGlitch(){
  glitchContainer.classList.add("glitch-active");
  setTimeout(function(){
    glitchContainer.classList.remove("glitch-active");
  },200);
}
function scheduleGlitch(){
  var delay = (5000 + Math.random()*3000);
  setTimeout(function(){
    triggerGlitch();
    scheduleGlitch();
  },delay);
}

// 初始化动画
window.addEventListener("resize", resizeCanvas);
resizeCanvas();
drawMatrix();
scheduleGlitch();
appendLog();

// 请求全屏
document.documentElement.requestFullscreen().catch(function(err) {
  console.log('全屏请求失败，跳回首页');
  window.location.href = 'index.html';
});

// 监听全屏状态变化，退出全屏时跳回首页
function onFullscreenChange() {
  var isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
  if (!isFullscreen) {
    window.location.href = 'index.html';
  }
}
document.addEventListener('fullscreenchange', onFullscreenChange);
document.addEventListener('webkitfullscreenchange', onFullscreenChange);
document.addEventListener('msfullscreenchange', onFullscreenChange);

// 5秒后自动跳转到极客中心
setTimeout(function(){
  window.location.href = 'index.html';
}, 5000);
</script>
</body>
</html>
