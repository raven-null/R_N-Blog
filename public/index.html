    <!-- 图库分类按钮（位于主题切换按钮上方） -->

    <div class="gallery-tag-float-panel" id="galleryTagFloatPanel">

    </div>

    <!-- 图库灯箱 -->
    <div class="gallery-lightbox" id="galleryLightbox" onclick="closeGalleryLightbox()">

    <script>
        // ===== Scroll Observer =====
        function initScrollObserver() {
            const wrapper = document.getElementById('contentWrapper');

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        wrapper.classList.add('visible');
                    }
                });
            }, { threshold: 0.05 });

            observer.observe(wrapper);
        }

        // ===== Card Reveal Observer =====
        function initCardObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

            // Observe existing cards
            document.querySelectorAll('.card').forEach(card => observer.observe(card));

            // Store observer for dynamic cards
            window._cardObserver = observer;
        }

        // ===== 图库灯箱 =====
        window.__galleryImages = [];
        window.__galleryIndex = 0;
        let __galleryTimer = null;
        const __galleryPreload = new Map(); // src -> Image（预加载缓存）

        // 预加载原图到浏览器缓存，切换时秒显
        function preloadGalleryImage(src) {
            if (!src || __galleryPreload.has(src)) return;
            const im = new Image();
            im.src = src;
            __galleryPreload.set(src, im);
        }
        // 预加载当前图相邻 ±1、±2 的原图（连续切换不再等待）
        function preloadGalleryNeighbors() {
            const images = window.__galleryImages;
            if (!images.length) return;
            const total = images.length;
            const c = window.__galleryIndex;
            for (let d = 1; d <= 2; d++) {
                const p = images[(c + d) % total];
                const n = images[(c - d + total) % total];
                preloadGalleryImage((p && (p.url || p)) || '');
                preloadGalleryImage((n && (n.url || n)) || '');
            }
        }
        // 原图是否已加载完成
        function galleryImageReady(src) {
            const im = __galleryPreload.get(src);
            return !!(im && im.complete && im.naturalWidth > 0);
        }
        // 获取灯箱当前项（兼容纯字符串与对象两种数据格式）
        function galleryItemAt(i) {
            const it = window.__galleryImages[i];
            return (it && typeof it === 'object') ? it : { url: it, thumb: '' };
        }
        // 显示图片：原图已就绪直接用原图，否则先显示缩略图（已缓存，秒显），原图就绪后自动替换
        function showGalleryImage(swap, item, targetIdx) {
            const full = (item && (item.url || item)) || '';
            const thumb = (item && item.thumb) || '';
            if (!full) return;
            if (galleryImageReady(full)) {
                swap(full);
                return;
            }
            if (thumb && thumb !== full) {
                swap(thumb);
            } else {
                swap(full);
            }
            if (full) {
                preloadGalleryImage(full);
                const im = __galleryPreload.get(full);
                if (im) im.onload = () => swap(full);
            }
        }

        function openGalleryLightbox(src, index) {
            const lb = document.getElementById('galleryLightbox');
            const img = document.getElementById('galleryLightboxImg');
            if (!lb || !img) return;
            // R18 图片：原图需管理员密钥，未验证时先弹窗输入
            const first = galleryItemAt(index || 0);
            if (first && typeof first === 'object' && BlogApp.isR18Image(first) && !((first.url || '').includes('adminKey='))) {
                BlogApp.requestR18Key().then(ok => { if (ok) openGalleryLightbox(src, index); });
                return;
            }
            window.__galleryIndex = index || 0;
            const item = galleryItemAt(window.__galleryIndex);
            const targetIdx = window.__galleryIndex;
            // 先显示缩略图秒开，原图就绪自动替换（不阻塞打开）
            showGalleryImage((s) => { if (window.__galleryIndex === targetIdx) img.src = s; }, item, targetIdx);
            // 预加载相邻图片，为切换做准备
            preloadGalleryNeighbors();
            updateGalleryLightbox();
            stopGallerySlideshow();
            lb.style.display = 'flex';
            requestAnimationFrame(() => {
                lb.classList.add('show');
                if (typeof anime !== 'undefined') {
                    anime.animate(img, { scale: [0.85, 1], opacity: [0, 1], duration: 300, ease: 'out(3)' });
                    anime.animate(lb, { opacity: [0, 1], duration: 250, ease: 'out(2)' });
                }
            });
        }

        function galleryLightboxNav(dir, depth) {
            const images = window.__galleryImages;
            if (!images.length) return;
            const total = images.length;
            const target = (window.__galleryIndex + dir + total) % total;
            const img = document.getElementById('galleryLightboxImg');
            const item = galleryItemAt(target);
            // R18 图片未验证密钥：手动切换时弹窗验证；自动播放时跳过（深度保护防全 R18 死循环）
            if (item && typeof item === 'object' && BlogApp.isR18Image(item) && !((item.url || '').includes('adminKey='))) {
                if (__galleryTimer) {
                    depth = depth || 0;
                    if (depth >= total) return; // 全部 R18 未解锁，停止轮播
                    window.__galleryIndex = target;
                    return galleryLightboxNav(dir, depth + 1);
                }
                BlogApp.requestR18Key().then(ok => { if (ok) galleryLightboxNav(dir); });
                return;
            }
            window.__galleryIndex = target;
            // 预加载新位置的相邻图（为下一次切换做准备）
            preloadGalleryNeighbors();
            const swap = (s) => {
                if (window.__galleryIndex !== target) return; // 已切走，丢弃过期结果
                img.src = s;
                updateGalleryLightbox();
            };
            if (typeof anime !== 'undefined') {
                anime.animate(img, { opacity: [1, 0], duration: 120, ease: 'in(2)', onComplete: () => {
                    showGalleryImage(swap, item, target);
                    anime.animate(img, { opacity: [0, 1], scale: [0.96, 1], duration: 220, ease: 'out(2)' });
                } });
            } else {
                showGalleryImage(swap, item, target);
            }
        }

        function updateGalleryLightbox() {
            const el = document.getElementById('galleryLightboxCounter');
            if (el) el.textContent = (window.__galleryIndex + 1) + ' / ' + window.__galleryImages.length;
            const dl = document.getElementById('galleryLightboxDownload');
            const item = galleryItemAt(window.__galleryIndex);
            // 下载按钮始终指向原图（而非缩略图）
            if (dl) dl.href = (item && (item.url || item)) || '';
        }

        function toggleGallerySlideshow() {
            const btn = document.getElementById('galleryLightboxSlide');
            if (__galleryTimer) {
                stopGallerySlideshow();
            } else {
                __galleryTimer = setInterval(() => galleryLightboxNav(1), 2500);
                if (btn) btn.textContent = '⏸ 暂停';
            }
        }

        function stopGallerySlideshow() {
            if (__galleryTimer) {
                clearInterval(__galleryTimer);
                __galleryTimer = null;
            }
            const btn = document.getElementById('galleryLightboxSlide');
            if (btn) btn.textContent = '▶ 播放';
        }

        function closeGalleryLightbox() {
            const lb = document.getElementById('galleryLightbox');
            if (!lb) return;
            stopGallerySlideshow();
            lb.classList.remove('show');
            if (typeof anime !== 'undefined') {
                anime.animate(lb, { opacity: [1, 0], duration: 200, ease: 'in(2)', onComplete: () => { lb.style.display = 'none'; } });
            } else {
                lb.style.display = 'none';
            }
        }

        // ===== 留言图片灯箱 =====
        function openCommentImageLightbox(img) {
            const lb = document.getElementById('commentImageLightbox');
            const lightboxImg = document.getElementById('commentImageLightboxImg');
            if (!lb || !lightboxImg) return;
            lightboxImg.src = img.src;
            lb.style.display = 'flex';
            requestAnimationFrame(() => {
                lb.classList.add('show');
                if (typeof anime !== 'undefined') {
                    anime.animate(lightboxImg, { scale: [0.85, 1], opacity: [0, 1], duration: 300, ease: 'out(3)' });
                    anime.animate(lb, { opacity: [0, 1], duration: 250, ease: 'out(2)' });
                }
            });
        }

        function closeCommentImageLightbox() {
            const lb = document.getElementById('commentImageLightbox');
            if (!lb) return;
            lb.classList.remove('show');
            if (typeof anime !== 'undefined') {
                anime.animate(lb, { opacity: [1, 0], duration: 200, ease: 'in(2)', onComplete: () => { lb.style.display = 'none'; } });
            } else {
                lb.style.display = 'none';
            }
        }

        // ===== 全屏切换 =====
        function toggleFullscreen() {
            const el = document.documentElement;
            const isFull = document.fullscreenElement || document.webkitFullscreenElement;
            if (isFull) {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            } else {
                const req = el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen && el.webkitRequestFullscreen();
                if (req && req.catch) req.catch(err => console.warn('全屏请求失败:', err.message));
            }
        }

        // ===== 博客设置 =====
        let blogSettings = null;

        // 加载博客设置
        async function loadBlogSettings() {
            try {
                const res = await fetch('/api/admin?action=settings');
                const data = await res.json();
                if (data.status === 'success' && data.data) {
                    blogSettings = data.data;
                }
            } catch (e) {
                console.warn('博客设置加载失败:', e);
            }
        }

        // 应用博客设置到页面
        function applyBlogSettings() {
            if (!blogSettings) return;

            // 1. 站点名称 + 网站标题
            if (blogSettings.siteName) {
                const brand = document.querySelector('.top-bar-brand');
                if (brand) brand.textContent = blogSettings.siteName;
            }
            // 网站标题（默认"我的博客"）
            if (blogSettings.siteTitle) {
                document.title = blogSettings.siteTitle;
            } else {
                document.title = '我的博客';
            }
            // 网站图标 favicon（默认无）
            if (blogSettings.favicon) {
                const icon = document.getElementById('siteFavicon');
                if (icon) icon.setAttribute('href', blogSettings.favicon);
            }

            // 2. 个人资料
            if (blogSettings.avatar) {
                const avatar = document.querySelector('.dash-avatar');
                if (avatar) avatar.src = blogSettings.avatar;
            }
            if (blogSettings.authorName) {
                const name = document.querySelector('.dash-name');
                if (name) name.textContent = blogSettings.authorName;
            }
            if (blogSettings.bio) {
                const bio = document.querySelector('.dash-bio');
                if (bio) bio.textContent = blogSettings.bio;
            }

            // 3. 导航页面开关
            const views = blogSettings.views || {};
            document.querySelectorAll('#viewSwitch .view-btn').forEach(btn => {
                const v = btn.dataset.view;
                if (views[v] === false) btn.style.display = 'none';
            });
            // 确保当前视图按钮可见
            const activeViewBtn = document.querySelector('#viewSwitch .view-btn[data-view="' + (BlogApp.currentView || 'blog') + '"]');
            if (activeViewBtn && activeViewBtn.style.display === 'none') {
                activeViewBtn.style.display = '';
            }

            // 5. 导航标签
            const navTags = blogSettings.navTags || [];
            const navLinks = document.querySelector('.nav-links');
            if (navLinks && navTags.length) {
                // 保留「全部」，重建其余标签链接
                const existing = navLinks.querySelector('a[onclick*="filterByTag(null)"]');
                const tagLinks = navTags.map(tag => `
                    <a href="#" class="nav-link" onclick="BlogApp.filterByTag('${tag.replace(/'/g,"\\'")}'); return false;">${tag}</a>
                `).join('');
                navLinks.innerHTML = (existing ? existing.outerHTML : '<a href="#" class="nav-link active" onclick="BlogApp.filterByTag(null); return false;">全部</a>') + tagLinks;
                BlogApp.updateNavActive();
            }

            // 6. 关于信息
            const about = blogSettings.about || {};
            if (about.version || about.tech || about.updated) {
                const aboutInfo = document.querySelector('.dash-about-info');
                if (aboutInfo) {
                    aboutInfo.innerHTML = [
                        about.version ? `<span>${about.version}</span>` : '',
                        about.tech ? `<span>${about.tech}</span>` : '',
                        about.updated ? `<span>${about.updated}</span>` : ''
                    ].join('');
                }
            }
        }

        // ===== 欢迎区日期时间 =====
        function updateDashClock() {
            const dateEl = document.getElementById('dashClockDate');
            const timeEl = document.getElementById('dashClockTime');
            if (!dateEl || !timeEl) return;
            const now = new Date();
            const week = ['日', '一', '二', '三', '四', '五', '六'][now.getDay()];
            dateEl.textContent = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} 星期${week}`;
            timeEl.textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
        }

        // ===== Init =====
        document.addEventListener('DOMContentLoaded', async () => {
            // 加载博客设置并应用（需在 BlogApp.init 前）
            await loadBlogSettings();
            applyBlogSettings();

            // 欢迎区日期时间（每秒更新）
            updateDashClock();
            setInterval(updateDashClock, 1000);

            // Scroll observer
            initScrollObserver();

            // 阅读进度条 + 回到顶部按钮 + 页脚遮挡处理（滚动发生在 #scrollArea）
            (function initScrollUI() {
                const progress = document.getElementById('readingProgress');
                const backToTop = document.getElementById('backToTop');
                const scroller = document.getElementById('scrollArea');
                if (!progress || !backToTop || !scroller) return;

                const update = () => {
                    const scrollTop = scroller.scrollTop;
                    const scrollHeight = scroller.scrollHeight - scroller.clientHeight;
                    progress.style.width = scrollHeight > 0 ? (scrollTop / scrollHeight * 100) + '%' : '0%';
                    backToTop.classList.toggle('show', scrollTop > 400);
                };
                scroller.addEventListener('scroll', update, { passive: true });
                window.addEventListener('resize', update);
                update();

                backToTop.addEventListener('click', () => {
                    scroller.scrollTo({ top: 0, behavior: 'smooth' });
                });
            })();

            // ESC 关闭搜索 / 图库灯箱 / 留言图片灯箱；左右方向键切换图片
            document.addEventListener('keydown', (e) => {
                const lb = document.getElementById('galleryLightbox');
                const lbOpen = lb && lb.classList.contains('show');
                const clb = document.getElementById('commentImageLightbox');
                const clbOpen = clb && clb.classList.contains('show');
                if (e.key === 'Escape') {
                    const dropdown = document.getElementById('searchDropdown');
                    if (dropdown && dropdown.classList.contains('show')) {
                        BlogApp.toggleSearch();
                    }
                    if (lbOpen) {
                        closeGalleryLightbox();
                    }
                    if (clbOpen) {
                        closeCommentImageLightbox();
                    }
                }
                if (lbOpen && (e.key === 'ArrowLeft')) galleryLightboxNav(-1);
                if (lbOpen && (e.key === 'ArrowRight')) galleryLightboxNav(1);
            });

            // WASD shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                
                switch(e.key.toLowerCase()) {
                    case 'w':
                        document.getElementById('scrollArea').scrollBy({ top: -300, behavior: 'smooth' });
                        break;
                    case 's':
                        document.getElementById('scrollArea').scrollBy({ top: 300, behavior: 'smooth' });
                        break;
                    case 'a':
                        window.history.back();
                        break;
                    case 'd':
                        window.history.forward();
                        break;
                    case 'q':
                        ThemeManager.nextTheme();
                        break;
                }
            });

            // Click outside to close panels（搜索框 / 标签面板 / 图库分类）
            document.addEventListener('click', (e) => {
                const tools = document.querySelector('.nav-tools');
                if (tools && !tools.contains(e.target)) {
                    BlogApp.closePanels();
                }
                const tagBtn = document.getElementById('galleryTagBtn');
                const tagPanel = document.getElementById('galleryTagFloatPanel');
                if (tagPanel && tagBtn && !tagBtn.contains(e.target) && !tagPanel.contains(e.target)) {
                    tagPanel.classList.remove('show');
                }
            });

            // Init blog app
            BlogApp.init().then(() => {
                // 文章数 → 页脚；标签数 → "全部标签"面板标题（字数统计已删除）
                const totalPosts = BlogApp.posts.length;
                const tagCount = BlogApp.posts.reduce((set, post) => {
                    (post.tags || []).forEach(tag => set.add(tag));
                    return set;
                }, new Set()).size;

                const footerStats = document.getElementById('footerStats');
                if (footerStats) footerStats.textContent = ` · 文章 ${totalPosts} 篇`;

                const tagsTitle = document.getElementById('tagsDropdownTitle');
                if (tagsTitle) tagsTitle.textContent = `全部标签（${tagCount} 个）`;

                // 初始化视图滑块指示器位置（若 blog 被禁用则跳到第一个可见视图）
                const _views = (blogSettings && blogSettings.views) || {};
                let _startView = 'blog';
                if (_views.blog === false) {
                    const _valid = ['gallery', 'news', 'dashboard'];
                    _startView = _valid.find(v => _views[v] !== false) || 'blog';
                }
                setTimeout(() => BlogApp.moveIndicator(_startView), 0);
                if (_startView !== 'blog') {
                    BlogApp.switchView(_startView);
                }

                // Init card observer after posts render
                setTimeout(() => initCardObserver(), 100);
            });
        });

        // Override renderPosts to re-init card observer
        const originalRenderPosts = BlogApp.renderPosts.bind(BlogApp);
        BlogApp.renderPosts = function () {
            originalRenderPosts();
            setTimeout(() => {
                document.querySelectorAll('.card:not(.visible)').forEach(card => {
                    if (window._cardObserver) window._cardObserver.observe(card);
                });
            }, 50);
        };

    </script>

    <!-- 不蒜子统计 -->
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
