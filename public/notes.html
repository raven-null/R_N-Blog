<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>灵感 - 卡片笔记</title>
  <link rel="icon" id="siteFavicon" href="images/Default/web-logo.webp" type="image/webp" />
  <link rel="stylesheet" href="css/style.css?v=3.16.3" />
  <link rel="stylesheet" href="css/glass.css?v=1.0.4" />
  <script src="js/theme.js?v=3.13.6"></script>
  <style>
    /* ===== 灵感墙：胶囊 + 点击原地展开（液态玻璃，苹果动画） ===== */
    :root {
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --spring-soft: cubic-bezier(0.22, 1, 0.36, 1);
    }
    html, body { height: auto; min-height: 100%; }
    body { overflow-y: auto; }
    .notes-top {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 10px 18px;
      background: rgba(16, 16, 19, 0.62);
      backdrop-filter: blur(26px) saturate(180%); -webkit-backdrop-filter: blur(26px) saturate(180%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    }
    .brand { display: inline-flex; align-items: center; gap: 9px; color: #fff; font-weight: 700; font-size: 16px; margin-right: 6px; }
    .brand svg { width: 17px; height: 17px; color: #9aa0ff; }
    .count-pill { font-size: 11.5px; color: rgba(255, 255, 255, 0.55); border: 1px solid rgba(255, 255, 255, 0.14); padding: 2px 10px; border-radius: 999px; }
    .nav-pill {
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
      color: #e8e8ea; padding: 5px 13px; border-radius: 999px; font-size: 13px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.035));
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: transform 0.25s var(--spring), background 0.2s ease, border-color 0.2s ease;
    }
    .nav-pill:hover { background: linear-gradient(145deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.07)); border-color: rgba(255, 255, 255, 0.26); }
    .nav-pill:active { transform: scale(0.95); }
    .nav-pill svg { width: 14px; height: 14px; }
    .spacer { flex: 1; }
    .search-box {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 999px;
      background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.13);
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .search-box:focus-within { border-color: rgba(255, 255, 255, 0.34); background: rgba(255, 255, 255, 0.1); }
    .search-box svg { width: 13px; height: 13px; color: rgba(255, 255, 255, 0.4); flex: none; }
    .search-box input { border: none; outline: none; background: transparent; color: #fff; font-size: 13px; width: 120px; font-family: inherit; }
    .search-box input::placeholder { color: rgba(255, 255, 255, 0.32); }
    .wrap { max-width: 860px; margin: 0 auto; padding: 24px 22px 90px; position: relative; z-index: 1; }
    /* 标签行 */
    .tag-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
    .tag-chip {
      padding: 5px 15px; border-radius: 999px; cursor: pointer; font-size: 12.5px;
      color: #d6d9e2; border: 1px solid rgba(255, 255, 255, 0.14);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
      transition: transform 0.25s var(--spring), border-color 0.2s, background 0.2s, color 0.2s;
      user-select: none; font-family: inherit;
    }
    .tag-chip:hover { border-color: rgba(255, 255, 255, 0.32); }
    .tag-chip.active { color: #0b0b10; font-weight: 600; background: linear-gradient(180deg, #fff, #d9d9e3); border-color: rgba(255, 255, 255, 0.6); }
    .tag-chip .cnt { opacity: 0.5; font-size: 11px; margin-left: 5px; }
    /* 月份分组 */
    .month-group { margin-bottom: 30px; }
    .month-head {
      display: flex; align-items: center; gap: 14px; margin-bottom: 12px;
      font-size: 12.5px; color: rgba(255, 255, 255, 0.45); letter-spacing: 0.03em;
    }
    .month-head strong { font-size: 14px; color: #fff; font-weight: 700; }
    .month-head .line { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(255, 255, 255, 0.16), transparent); }
    /* 胶囊行 */
    .pill-item { margin-bottom: 10px; }
    .pill-row {
      width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
      padding: 11px 20px; border-radius: 999px; cursor: pointer;
      color: #e9ebf1; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.035));
      backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 26px -14px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.09);
      transition: transform 0.3s var(--spring), background 0.25s ease, border-color 0.2s ease, box-shadow 0.25s ease;
    }
    .pill-row:hover { border-color: rgba(255, 255, 255, 0.3); background: linear-gradient(145deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.05)); transform: translateY(-1px); }
    .pill-row:active { transform: scale(0.99); }
    .pill-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--pc, rgba(154, 160, 255, 0.7)); box-shadow: 0 0 10px var(--pc, rgba(154, 160, 255, 0.5)); }
    .pill-text { flex: 1; min-width: 0; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill-tags { flex: none; display: flex; gap: 6px; }
    .pill-tags .pt { font-size: 10.5px; padding: 1px 9px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.14); color: rgba(255, 255, 255, 0.55); }
    .pill-date { flex: none; font-size: 11.5px; color: rgba(255, 255, 255, 0.4); }
    .pill-chev { flex: none; display: inline-flex; color: rgba(255, 255, 255, 0.45); }
    .pill-chev svg { width: 13px; height: 13px; transition: transform 0.4s var(--spring-soft); }
    .pill-row.open .pill-chev svg { transform: rotate(180deg); }
    /* 原地展开面板（grid-rows 平滑高度动画 + 液态玻璃） */
    .pill-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.55s var(--spring-soft); }
    .pill-panel .pp-inner { overflow: hidden; min-height: 0; }
    .pill-item.open .pill-panel { grid-template-rows: 1fr; }
    .pp-card {
      margin: 10px 2px 4px; padding: 22px 26px; border-radius: 24px; position: relative;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.04));
      backdrop-filter: blur(30px) saturate(190%); -webkit-backdrop-filter: blur(30px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 24px 70px -20px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
    .pp-card::before {
      content: ''; position: absolute; left: 0; top: 20px; bottom: 20px; width: 4px; border-radius: 4px;
      background: var(--pc, rgba(154, 160, 255, 0.65));
    }
    .pp-body { font-size: 15px; line-height: 2; color: #eef0f6; white-space: pre-wrap; word-break: break-word; }
    .pp-body code { background: rgba(255, 255, 255, 0.12); padding: 1px 7px; border-radius: 7px; font-size: 13px; }
    .pp-body a { color: #8ab4ff; }
    .pp-foot { display: flex; align-items: center; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, 0.09); flex-wrap: wrap; font-size: 12px; color: rgba(255, 255, 255, 0.5); }
    .pp-foot .t { padding: 2px 11px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.16); color: #bcd0ff; }
    .pp-copy {
      margin-left: auto; display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
      color: rgba(255, 255, 255, 0.65); background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 999px; padding: 4px 14px; font-size: 12px;
      font-family: inherit; transition: color 0.2s, border-color 0.2s;
    }
    .pp-copy:hover { color: #fff; border-color: rgba(255, 255, 255, 0.32); }
    .empty-state { text-align: center; padding: 90px 20px; color: rgba(255, 255, 255, 0.4); font-size: 14px; }
    .loading-state { text-align: center; padding: 90px 20px; }
    @media (max-width: 640px) {
      .pill-tags { display: none; }
      .search-box input { width: 90px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pill-panel { transition: none; }
      .pill-row { transition: none; }
    }
  </style>
</head>
<body>
  <!-- 灵感墙：卡片笔记以胶囊排列，点击原地展开（液态玻璃 + 苹果动画，不跳转） -->
  <header class="notes-top">
    <a class="nav-pill" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10.5 9-7.5 9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      博客
    </a>
    <span class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.6L20 9l-5 3.6L16.5 19 12 15.6 7.5 19 9 12.6 4 9l6.1-.4Z"/></svg>
      灵感
    </span>
    <span class="count-pill" id="totalPill">…</span>
    <span class="spacer"></span>
    <label class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="text" placeholder="搜索灵感…" />
    </label>
    <span id="themeMount"></span>
  </header>

  <main class="wrap">
    <div class="tag-row" id="tagRow"></div>
    <div id="groups"></div>
    <div id="loadingState" class="loading-state"><span class="loading-spinner"></span></div>
    <div id="emptyState" class="empty-state" style="display:none"></div>
  </main>

  <script>
    (function () {
      'use strict';
      if (window.ThemeManager && ThemeManager.createThemeToggle) {
        ThemeManager.createThemeToggle(document.getElementById('themeMount'));
      }

      var all = [];
      var activeTag = new URLSearchParams(location.search).get('tag') || '';
      var query = '';
      var groupsEl = document.getElementById('groups');
      var emptyEl = document.getElementById('emptyState');
      var loadingEl = document.getElementById('loadingState');

      function esc(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
      function miniMd(s) {
        return esc(s)
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
          .replace(/\n/g, '<br>');
      }
      function hashHue(t) {
        var h = 0;
        for (var i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0;
        return h % 360;
      }
      function accentOf(tags) {
        var t = (tags && tags[0]) || 'card';
        return 'hsl(' + hashHue(t) + ' 70% 62% / 0.8)';
      }
      function plainText(s) {
        return String(s || '').replace(/`/g, '').replace(/\*\*/g, '').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/\s+/g, ' ').trim();
      }
      function fmtDate(d) { return String(d || '').slice(0, 10); }
      function monthKey(d) { return String(d || '').slice(0, 7); }
      function monthLabel(k) {
        var p = k.split('-');
        return p[0] + ' 年 ' + Number(p[1]) + ' 月';
      }

      function visible() {
        return all.filter(function (c) {
          if (activeTag && !(c.tags || []).includes(activeTag)) return false;
          if (query) {
            var hay = (c.title + ' ' + (c.content || '') + ' ' + (c.tags || []).join(' ')).toLowerCase();
            if (hay.indexOf(query) < 0) return false;
          }
          return true;
        });
      }

      function renderTags() {
        var box = document.getElementById('tagRow');
        var counts = {};
        all.forEach(function (c) { (c.tags || []).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; }); });
        var names = Object.keys(counts).sort();
        var html = '<button class="tag-chip' + (activeTag ? '' : ' active') + '" data-t="__all__">全部<span class="cnt">' + all.length + '</span></button>';
        names.forEach(function (t) {
          html += '<button class="tag-chip' + (t === activeTag ? ' active' : '') + '" data-t="' + esc(t) + '">' + esc(t) + '<span class="cnt">' + counts[t] + '</span></button>';
        });
        box.innerHTML = html;
        box.querySelectorAll('.tag-chip').forEach(function (btn) {
          btn.addEventListener('click', function () {
            activeTag = btn.dataset.t === '__all__' ? '' : btn.dataset.t;
            renderTags();
            render();
            var url = new URL(location.href);
            if (activeTag) url.searchParams.set('tag', activeTag); else url.searchParams.delete('tag');
            history.replaceState(null, '', url);
          });
        });
      }

      // 手风琴：同一时间只展开一个胶囊
      function bindAccordion() {
        groupsEl.querySelectorAll('.pill-item').forEach(function (item) {
          item.querySelector('.pill-row').addEventListener('click', function () {
            var isOpen = item.classList.contains('open');
            groupsEl.querySelectorAll('.pill-item.open').forEach(function (o) { o.classList.remove('open'); });
            if (!isOpen) item.classList.add('open');
          });
          var copyBtn = item.querySelector('.pp-copy');
          if (copyBtn) copyBtn.addEventListener('click', function () {
            try {
              navigator.clipboard.writeText(copyBtn.dataset.text || '');
              copyBtn.textContent = '已复制';
              var btn = copyBtn;
              setTimeout(function () { btn.textContent = '复制内容'; }, 1600);
            } catch (e) { /* ignore */ }
          });
        });
      }

      function render() {
        var list = visible();
        document.getElementById('totalPill').textContent = list.length + ' 条';
        loadingEl.style.display = 'none';
        if (!list.length) {
          groupsEl.innerHTML = '';
          emptyEl.style.display = '';
          emptyEl.innerHTML = query
            ? '没有找到与「' + esc(query) + '」相关的灵感'
            : (activeTag ? '「' + esc(activeTag) + '」标签下还没有卡片' : '还没有卡片笔记，去后台记第一条灵感吧');
          return;
        }
        emptyEl.style.display = 'none';
        var groups = {};
        list.forEach(function (c) {
          var k = monthKey(c.date);
          (groups[k] = groups[k] || []).push(c);
        });
        var keys = Object.keys(groups).sort().reverse();
        groupsEl.innerHTML = keys.map(function (k) {
          var items = groups[k];
          return '<section class="month-group">' +
            '<div class="month-head"><strong>' + monthLabel(k) + '</strong><span>' + items.length + ' 条</span><span class="line"></span></div>' +
            items.map(function (c) {
              var accent = accentOf(c.tags);
              var text = plainText(c.content || '');
              var chip = c.title && c.title !== text.slice(0, 20) ? c.title + '：' : '';
              return '<div class="pill-item" data-id="' + c.id + '">' +
                '<button class="pill-row" style="--pc:' + accent + '">' +
                '<span class="pill-dot"></span>' +
                '<span class="pill-text">' + esc(chip + text) + '</span>' +
                '<span class="pill-tags">' + (c.tags || []).slice(0, 3).map(function (t) { return '<span class="pt">' + esc(t) + '</span>'; }).join('') + '</span>' +
                '<span class="pill-date">' + fmtDate(c.date) + '</span>' +
                '<span class="pill-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>' +
                '</button>' +
                '<div class="pill-panel"><div class="pp-inner"><div class="pp-card" style="--pc:' + accent + '">' +
                '<div class="pp-body">' + miniMd(c.content || '') + '</div>' +
                '<div class="pp-foot">' +
                (c.tags || []).map(function (t) { return '<span class="t">' + esc(t) + '</span>'; }).join('') +
                '<span>' + fmtDate(c.date) + '</span>' +
                '<button class="pp-copy" data-text="' + esc(c.content || '') + '">复制内容</button>' +
                '</div></div></div></div>' +
                '</div>';
            }).join('') +
            '</section>';
        }).join('');
        bindAccordion();
      }

      // 搜索
      var searchInput = document.getElementById('searchInput');
      var debounce = null;
      searchInput.addEventListener('input', function () {
        clearTimeout(debounce);
        debounce = setTimeout(function () {
          query = searchInput.value.trim().toLowerCase();
          render();
        }, 180);
      });

      fetch('/api/admin?action=articles', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          loadingEl.style.display = 'none';
          if (!d || d.status !== 'success' || !Array.isArray(d.data)) {
            emptyEl.style.display = '';
            emptyEl.textContent = '灵感加载失败';
            return;
          }
          all = d.data
            .filter(function (a) { return a.status === 'published' && a.type === 'card'; })
            .sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
          renderTags();
          render();
        })
        .catch(function () {
          loadingEl.style.display = 'none';
          emptyEl.style.display = '';
          emptyEl.textContent = '灵感加载失败';
        });
    })();
  </script>
</body>
</html>
