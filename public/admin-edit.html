<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>编辑内容 · 管理后台</title>
    <link rel="icon" id="siteFavicon" href="/images/Default/web-logo.webp" type="image/webp">
    <link rel="apple-touch-icon" href="/images/Default/web-logo.webp">
    <script src="/js/site-icon.js?v=1.0.0" defer></script>
<link rel="stylesheet" href="js/vendor/vditor/dist/index.css">
<script src="js/vendor/vditor/dist/index.min.js"></script>
<style>
    :root{
        --bg:#0d0e14;--bg-card:#16171f;--bg-input:rgba(255,255,255,.05);
        --border:rgba(255,255,255,.09);--border-light:rgba(255,255,255,.16);
        --text:#e8e9f2;--text-muted:#8c8fa8;--text-secondary:#b8b9c9;
        --accent:#73aaff;--danger:#ef6a5e;--success:#7bd88f;
        --radius:14px;--radius-sm:10px;
        --glass-bg:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.035));
        --glass-border:rgba(255,255,255,.12);
        --glass-blur:blur(22px) saturate(170%);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%}
    body{
        background:var(--bg);color:var(--text);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
        display:flex;flex-direction:column;overflow:hidden;
    }
    /* ===== 顶部操作条 ===== */
    .ee-top{
        display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
        padding:10px 18px;border-bottom:1px solid var(--border);
        background:rgba(22,23,31,.92);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
        flex-shrink:0;z-index:10;
    }
    .ee-left,.ee-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .ee-back{
        padding:7px 14px;border-radius:99px;text-decoration:none;
        background:rgba(255,255,255,.06);border:1px solid var(--border);
        color:var(--text-secondary);font-size:13px;transition:all .2s ease;
    }
    .ee-back:hover{background:rgba(255,255,255,.12);color:#fff}
    .ee-badge{
        padding:4px 11px;border-radius:99px;font-size:12px;
        background:rgba(115,170,255,.16);border:1px solid rgba(115,170,255,.32);color:#cfe2ff;
    }
    .ee-badge.status-pub{background:rgba(123,216,143,.14);border-color:rgba(123,216,143,.3);color:#c7f0d2}
    .ee-badge.status-draft{background:rgba(255,176,32,.14);border-color:rgba(255,176,32,.3);color:#ffe0ac}
    .ee-id{font-size:12px;color:var(--text-muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    /* 字数 / 保存状态：原来在编辑器下方那条 .ee-foot 里，现在并进顶栏右侧。
       注意别用 margin-left:auto —— 那会把后面的按钮顶开。 */
    .ee-stat{font-size:12.5px;color:var(--text-muted);white-space:nowrap}
    .ee-btn{
        padding:7px 14px;border-radius:99px;font-size:13px;font-family:inherit;cursor:pointer;
        background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--text-secondary);
        transition:all .2s ease;text-decoration:none;
    }
    .ee-btn:hover{background:rgba(255,255,255,.15);color:#fff}
    .ee-btn:active{transform:scale(.97)}
    .ee-btn.primary{
        background:linear-gradient(135deg,rgba(59,130,246,.4),rgba(115,170,255,.3));
        border-color:rgba(115,170,255,.45);color:#eaf2ff;font-weight:500;
    }
    .ee-btn.primary:hover{background:linear-gradient(135deg,rgba(59,130,246,.55),rgba(115,170,255,.45))}
    .ee-btn.danger:hover{border-color:var(--danger);color:var(--danger)}

/* 导图面板顶部的「绑定导图」条（文章没绑导图时才出现） */
.ee-mm-bar{
display:none;align-items:center;gap:10px;flex-wrap:wrap;
padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.1);
background:rgba(255,255,255,.03);font-size:13px;
}
.ee-mm-bar-label{color:var(--text-secondary)}
.ee-mm-bar select{
max-width:320px;padding:7px 10px;border-radius:10px;
background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:var(--text);
font-size:13px;font-family:inherit;outline:none;
}
.ee-mm-bar select:focus{border-color:rgba(255,255,255,.28)}
    /* ===== 主体 ===== */
    .ee-main{flex:1;min-height:0;display:flex;gap:12px;padding:12px 18px 16px;overflow:visible}
    .ee-editor-col{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
    /* 标题搬进侧栏后的样子：侧栏只有 220~320px 宽，原来那套 22px 大标题卡放不下，
       改成卡片里一个加粗的输入框，字号比普通字段大一点以示层级。 */
    .ee-title-card-side:focus-within{border-color:rgba(115,170,255,.5)}
    .ee-title-input{
        width:100%;padding:8px 11px;border-radius:var(--radius-sm);font-family:inherit;
        font-size:14.5px;font-weight:600;line-height:1.45;
        background:var(--bg-input);border:1px solid var(--border);color:var(--text);outline:none;
    }
    .ee-title-input:focus{border-color:var(--accent)}
    .ee-title-input::placeholder{color:var(--text-muted);font-weight:400}
    /* 分章条不在编辑区顶部时（标题已搬走），与编辑器之间留一点缝 */
    .ee-chapter-bar+.ee-editor-card{margin-top:10px}
    .ee-editor-card{flex:1;min-height:0;display:flex;flex-direction:column}
    /* 面板不被容器裁切 + 层级最高：容器 overflow:hidden 会把弹出面板切掉一部分 */
    html body .vditor-panel,
    html body .vditor-hint,
    html body .vditor-panel--none{
        z-index:2147483000!important;
        position:absolute!important;
        overflow:visible!important;
    }
    /* 输入区平铺整个盒子：Vditor 会给内容区动态加超大左右内边距（实测 163px）用于居中行宽 */
    html body .vditor-wysiwyg pre.vditor-reset,
    html body .vditor-ir pre.vditor-reset,
    html body .vditor-sv{
        padding-left:20px!important;
        padding-right:20px!important;
        max-width:none!important;
        margin:0!important;
        box-sizing:border-box!important;
    }
    /* 工具栏同样被 Vditor 动态加了超大左内边距（实测 163px）→ 按钮与面板位置错位 */
    html body .vditor-toolbar{
        padding-left:20px!important;
        padding-right:20px!important;
        box-sizing:border-box!important;
    }
    /* 面板：确保在视口内、可辨识（左侧亮蓝竖条便于确认新样式已生效） */
    html body .vditor-panel,
    html body .vditor-hint,
    html body .vditor-panel--none{
        border-left:3px solid #4c8dff!important;
        max-width:min(340px,92vw)!important;
        box-sizing:border-box!important;
        transform:none!important;
    }
    /* 面板文字：全部提到纯白（含嵌套元素），次要文字也调亮 */
    html body .vditor-panel,
    html body .vditor-hint,
    html body .vditor-panel--none,
    html body .vditor-panel *,
    html body .vditor-hint *,
    html body .vditor-panel--none *,
    html body .vditor-emojis,
    html body .vditor-emojis *{
        color:#ffffff!important;
        opacity:1!important;
        text-shadow:none!important;
    }
    html body .vditor-menu--current,
    html body .vditor-menu--current *{color:#a9c8ff!important;font-weight:700!important}
    html body .vditor-menu--disabled,
    html body .vditor-menu--disabled *{color:#c2c7d2!important}
    html body .vditor-emojis__tip{color:#e8ebf3!important}
    html body .vditor-panel button:hover,
    html body .vditor-hint button:hover{color:#ffffff!important;background:#3b4152!important}
    /* 正文首行留白：图片/表格/链接的浮动操作条在元素上方弹出，首行时会被内容滚动区裁掉 */
    html body .vditor-wysiwyg pre.vditor-reset,
    html body .vditor-ir pre.vditor-reset{padding-top:38px!important}
    /* 浮层本身：确保在最上层且不被裁切 */
    html body .vditor-reset .vditor-panel,
    html body .vditor-reset .vditor-panel--none{z-index:2147483000!important;overflow:visible!important}
    /* 悬浮提示（tooltip）：工具栏自身是滚动容器，会把按钮上方的提示气泡裁掉 */
    html body .vditor-toolbar{overflow:visible!important;height:auto!important}
    html body .vditor-tooltipped::after{
        z-index:2147483000!important;
        background:#000!important;
        color:#fff!important;
        border:1px solid #3a3f4d!important;
        border-radius:8px!important;
        font-size:12px!important;
        line-height:1.5!important;
        white-space:nowrap!important;
        max-width:none!important;
        opacity:1!important;
        padding:6px 10px!important;
    }
    html body .vditor-tooltipped::before{display:none!important}
    /* 块操作浮层（上移 / 下移 / 删除）：Vditor 在光标进入可移动块时自动弹出、离开即隐藏。
       早期版本用 :has 把整条 display:none 隐藏，结果无法删除图片、无法移动块
       ——整条面板都不渲染。现改为保留但收窄，避免它遮挡正文。 */
    html body .vditor-panel--none:has(button[data-type="remove"]),
    html body .vditor-panel--none:has(button[data-type="up"]){padding:3px 5px!important;opacity:.95!important;z-index:2147483000!important}
    html body .vditor-panel--none:has(button[data-type="remove"]) button,
    html body .vditor-panel--none:has(button[data-type="up"]) button{min-width:26px;min-height:26px}
    /* 正文首行不再需要额外留白 */
    html body .vditor-wysiwyg pre.vditor-reset,
    html body .vditor-ir pre.vditor-reset{padding-top:10px!important}
    /* 弹出面板黑底白字（表情/标题/编辑模式/更多） */
    .ee-editor-card .vditor{
        --panel-background-color:#14161d;
        --panel-shadow:0 16px 40px -16px rgba(0,0,0,.85);
        --toolbar-background-color:#181927;
        --toolbar-icon-color:rgba(255,255,255,.92);
        --toolbar-icon-hover-color:#73aaff;
        --second-color:rgba(255,255,255,.42);
        --border-color:rgba(255,255,255,.14);
        --textarea-background-color:#14161d;
        --textarea-text-color:#f2f3f8;
    }
    /* 弹出面板：纯黑底 + 纯白字 + 完全不透明（用 html body 提高特异性，确保压过组件样式） */
    html body .vditor{
        --panel-background-color:#000;
        --toolbar-icon-color:#fff;
        --second-color:#aaa;
        --border-color:#333;
        --textarea-background-color:#000;
        --textarea-text-color:#fff;
    }
    html body .vditor-panel,
    html body .vditor-hint,
    html body .vditor-panel--none,
    html body .vditor-emojis,
    html body .vditor-tooltipped::after{
        background:#000!important;
        background-color:#000!important;
        color:#fff!important;
        opacity:1!important;
        filter:none!important;
        backdrop-filter:none!important;
        -webkit-backdrop-filter:none!important;
        text-shadow:none!important;
        border:1px solid #3a3f4d!important;
        box-shadow:0 18px 44px -16px rgba(0,0,0,.95)!important;
        font-size:13px!important;
    }
    html body .vditor-panel button,
    html body .vditor-hint button,
    html body .vditor-panel--none button,
    html body .vditor-emojis button{
        color:#fff!important;
        background:transparent!important;
        opacity:1!important;
        font-size:13px!important;
    }
    html body .vditor-panel button:hover,
    html body .vditor-hint button:hover,
    html body .vditor-panel--none button:hover{
        background:#2c2f3a!important;
        color:#fff!important;
    }
    html body .vditor-menu--current{color:#7fb2ff!important;font-weight:600}
    html body .vditor-menu--disabled{color:#8b8f9c!important}
    html body .vditor-emojis__tip{color:#cfd3df!important}
    html body .vditor-panel--arrow:before{border-bottom-color:#000!important}
    html body .vditor-panel--arrow:after{border-bottom-color:#000!important}
    html body .vditor-input{background:#000!important;color:#fff!important;border:1px solid #3a3f4d!important}
    /* 表情面板不要过高，避免被裁切或需要大幅滚动 */
    html body .vditor-emojis{max-height:min(320px,48vh)!important;overflow:auto!important}
    .ee-editor-card .vditor{
        display:flex;flex-direction:column;border-radius:12px!important;overflow:visible;
        border:1px solid var(--glass-border)!important;box-shadow:0 12px 32px -14px rgba(0,0,0,.55)!important;
    }
    .ee-editor-card .vditor-toolbar{flex:none;background:rgba(24,25,39,.95)!important;border-bottom:1px solid rgba(255,255,255,.07)!important;backdrop-filter:blur(12px);border-radius:12px 12px 0 0!important}
    .ee-editor-card .vditor-toolbar__item{color:#fff!important;transition:all .2s ease}
    .ee-editor-card .vditor-toolbar__item--current,.ee-editor-card .vditor-toolbar__item:hover{color:var(--accent)!important}
    .ee-editor-card .vditor-toolbar [data-type="outline"]{display:none!important}
    .ee-editor-card .vditor-content{flex:1;min-height:0;background:var(--editor-bg,rgba(26,26,26,.8))!important}
    .ee-editor-card .vditor-ir,.ee-editor-card .vditor-wysiwyg,.ee-editor-card .vditor-sv{flex:1;min-width:1px;overflow-y:auto;overscroll-behavior:contain;color:var(--editor-text,#fff)!important}
    /* 这条 * 规则要排除内嵌画布（.ep-canvas-card）整棵子树：
       白板 / 导图卡片是自成一套配色的组件，Excalidraw 的菜单、图标大量用
       currentColor。以前被 !important 一刷，白色菜单面板上就出现主题色的深褐文字、
       图标也一起变色 —— 就是「这块看不清」的来源。排除后它用自己的颜色。 */
    .ee-editor-card .vditor-ir *:not(.ep-canvas-card):not(.ep-canvas-card *),
    .ee-editor-card .vditor-wysiwyg *:not(.ep-canvas-card):not(.ep-canvas-card *),
    .ee-editor-card .vditor-sv *:not(.ep-canvas-card):not(.ep-canvas-card *){color:var(--editor-text,#fff)!important}
    /* 卡片自身的基准色（画布始终是浅色底），避免它从编辑器继承主题色再往下传 */
    .ee-editor-card .vditor-ir .ep-canvas-card,
    .ee-editor-card .vditor-wysiwyg .ep-canvas-card,
    .ee-editor-card .vditor-sv .ep-canvas-card{color:#1b1b1f}
    .ee-editor-card .vditor-ir pre,.ee-editor-card .vditor-wysiwyg pre,.ee-editor-card .vditor-sv pre{background:var(--editor-pre-bg,rgba(8,8,8,.6))!important}
    .ee-editor-card .vditor-ir a:not(.ep-canvas-card *),.ee-editor-card .vditor-wysiwyg a:not(.ep-canvas-card *){color:var(--accent)!important}
    /* 表格：Vditor 的表格底色是**写死的浅色**，不是 CSS 变量 ——
           .vditor-reset table tr            { background-color: #fafbfc }
           .vditor-reset table tbody tr:nth-child(2n) { background-color: #fff }
       而上面那条 * 规则把表格文字统一接管成了 --editor-text：深色主题下 --editor-text 是 #fff，
       于是白字配 #fafbfc / #fff 的白底，整张表糊成一片（其它四个主题文字都是深色，
       所以只有 dark 主题会踩到）。这里把底色也接管过来，观感对齐阅读页：
       行透明 + 表头淡底 + 中性半透明边框。 */
    .ee-editor-card .vditor-reset table tr,
    .ee-editor-card .vditor-reset table tbody tr:nth-child(2n){background-color:transparent!important}
    .ee-editor-card .vditor-reset table th{background-color:rgba(128,128,128,.16)!important}
    .ee-editor-card .vditor-reset table th,
    .ee-editor-card .vditor-reset table td{border-color:rgba(128,128,128,.35)!important}
    /* 去掉 Vditor 的「块悬停操作条」：鼠标移到段落 / 列表项旁边时左侧冒出来的
       up（上移）/ remove（删除）小条，又小又挡道。它的功能（上下移块、删块）
       已经并进右键菜单，所以这里整条去掉。
       .vditor-panel--none 这个变体只服务于它 —— emoji 面板 / 标题下拉走的是
       --arrow 变体，不受影响（CSS 和 JS 里都确认过只有这一处在用它）。
       除了隐藏，admin-edit.js 的 after 回调里还会把它从 DOM 摘掉：
       Vditor 的 ⇧⌘X 快捷键是 popover.querySelector('[data-type="remove"]')
       拿到按钮才 click，摘掉后那个快捷键也就自然失效了。 */
    .ee-editor-card .vditor-panel--none{display:none!important}
    /* 编辑器主题（与后台一致） */
    .vditor-theme-dark{--editor-bg:rgba(26,26,26,.8);--editor-text:#fff;--editor-pre-bg:rgba(8,8,8,.6)}
    .vditor-theme-light{--editor-bg:rgba(255,255,255,.95);--editor-text:#1a1a1a;--editor-pre-bg:#f0f0f0}
    .vditor-theme-sepia{--editor-bg:rgba(244,236,216,.95);--editor-text:#3e332a;--editor-pre-bg:rgba(210,195,170,.5)}
    .vditor-theme-green{--editor-bg:rgba(199,237,204,.9);--editor-text:#1a3a1a;--editor-pre-bg:rgba(170,210,175,.5)}
    .vditor-theme-blue{--editor-bg:rgba(220,232,245,.9);--editor-text:#1a2a3a;--editor-pre-bg:rgba(190,205,225,.5)}
    /* 「保存并预览」从顶栏挪进侧栏（顶栏留给发布 / 保存这类主操作） */
    .ee-side-actions{flex:none;display:flex;margin-bottom:10px}
    .ee-side-actions .ee-btn{flex:1;text-align:center}
    /* ===== 侧栏折叠区「更多设置」 =====
       侧栏原来是一长列七八张卡片，每次发文都要在里面滚着找状态/标签/封面。
       把十天半个月才动一次的（摘要 / 信息 / 内嵌画布 / 白板管理 / 导图口令）
       收进这里，上面只留常改的。用原生 details，键盘和无障碍都白拿。 */
    .ee-side-more{flex:none}
    .ee-side-more>summary{
        display:flex;align-items:center;justify-content:space-between;gap:8px;
        padding:8px 12px;border-radius:10px;cursor:pointer;list-style:none;
        background:rgba(255,255,255,.04);border:1px solid var(--border);
        color:var(--text-secondary);font-size:12.5px;transition:background .18s ease,color .18s ease;
    }
    .ee-side-more>summary::-webkit-details-marker{display:none}
    .ee-side-more>summary:hover{background:rgba(255,255,255,.09);color:#fff}
    .ee-side-more>summary .chev{font-size:14px;line-height:1;transition:transform .18s ease}
    .ee-side-more[open]>summary .chev{transform:rotate(90deg)}
    .ee-side-more-body{display:flex;flex-direction:column;gap:10px;padding-top:10px}
    /* ===== 侧栏 ===== */
    .ee-side{width:clamp(220px,26vw,320px);flex-shrink:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding-right:2px;order:9}
    /* ===== 侧栏折叠 ===== */
    /* 吸顶：侧栏本身可滚动，折叠按钮不该被卡片顶走 */
    .ee-side-head{
        position:sticky;top:0;z-index:2;flex:none;padding:1px 2px 6px;
        display:flex;align-items:center;justify-content:space-between;gap:8px;
        background:var(--bg);
    }
    .ee-side-head>span{font-size:12px;color:var(--text-muted);letter-spacing:.5px}
    .ee-side-toggle{
        display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:99px;
        font-size:12px;font-family:inherit;cursor:pointer;
        background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text-secondary);
        transition:all .18s ease;
    }
    .ee-side-toggle:hover{background:rgba(255,255,255,.14);color:#fff}
    .ee-side-toggle .chev{font-size:14px;line-height:1;transform:translateY(-1px)}
    /* !important 用来压掉 applyDoc() 里写的 style.display = 'flex' */
    .ee-main.side-collapsed .ee-side{display:none!important}
    .ee-side-open{display:none}
    .ee-main.side-collapsed .ee-side-open{
        display:inline-flex;align-items:center;gap:4px;
        /* z-index 要高于 .ee-editor-card 的 3000，否则会被编辑器正文压住（同「弹层被盖住」那个坑） */
        position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:3100;
        padding:14px 7px;border-radius:10px 0 0 10px;cursor:pointer;font-family:inherit;
        font-size:12px;letter-spacing:1px;writing-mode:vertical-rl;
        background:rgba(115,170,255,.18);border:1px solid rgba(115,170,255,.34);border-right:none;color:#cfe2ff;
        box-shadow:-8px 0 24px -12px rgba(0,0,0,.8);transition:background .18s ease,color .18s ease;
    }

                    </div>
                    <div class="ee-card" id="eeBoardAdminCard" style="display:none">
                        <label>白板管理</label>
                        <div class="ee-ba-row"><span>画板 ID</span><span class="ee-ba-value" id="eeBaId">—</span></div>
                        <input id="eeBaTitle" placeholder="白板名称（后台白板管理列表显示）">
                        <div class="ee-ba-row"><span>访问权限</span><span class="ee-ba-value" id="eeBaEditable">—</span></div>
                        <div class="ee-cover-actions">
                            <button class="ee-btn" id="eeBaEditOn" onclick="eeSetBoardEditable(1)">开放编辑</button>
                            <button class="ee-btn" id="eeBaEditOff" onclick="eeSetBoardEditable(0)">设为只读</button>
                            <button class="ee-btn" onclick="eeSaveBoardTitle()">保存名称</button>
                        </div>
                        <div class="ee-ba-row"><span>编辑口令</span><span class="ee-ba-value" id="eeBaKey">—</span></div>
                        <input id="eeBaKeyInput" type="password" placeholder="新口令（至少 4 位）">
                        <div class="ee-cover-actions">
                            <button class="ee-btn" onclick="eeSaveBoardKey()">保存口令</button>
                            <button class="ee-btn danger" onclick="eeClearBoardKey()">清除口令</button>
                        </div>
                        <div class="ee-ba-row"><span>历史版本</span><span class="ee-ba-value" id="eeBaRev">—</span></div>
                        <select id="eeBaRevSel"><option value="">点「刷新历史」加载</option></select>
                        <div class="ee-cover-actions">
                            <button class="ee-btn" onclick="eeLoadBoardHistory()">刷新历史</button>
                            <button class="ee-btn danger" onclick="eeRollbackBoard()">回滚到所选版本</button>
                        </div>
                        <div class="ee-hint">权限、口令、名称改动即时生效；回滚会用所选快照覆盖当前画布，当前版本仍保留在历史中。</div>
                    </div>
                    <div class="ee-card" id="eeMapKeyCard" style="display:none">
                        <label>导图口令</label>
                        <div class="ee-ba-row"><span>编辑口令</span><span class="ee-ba-value" id="eeMapKey">—</span></div>
                        <input id="eeMapKeyInput" type="password" placeholder="新口令（至少 4 位）" autocomplete="new-password">
                        <div class="ee-cover-actions">
                            <button class="ee-btn" onclick="eeSaveMapKey()">保存口令</button>
                            <button class="ee-btn danger" onclick="eeClearMapKey()">清除口令</button>
                        </div>
                        <div class="ee-hint">开启后他人需要输入口令才能编辑这张导图（与白板的「编辑口令」是同一机制，只是接口不同）。</div>
                    </div>
                </div>
            </details>
        </aside>

        <!-- 侧栏折叠后的边缘展开把手 -->
        <button type="button" class="ee-side-open" id="eeSideOpen" onclick="eeToggleSide()" title="展开侧栏（Ctrl+.）" aria-hidden="true">‹ 属性</button>

        <!-- 白板 -->
        <section class="ee-board" id="eeBoard" style="display:none">
            <div class="ee-board-host" id="eeBoardHost"><div class="ee-hint">正在加载白板…</div></div>
        </section>

        <!-- 思维导图（内嵌导图页，使用同一套底部胶囊） -->
        <section class="ee-board" id="eeMindmap" style="display:none">
            <div class="ee-mm-bar" id="eeMindmapBar" style="display:none">
                <span class="ee-mm-bar-label">这篇文章还没绑定导图</span>
                <select id="eeMindmapPick"><option value="">— 选择一张已有导图 —</option></select>
                <button type="button" class="ee-btn" id="eeMindmapNew">新建一张导图</button>
                <button type="button" class="ee-btn primary" id="eeMindmapBind">绑定并保存</button>
            </div>
            <div class="ee-board-host" id="eeMindmapHost"><div class="ee-hint">正在加载导图…</div></div>
        </section>
    </main>

    <!-- 发布弹窗已按需求去掉：「发布」直接按侧栏的状态 / 标签 / 封面保存并发布，
         缺标题或正文时由 doSave() 里的胶囊提示（#eeToast）拦下。
         弹窗里独有的「编辑密钥」已搬到侧栏：白板在「白板管理」卡片，
         导图在「导图口令」卡片。 -->

    <div class="ee-picker" id="eePicker">
        <div class="ee-picker-mask" onclick="eeClosePicker()"></div>
        <div class="ee-picker-box">
            <div class="ee-picker-head"><span>从图库选择封面</span><button class="ee-btn" onclick="eeClosePicker()">关闭</button></div>
            <div class="ee-picker-grid" id="eePickerGrid"></div>
        </div>
    </div>

    <div class="ee-toast" id="eeToast"></div>
    <script src="js/markdown-config.js?v=1.2.0"></script>
<script src="js/embed-picker.js?v=1.10.0"></script>
<script src="js/editor-menu.js?v=1.0.0"></script>
<script src="js/editor-outline.js?v=1.0.0"></script>
<script src="js/tag-picker.js?v=1.0.0"></script>
    <script src="js/admin-edit.js?v=1.12.1"></script>
</body>
</html>
