<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>编辑内容 · 管理后台</title>
    <link rel="icon" id="siteFavicon" href="/images/Default/web-logo.webp" type="image/webp">
    <link rel="apple-touch-icon" href="/images/Default/web-logo.webp">
    <script src="/js/site-icon.js?v=1.0.0" defer></script>
<link rel="stylesheet" href="js/vendor/vditor/dist/index.css">
<script src="js/vendor/vditor/dist/index.min.js"></script>
<!-- 写作页样式：原来整段内联在 <style> 里（34.6KB / 156 个 !important，
     Vditor 覆盖规则还被追加过三遍），现已抽成独立文件并合并去重。
     顺序有讲究：必须排在 vditor/dist/index.css 之后，靠 html body 前缀 + !important 压过组件样式。 -->
<link rel="stylesheet" href="/css/editor-write.css?v=1.14.0">
    <link rel="stylesheet" href="/css/scrollbar.css?v=1.0.1">
    <link rel="stylesheet" href="/css/responsive.css?v=1.0.0">
    <link rel="stylesheet" href="/css/mobile.css?v=1.0.0">
    <!-- capsule.css 仍要引入 —— 加密白板的编辑口令输入框（.mm-key）用它；
         drawer.css 给留言抽屉兜底（万一其它入口把 .mm-drawer 打开）。
         注：v3.35.0 起正文不再内嵌白板 / 导图（改成文章「关联画布」），本页不再加载 embed-picker.js。 -->
    <link rel="stylesheet" href="/css/capsule.css?v=1.0.0">
    <link rel="stylesheet" href="/css/drawer.css?v=1.0.1">
    <!-- 下拉框统一深色（黑底白字 + 自绘箭头），见文件头注释 -->
    <link rel="stylesheet" href="/css/forms.css?v=1.0.0">
</head>
<body>
    <header class="ee-top">
        <div class="ee-left">
            <a class="ee-back" href="/admin.html">← 返回后台</a>
        </div>
        <div class="ee-right">
            <!-- 字数 / 保存状态原来在编辑器下方那条 .ee-foot 里，现在并到顶栏右侧。
                 字数已换成「净字数」（汉字 + 英文单词，不含 Markdown 标记），鼠标悬停看源码字符数。 -->
            <span class="ee-stat" id="eeInfo">0 字</span>
            <span class="ee-stat saved" id="eeSaved"></span>
            <!-- 下面这两个只在窄屏出现（宽屏有侧栏页签、折叠把手和整页快捷键，不必再顶到顶栏）：
                 「AI」直接切到侧栏 AI 页签；「⋯」收着 快捷键 / 前台查看 / 删除。 -->
            <button class="ee-btn ee-ai-btn" id="eeAiBtn" onclick="eeOpenAi()" title="AI 写作助手：解答写作中的疑问">AI</button>
            <button class="ee-btn ee-side-btn" id="eeSideBtn" onclick="eeToggleSide()" title="属性栏（Ctrl+.）">属性</button>
            <div class="ee-more">
                <button class="ee-btn ee-more-btn" id="eeMoreBtn" onclick="eeToggleMore(event)" title="更多操作" aria-haspopup="true">⋯</button>
                <div class="ee-more-menu" id="eeMoreMenu">
                    <button class="ee-btn" id="eeShortcutBtn" onclick="eeOpenShortcuts()">快捷键</button>
                    <button class="ee-btn" id="eeViewBtn" onclick="eeOpenFront()" style="display: none;">前台查看</button>
                    <button class="ee-btn danger" id="eeDeleteBtn" onclick="eeDelete()" style="display: none;">删除</button>
                </div>
            </div>
        </div>
    </header>

    <main class="ee-main">
        <!-- 文章 / 随记：编辑器 + 元信息。
             标题不在这里 —— 它搬到了侧栏最上方，四种形态（文章/随记/白板/导图）统一在那边写，
             因为白板和导图形态下这一整列是隐藏的，标题放这里等于没地方写。 -->
        <section class="ee-editor-col" id="eeEditorCol">
            <div class="ee-chapter-bar" id="eeChapterBar" style="display:none">
                <span class="ec-label">分章文章</span>
                <select id="eeChapterSel" onchange="eeSwitchChapter(this.value)"></select>
                <span class="ec-tip">切换章节会自动暂存当前内容，点「保存」时统一提交</span>
            </div>
            <div class="ee-editor-card"><div id="eeVditor"></div></div>
        </section>

        <aside class="ee-side" id="eeSide">
            <!-- 「属性」与「AI」是同一列的两个页签，永远只显示一个（侧栏只有一个位置）。
                 v3.44.0：外层 .ee-side-inner 让折叠动画期间内容宽度不变，不会一边收窄一边重排。 -->
            <div class="ee-side-inner">
                <div class="ee-side-head">
                    <div class="ee-side-tabs" role="tablist" aria-label="侧栏内容">
                        <button type="button" class="ee-side-tab active" id="eeTabProps" role="tab"
                                aria-selected="true" aria-controls="eeSideProps" onclick="eeSideMode('props')">属性</button>
                        <button type="button" class="ee-side-tab" id="eeTabAi" role="tab"
                                aria-selected="false" aria-controls="eeSideAi" onclick="eeSideMode('ai')">AI</button>
                    </div>
                    <button type="button" class="ee-side-toggle" id="eeSideToggle" onclick="eeToggleSide()" title="折叠侧栏（Ctrl+.）">折叠 <span class="chev">›</span></button>
                </div>
                <div class="ee-side-props" id="eeSideProps" role="tabpanel" aria-labelledby="eeTabProps">
            <!-- 标题：四种形态共用这一处（原来它在编辑区上方，白板/导图形态下那整列是隐藏的，
                 等于那两种形态根本没地方写标题）。放侧栏最上面，是发文第一个要填的东西。 -->
            <div class="ee-card ee-title-card-side">
                <label>标题<span class="ee-help" tabindex="0" role="note" aria-label="说明"
                      data-tip="必填；文章 / 随记 / 白板 / 导图都用这一处命名，保存时会同步成它们的名字。">?</span></label>
                <input id="eeTitle" class="ee-title-input" placeholder="标题" maxlength="100" autocomplete="off">
            </div>
            <div class="ee-card">
                <label>状态</label>
                <select id="eeStatusSel" onchange="eeMarkDirty()">
                    <option value="published">已发布</option>
                    <option value="draft">草稿</option>
                </select>
            </div>
            <div class="ee-card">
                <label>标签</label>
                <div id="eeTagsPicker"></div>
            </div>
            <div class="ee-card" id="eeCoverCard">
                <label>封面图</label>
                <div class="ee-cover" id="eeCover">
                    <img id="eeCoverImg" alt="封面预览">
                    <span id="eeCoverEmpty">未设置封面</span>
                </div>
                <div class="ee-cover-actions">
                    <label class="ee-btn" style="cursor:pointer">上传<input type="file" accept="image/*" id="eeCoverFile" style="display:none"></label>
                    <button class="ee-btn" onclick="eePickCover()">从图库选</button>
                    <button class="ee-btn danger" id="eeCoverClear" onclick="eeClearCover()">移除</button>
                </div>
                <input type="hidden" id="eeImage">
            </div>
            <!-- 预览 / 发布 / 保存：同一类动作，拼成一个盒子（贴边、只留分隔线）。
                 放在「更多设置」上方 —— 它是每次发文都要点的，不该藏在折叠区里。
                 「预览」不写库：把当前内容发给 /preview.html 本地渲染。 -->
            <div class="ee-action-box">
                <button class="ee-btn" id="eePreviewBtn" onclick="eePreview()" title="本地预览：不保存、不发布">预览</button>
                <button class="ee-btn primary" id="eePublishBtn" onclick="eePublishNow()">发布</button>
                <button class="ee-btn primary" id="eeSaveBtn" onclick="eeSave()">保存</button>
            </div>
            <!-- 上面是每次发文都要碰的（状态 / 标签 / 封面 / 预览发布保存）；下面这批十天半个月才动一次，
                 收进折叠区，免得侧栏永远是一长列要滚半天 -->
            <details class="ee-side-more" id="eeSideMore">
                <summary>更多设置<span class="chev">›</span></summary>
                <div class="ee-side-more-body">
                    <div class="ee-card" id="eeExcerptCard">
                        <label>摘要<span class="ee-help" tabindex="0" role="note" aria-label="说明"
                              data-tip="留空会自动从正文提取。">?</span></label>
                        <textarea id="eeExcerpt" rows="3" oninput="eeMarkDirty()"></textarea>
                    </div>
                    <!-- 关联文章（v3.36.0）：文章 ↔ 文章的关联。
                         单向存储（只存「我关联了谁」），前台再反查「谁关联了我」合并成双向，
                         所以不会有两边写入不一致的问题。随记没有详情页，不显示这块。
                         v3.44.4：卡片里的说明文字统一改成 label 旁的「?」，悬浮才展开。 -->
                    <div class="ee-card" id="eeRelatedPostsCard">
                        <label>关联文章<span class="ee-help" tabindex="0" role="note" aria-label="说明"
                              data-tip="关联后前台文末会列出「相关文章」，双方自动互相链接（对方文末也会出现这篇）。">?</span></label>
                        <div class="ee-related-list" id="eeRelatedPostsList"></div>
                        <input type="search" id="eeRelatedPostsSearch" class="ee-rel-search" placeholder="搜索标题或 id…" autocomplete="off">
                        <div class="ee-rel-results" id="eeRelatedPostsResults"></div>
                    </div>
                    <!-- 本篇术语（v3.37.0）：文内术语回链。
                         正文里选中词 → 右键「标记为术语」；词从第二次出现起自动链回定义处。
                         定义锚点默认是「首次出现那段」，也可以点「锚到当前段落」改到光标所在段。
                         v3.39.0：编辑区里用非侵入式高亮标出术语（锚点橙色实线、其余蓝色虚线），
                         面板显示每词出现次数并可「定位」；高亮不写进正文，Markdown 源码保持干净。 -->
                    <div class="ee-card" id="eeTermsCard">
                        <label>本篇术语<span class="ee-help" tabindex="0" role="note" aria-label="说明"
                              data-tip="正文里选中一个词 → 右键「标记为术语」。读者在第二次出现处可悬停看定义、点击跳回。">?</span></label>
                        <div class="ee-related-list" id="eeTermsList"></div>
                    </div>
                    <!-- 关联画布：白板 / 导图挂在文章上，不再「插入正文」。
                         关联存在文章的 canvasRefs 字段，前台在文末「相关画布」区展示；
                         点整行去前台看 / 改那块画布，× 解除关联。 -->
                    <div class="ee-card" id="eeRelatedCard">
                        <label>关联画布<span class="ee-help" tabindex="0" role="note" aria-label="说明"
                              data-tip="正文只写文字；白板 / 导图作为「相关画布」挂在文章上，前台文末列出。新画布请先去「新建」页创建。">?</span></label>
                        <div class="ee-related-list" id="eeRelatedList"></div>
                        <div class="ee-related-add">
                            <select id="eeRelatedBoardSel" aria-label="选择要关联的白板"><option value="">选择一块白板…</option></select>
                            <button type="button" class="ee-btn" onclick="eeLinkCanvas('board')">关联</button>
                        </div>
                        <div class="ee-related-add">
                            <select id="eeRelatedMapSel" aria-label="选择要关联的导图"><option value="">选择一张导图…</option></select>
                            <button type="button" class="ee-btn" onclick="eeLinkCanvas('map')">关联</button>
                        </div>
                    </div>
                    <div class="ee-card" id="eeBoardAdminCard" style="display:none">
                        <label>白板管理<span class="ee-help" tabindex="0" role="note" aria-label="说明"
                              data-tip="权限与口令改动即时生效；回滚会用所选快照覆盖当前画布，当前版本仍保留在历史中。">?</span></label>
                        <!-- 白板名称的改名入口已去掉：侧栏顶部的「标题」就是它的名字，
                             保存时会自动同步到白板的 meta.title（后台白板管理列表读的是那个）。
                             画板 ID 那一行也去掉了 —— 它对作者没有可操作价值。 -->
                        <div class="ee-ba-row"><span>访问权限</span><span class="ee-ba-value" id="eeBaEditable">—</span></div>
                        <div class="ee-cover-actions">
                            <button class="ee-btn" id="eeBaEditOn" onclick="eeSetBoardEditable(1)">开放编辑</button>
                            <button class="ee-btn" id="eeBaEditOff" onclick="eeSetBoardEditable(0)">设为只读</button>
                        </div>
                        <div class="ee-ba-row"><span>编辑口令</span><span class="ee-ba-value" id="eeBaKey">—</span></div>
                        <!-- 输入框 + 行内「添加」；已经设过口令时右侧再出现「清除」 -->
                        <div class="ee-ba-key-row">
                            <input id="eeBaKeyInput" type="password" placeholder="新口令（至少 4 位）" autocomplete="new-password">
                            <button class="ee-btn" onclick="eeSaveBoardKey()">添加</button>
                            <button class="ee-btn danger" id="eeBaKeyClear" onclick="eeClearBoardKey()" style="display:none">清除</button>
                        </div>
                        <div class="ee-ba-row"><span>历史版本</span><span class="ee-ba-value" id="eeBaRev">—</span></div>
                        <select id="eeBaRevSel"><option value="">点「刷新历史」加载</option></select>
                        <div class="ee-cover-actions">
                            <button class="ee-btn" onclick="eeLoadBoardHistory()">刷新历史</button>
                            <button class="ee-btn danger" onclick="eeRollbackBoard()">回滚到所选版本</button>
                        </div>
                    </div>
                    <div class="ee-card" id="eeMapKeyCard" style="display:none">
                        <div class="ee-ba-row"><span>编辑口令</span><span class="ee-ba-value" id="eeMapKey">—</span></div>
                        <div class="ee-ba-key-row">
                            <input id="eeMapKeyInput" type="password" placeholder="新口令（至少 4 位）" autocomplete="new-password">
                            <button class="ee-btn" onclick="eeSaveMapKey()">添加</button>
                            <button class="ee-btn danger" id="eeMapKeyClear" onclick="eeClearMapKey()" style="display:none">清除</button>
                        </div>
                    </div>
                    <!-- 信息是纯展示，放最后：翻它的频率最低，挡在前面反而碍事 -->
                    <div class="ee-card">
                        <label>信息</label>
                        <div class="ee-meta-list" id="eeMeta"></div>
                    </div>
                </div>
            </details>
                </div>
                <!-- AI 写作助手（v3.44.0）：由 write-ai.js 填内容。
                     只做问答：不读正文、不改正文，密钥留在服务端（action=ai-write 代调）。 -->
                <div class="ee-side-ai" id="eeSideAi" role="tabpanel" aria-labelledby="eeTabAi" hidden></div>
            </div>
        </aside>

        <!-- 窄屏抽屉的遮罩（桌面端 display:none，由 CSS 控制） -->
        <div class="ee-side-mask" id="eeSideMask"></div>

        <!-- 侧栏折叠后的边缘展开把手：属性 / AI 两个入口，点哪个就展开到哪个页签 -->
        <div class="ee-side-open" id="eeSideOpen" aria-hidden="true">
            <button type="button" class="ee-side-open-btn" id="eeSideOpenProps"
                    onclick="eeOpenSide('props')" title="展开属性栏（Ctrl+.）">‹ 属性</button>
            <button type="button" class="ee-side-open-btn" id="eeSideOpenAi"
                    onclick="eeOpenSide('ai')" title="展开 AI 助手">‹ AI</button>
        </div>

        <!-- 白板 -->
        <section class="ee-board" id="eeBoard" style="display:none">
            <div class="ee-board-host" id="eeBoardHost"><div class="ee-hint">正在加载白板…</div></div>
        </section>

        <!-- 思维导图（内嵌导图页，使用同一套底部胶囊） -->
        <section class="ee-board" id="eeMindmap" style="display:none">
            <div class="ee-mm-bar" id="eeMindmapBar" style="display:none">
                <span class="ee-mm-bar-label">这篇文章还没绑定导图</span>
                <select id="eeMindmapPick"><option value="">— 选择一张已有导图 —</option></select>
                <button type="button" class="ee-btn" id="eeMindmapNew">新建一张导图</button>
                <button type="button" class="ee-btn primary" id="eeMindmapBind">绑定并保存</button>
            </div>
            <div class="ee-board-host" id="eeMindmapHost"><div class="ee-hint">正在加载导图…</div></div>
        </section>
    </main>

    <!-- 插入链接面板（v3.38.0）：右键「插入站内链接」/「链接到本文标题」打开。
         列表可搜索，选中后自动在光标处写出 Markdown：`[文字](地址)`。 -->
    <div class="ee-linkpicker" id="eeLinkPicker">
        <div class="ee-linkpicker-mask" id="eeLinkPickerMask"></div>
        <div class="ee-linkpicker-box">
            <div class="ee-linkpicker-head">
                <span id="eeLinkPickerTitle">插入链接</span>
                <button type="button" class="ee-btn" onclick="eeCloseLinkPicker()">关闭</button>
            </div>
            <div class="ee-linkpicker-hint" id="eeLinkPickerThumb"></div>
            <input type="search" id="eeLinkPickerSearch" class="ee-rel-search" placeholder="搜索…" autocomplete="off">
            <div class="ee-linkpicker-list" id="eeLinkPickerList"></div>
        </div>
    </div>

    <!-- 发布弹窗已按需求去掉：「发布」直接按侧栏的状态 / 标签 / 封面保存并发布，
         缺标题或正文时由 doSave() 里的胶囊提示（#eeToast）拦下。
         弹窗里独有的「编辑密钥」已搬到侧栏：白板在「白板管理」卡片，
         导图在「导图口令」卡片。 -->

    <div class="ee-picker" id="eePicker">
        <div class="ee-picker-mask" onclick="eeClosePicker()"></div>
        <div class="ee-picker-box">
            <div class="ee-picker-head"><span>从图库选择封面</span><button class="ee-btn" onclick="eeClosePicker()">关闭</button></div>
            <div class="ee-picker-grid" id="eePickerGrid"></div>
        </div>
    </div>

    <div class="ee-toast" id="eeToast"></div>
    <script src="js/vendor/marked.min.js"></script>
    <script src="js/markdown-config.js?v=1.4.0"></script>
<script src="js/editor-menu.js?v=1.6.0"></script>
<script src="js/selection-toolbar.js?v=1.1.0"></script>
<script src="js/code-editor.js?v=2.0.0"></script>
<script src="js/editor-outline.js?v=1.0.0"></script>
<script src="js/tag-picker.js?v=1.0.0"></script>
    <!-- 基础设施（提示 / 请求兜底 / 自绘确认框 / 净字数 / 本地草稿 / 快捷键面板 / 旧内嵌块迁移） -->
    <script src="js/editor-kit.js?v=1.1.1"></script>
    <!-- 白板与导图管理（权限 / 口令 / 历史回滚 / 绑定），由 admin-edit.js 注入上下文 -->
    <script src="js/editor-embed-admin.js?v=1.0.0"></script>
    <!-- 侧栏「AI」页签：写作问答助手（只读，不碰正文） -->
    <script src="js/write-ai.js?v=1.2.1"></script>
    <script src="js/admin-edit.js?v=1.32.2"></script>
</body>
</html>
