<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>编辑内容 · 管理后台</title>
    <link rel="icon" id="siteFavicon" href="/images/Default/web-logo.webp" type="image/webp">
    <link rel="apple-touch-icon" href="/images/Default/web-logo.webp">
    <script src="/js/site-icon.js?v=1.0.0"></script>
<link rel="stylesheet" href="js/vendor/vditor/dist/index.css">
<script src="js/vendor/vditor/dist/index.min.js"></script>
<style>
    :root{
        --bg:#0d0e14;--bg-card:#16171f;--bg-input:rgba(255,255,255,.05);
        --border:rgba(255,255,255,.09);--border-light:rgba(255,255,255,.16);
        --text:#e8e9f2;--text-muted:#8c8fa8;--text-secondary:#b8b9c9;
        --accent:#73aaff;--danger:#ef6a5e;--success:#7bd88f;
        --radius:14px;--radius-sm:10px;
        --glass-bg:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.035));
        --glass-border:rgba(255,255,255,.12);
        --glass-blur:blur(22px) saturate(170%);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%}
    body{
        background:var(--bg);color:var(--text);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
        display:flex;flex-direction:column;overflow:hidden;
    }
    /* ===== 顶部操作条 ===== */
    .ee-top{
        display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
        padding:10px 18px;border-bottom:1px solid var(--border);
        background:rgba(22,23,31,.92);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
        flex-shrink:0;z-index:10;
    }
    .ee-left,.ee-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .ee-back{
        padding:7px 14px;border-radius:99px;text-decoration:none;
        background:rgba(255,255,255,.06);border:1px solid var(--border);
        color:var(--text-secondary);font-size:13px;transition:all .2s ease;
    }
    .ee-back:hover{background:rgba(255,255,255,.12);color:#fff}
    .ee-badge{
        padding:4px 11px;border-radius:99px;font-size:12px;
        background:rgba(115,170,255,.16);border:1px solid rgba(115,170,255,.32);color:#cfe2ff;
    }
    .ee-badge.status-pub{background:rgba(123,216,143,.14);border-color:rgba(123,216,143,.3);color:#c7f0d2}
    .ee-badge.status-draft{background:rgba(255,176,32,.14);border-color:rgba(255,176,32,.3);color:#ffe0ac}
    .ee-id{font-size:12px;color:var(--text-muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .ee-btn{
        padding:7px 14px;border-radius:99px;font-size:13px;font-family:inherit;cursor:pointer;
        background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--text-secondary);
        transition:all .2s ease;text-decoration:none;
    }
    .ee-btn:hover{background:rgba(255,255,255,.15);color:#fff}
    .ee-btn:active{transform:scale(.97)}
    .ee-btn.primary{
        background:linear-gradient(135deg,rgba(59,130,246,.4),rgba(115,170,255,.3));
        border-color:rgba(115,170,255,.45);color:#eaf2ff;font-weight:500;
    }
    .ee-btn.primary:hover{background:linear-gradient(135deg,rgba(59,130,246,.55),rgba(115,170,255,.45))}
    .ee-btn.danger:hover{border-color:var(--danger);color:var(--danger)}
    /* ===== 主体 ===== */
    .ee-main{flex:1;min-height:0;display:flex;gap:12px;padding:12px 18px 16px;overflow:visible}
    .ee-editor-col{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
    .ee-title-card{
        background:linear-gradient(135deg,#252b48,#2e2240);border:1px solid rgba(255,255,255,.07);
        border-radius:12px;padding:10px 18px;flex-shrink:0;transition:box-shadow .22s ease;
    }
    .ee-title-card:focus-within{box-shadow:0 0 0 1px rgba(115,170,255,.5)}
    .ee-title{width:100%;background:transparent;border:none;outline:none;color:#e4e6f7;font-size:22px;font-weight:600;font-family:inherit}
    .ee-title::placeholder{color:rgba(228,230,247,.35);font-weight:400}
    .ee-editor-card{flex:1;min-height:0;margin-top:10px;display:flex;flex-direction:column}
    /* 面板不被容器裁切 + 层级最高：容器 overflow:hidden 会把弹出面板切掉一部分 */
    html body .vditor-panel,
    html body .vditor-hint,
    html body .vditor-panel--none{
        z-index:2147483000!important;
        position:absolute!important;
        overflow:visible!important;
    }
    /* 输入区平铺整个盒子：Vditor 会给内容区动态加超大左右内边距（实测 163px）用于居中行宽 */
    html body .vditor-wysiwyg pre.vditor-reset,
    html body .vditor-ir pre.vditor-reset,
    html body .vditor-sv{
        padding-left:20px!important;
        padding-right:20px!important;
        max-width:none!important;
        margin:0!important;
        box-sizing:border-box!important;
    }
    /* 工具栏同样被 Vditor 动态加了超大左内边距（实测 163px）→ 按钮与面板位置错位 */
    html body .vditor-toolbar{
        padding-left:20px!important;
        padding-right:20px!important;
        box-sizing:border-box!important;
    }
    /* 面板：确保在视口内、可辨识（左侧亮蓝竖条便于确认新样式已生效） */
    html body .vditor-panel,
    html body .vditor-hint,
    html body .vditor-panel--none{
        border-left:3px solid #4c8dff!important;
        max-width:min(340px,92vw)!important;
        box-sizing:border-box!important;
        transform:none!important;
    }
    /* 面板文字：全部提到纯白（含嵌套元素），次要文字也调亮 */
    html body .vditor-panel,
    html body .vditor-hint,
    html body .vditor-panel--none,
    html body .vditor-panel *,
    html body .vditor-hint *,
    html body .vditor-panel--none *,
    html body .vditor-emojis,
    html body .vditor-emojis *{
        color:#ffffff!important;
        opacity:1!important;
        text-shadow:none!important;
    }
    html body .vditor-menu--current,
    html body .vditor-menu--current *{color:#a9c8ff!important;font-weight:700!important}
    html body .vditor-menu--disabled,
    html body .vditor-menu--disabled *{color:#c2c7d2!important}
    html body .vditor-emojis__tip{color:#e8ebf3!important}
    html body .vditor-panel button:hover,
    html body .vditor-hint button:hover{color:#ffffff!important;background:#3b4152!important}
    /* 正文首行留白：图片/表格/链接的浮动操作条在元素上方弹出，首行时会被内容滚动区裁掉 */
    html body .vditor-wysiwyg pre.vditor-reset,
    html body .vditor-ir pre.vditor-reset{padding-top:38px!important}
    /* 浮层本身：确保在最上层且不被裁切 */
    html body .vditor-reset .vditor-panel,
    html body .vditor-reset .vditor-panel--none{z-index:2147483000!important;overflow:visible!important}
    /* 悬浮提示（tooltip）：工具栏自身是滚动容器，会把按钮上方的提示气泡裁掉 */
    html body .vditor-toolbar{overflow:visible!important;height:auto!important}
    html body .vditor-tooltipped::after{
        z-index:2147483000!important;
        background:#000!important;
        color:#fff!important;
        border:1px solid #3a3f4d!important;
        border-radius:8px!important;
        font-size:12px!important;
        line-height:1.5!important;
        white-space:nowrap!important;
        max-width:none!important;
        opacity:1!important;
        padding:6px 10px!important;
    }
    html body .vditor-tooltipped::before{display:none!important}
    /* 弹出面板黑底白字（表情/标题/编辑模式/更多） */
    .ee-editor-card .vditor{
        --panel-background-color:#14161d;
        --panel-shadow:0 16px 40px -16px rgba(0,0,0,.85);
        --toolbar-background-color:#181927;
        --toolbar-icon-color:rgba(255,255,255,.92);
        --toolbar-icon-hover-color:#73aaff;
        --second-color:rgba(255,255,255,.42);
        --border-color:rgba(255,255,255,.14);
        --textarea-background-color:#14161d;
        --textarea-text-color:#f2f3f8;
    }
    /* 弹出面板：纯黑底 + 纯白字 + 完全不透明（用 html body 提高特异性，确保压过组件样式） */
    html body .vditor{
        --panel-background-color:#000;
        --toolbar-icon-color:#fff;
        --second-color:#aaa;
        --border-color:#333;
        --textarea-background-color:#000;
        --textarea-text-color:#fff;
    }
    html body .vditor-panel,
    html body .vditor-hint,
    html body .vditor-panel--none,
    html body .vditor-emojis,
    html body .vditor-tooltipped::after{
        background:#000!important;
        background-color:#000!important;
        color:#fff!important;
        opacity:1!important;
        filter:none!important;
        backdrop-filter:none!important;
        -webkit-backdrop-filter:none!important;
        text-shadow:none!important;
        border:1px solid #3a3f4d!important;
        box-shadow:0 18px 44px -16px rgba(0,0,0,.95)!important;
        font-size:13px!important;
    }
    html body .vditor-panel button,
    html body .vditor-hint button,
    html body .vditor-panel--none button,
    html body .vditor-emojis button{
        color:#fff!important;
        background:transparent!important;
        opacity:1!important;
        font-size:13px!important;
    }
    html body .vditor-panel button:hover,
    html body .vditor-hint button:hover,
    html body .vditor-panel--none button:hover{
        background:#2c2f3a!important;
        color:#fff!important;
    }
    html body .vditor-menu--current{color:#7fb2ff!important;font-weight:600}
    html body .vditor-menu--disabled{color:#8b8f9c!important}
    html body .vditor-emojis__tip{color:#cfd3df!important}
    html body .vditor-panel--arrow:before{border-bottom-color:#000!important}
    html body .vditor-panel--arrow:after{border-bottom-color:#000!important}
    html body .vditor-input{background:#000!important;color:#fff!important;border:1px solid #3a3f4d!important}
    /* 表情面板不要过高，避免被裁切或需要大幅滚动 */
    html body .vditor-emojis{max-height:min(320px,48vh)!important;overflow:auto!important}
    .ee-editor-card .vditor{
        display:flex;flex-direction:column;border-radius:12px!important;overflow:visible;
        border:1px solid var(--glass-border)!important;box-shadow:0 12px 32px -14px rgba(0,0,0,.55)!important;
    }
    .ee-editor-card .vditor-toolbar{flex:none;background:rgba(24,25,39,.95)!important;border-bottom:1px solid rgba(255,255,255,.07)!important;backdrop-filter:blur(12px);border-radius:12px 12px 0 0!important}
    .ee-editor-card .vditor-toolbar__item{color:#fff!important;transition:all .2s ease}
    .ee-editor-card .vditor-toolbar__item--current,.ee-editor-card .vditor-toolbar__item:hover{color:var(--accent)!important}
    .ee-editor-card .vditor-toolbar [data-type="outline"]{display:none!important}
    .ee-editor-card .vditor-content{flex:1;min-height:0;background:var(--editor-bg,rgba(26,26,26,.8))!important}
    .ee-editor-card .vditor-ir,.ee-editor-card .vditor-wysiwyg,.ee-editor-card .vditor-sv{flex:1;min-width:1px;overflow-y:auto;overscroll-behavior:contain;color:var(--editor-text,#fff)!important}
    .ee-editor-card .vditor-ir *,.ee-editor-card .vditor-wysiwyg *,.ee-editor-card .vditor-sv *{color:var(--editor-text,#fff)!important}
    .ee-editor-card .vditor-ir pre,.ee-editor-card .vditor-wysiwyg pre,.ee-editor-card .vditor-sv pre{background:var(--editor-pre-bg,rgba(8,8,8,.6))!important}
    .ee-editor-card .vditor-ir a,.ee-editor-card .vditor-wysiwyg a{color:var(--accent)!important}
    /* 编辑器主题（与后台一致） */
    .vditor-theme-dark{--editor-bg:rgba(26,26,26,.8);--editor-text:#fff;--editor-pre-bg:rgba(8,8,8,.6)}
    .vditor-theme-light{--editor-bg:rgba(255,255,255,.95);--editor-text:#1a1a1a;--editor-pre-bg:#f0f0f0}
    .vditor-theme-sepia{--editor-bg:rgba(244,236,216,.95);--editor-text:#3e332a;--editor-pre-bg:rgba(210,195,170,.5)}
    .vditor-theme-green{--editor-bg:rgba(199,237,204,.9);--editor-text:#1a3a1a;--editor-pre-bg:rgba(170,210,175,.5)}
    .vditor-theme-blue{--editor-bg:rgba(220,232,245,.9);--editor-text:#1a2a3a;--editor-pre-bg:rgba(190,205,225,.5)}
    .ee-foot{
        margin-top:10px;display:flex;align-items:center;gap:14px;flex-shrink:0;
        background:rgba(25,27,44,.9);border:1px solid rgba(255,255,255,.07);border-radius:12px;
        padding:8px 14px;font-size:12.5px;color:#999bb3;
    }
    .ee-foot .saved{margin-left:auto;color:var(--success)}
    /* ===== 侧栏 ===== */
    .ee-side{width:clamp(220px,26vw,320px);flex-shrink:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding-right:2px;order:9}
    .ee-card{
        background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
        padding:12px 14px;display:flex;flex-direction:column;gap:8px;
    }
    .ee-card label{font-size:12px;color:var(--text-muted)}
    .ee-card input,.ee-card textarea,.ee-card select{
        width:100%;padding:8px 11px;border-radius:var(--radius-sm);font-family:inherit;font-size:13px;
        background:var(--bg-input);border:1px solid var(--border);color:var(--text);outline:none;resize:vertical;
    }
    .ee-card input:focus,.ee-card textarea:focus,.ee-card select:focus{border-color:var(--accent)}
    .ee-cover{
        position:relative;height:130px;border-radius:var(--radius-sm);border:1px dashed var(--border);
        background:#0a0b10;display:flex;align-items:center;justify-content:center;overflow:hidden;
        font-size:11.5px;color:var(--text-muted);
    }
    .ee-cover img{width:100%;height:100%;object-fit:cover;display:none}
    .ee-cover-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    .ee-cover-actions .ee-btn{height:30px;justify-content:center;margin:0}
    .ee-cover-actions label.ee-btn,.ee-modal-field label.ee-btn{
        display:inline-flex;align-items:center;justify-content:center;
        margin:0;font-size:12.5px;color:#e8e8ea;
    }
    .ee-cover-actions .ee-btn{font-size:12.5px;padding:6px 12px}
    /* 发布弹窗 */
    .ee-modal{position:fixed;inset:0;z-index:2500;display:none}
    .ee-modal.open{display:flex;align-items:center;justify-content:center}
    .ee-modal-mask{position:absolute;inset:0;background:rgba(5,5,9,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
    .ee-modal-box{position:relative;display:flex;flex-direction:column;width:min(440px,92vw);max-height:88vh;overflow:hidden;padding:22px;border-radius:20px;background:linear-gradient(145deg,rgba(34,34,42,.97),rgba(18,18,24,.96));border:1px solid rgba(255,255,255,.13);box-shadow:0 30px 90px -20px rgba(0,0,0,.8)}
    .ee-modal-box h3{font-size:16px;font-weight:700;color:var(--accent);margin:0 0 6px}
    .ee-modal-sub{font-size:12.5px;color:var(--text-muted);line-height:1.7;margin-bottom:14px}
    .ee-modal-field{margin-bottom:12px}
    .ee-modal-field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px}
    .ee-modal-field input,.ee-modal-field select{width:100%;padding:9px 12px;border-radius:var(--radius-sm);background:var(--bg-input);border:1px solid var(--border);color:var(--text);font-size:13px;font-family:inherit}
    .ee-modal-field input:focus,.ee-modal-field select:focus{outline:none;border-color:var(--accent)}
    .ee-modal-actions{flex:none;display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
    #eePublishModal .ee-modal-field{flex:1;min-height:0;overflow-y:auto;padding-right:4px}
    .ee-modal-tip{font-size:12px;color:#ffb4ad;min-height:16px;margin-top:8px;line-height:1.6}
    /* 图库选择弹窗 */
    .ee-picker{position:fixed;inset:0;z-index:2400;display:none}
    .ee-picker.open{display:flex;align-items:center;justify-content:center}
    .ee-picker-mask{position:absolute;inset:0;background:rgba(5,5,9,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
    .ee-picker-box{position:relative;width:min(780px,94vw);max-height:80vh;display:flex;flex-direction:column;background:var(--bg-card);border:1px solid var(--border-light);border-radius:18px;overflow:hidden;box-shadow:0 30px 90px -20px rgba(0,0,0,.8)}
    .ee-picker-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text-secondary)}
    .ee-picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding:14px;overflow-y:auto}
    .ee-picker-item{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--border);cursor:pointer;background:#000;aspect-ratio:1/1;transition:border-color .18s ease,transform .18s ease}
    .ee-picker-item:hover{border-color:var(--accent);transform:translateY(-2px)}
    .ee-picker-item img{width:100%;height:100%;object-fit:cover;display:block}
    .ee-picker-item span{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-size:10px;color:#dfe3f5;background:rgba(8,9,14,.72);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .ee-picker-empty{grid-column:1/-1;text-align:center;color:var(--text-muted);font-size:12.5px;padding:26px 0}
    .ee-meta-list{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--text-muted)}
    .ee-meta-list b{color:var(--text-secondary);font-weight:500}
    /* ===== 白板 ===== */
    .ee-board{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}
    .ee-board-bar{
        display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0;
        background:linear-gradient(135deg,#252b48,#2e2240);border:1px solid rgba(255,255,255,.07);
        border-radius:12px;padding:10px 16px;font-size:13px;color:var(--text-secondary);
    }
    .ee-board-bar .sp{flex:1}
    .ee-board-host{flex:1;min-height:0;background:rgba(18,20,32,.55);border-radius:12px;overflow:hidden;position:relative;border:1px dashed rgba(255,255,255,.12)}
    .ee-board-host>[data-excalidraw]{height:100%}
    .ee-frame{width:100%;height:100%;border:0;display:block;background:#0b0b0e}
    .ee-hint{height:100%;display:flex;align-items:center;justify-content:center;color:#8a8fa3;font-size:13px}
    /* ===== 提示 ===== */
    .ee-toast{
        position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);
        background:rgba(20,21,30,.96);border:1px solid var(--border-light);border-radius:12px;
        padding:10px 18px;font-size:13px;color:var(--text);opacity:0;pointer-events:none;
        transition:all .25s ease;z-index:60;box-shadow:0 16px 40px -14px rgba(0,0,0,.7);
    }
    .ee-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .ee-toast.error{border-color:rgba(239,106,94,.5);color:#ffd9d5}
    .ee-toast.success{border-color:rgba(123,216,143,.45);color:#d7f5df}
    /* 窄屏也保持「左编辑区 + 右功能区」的左右格式，只收缩尺寸不堆叠 */
    @media(max-width:900px){
        .ee-main{padding:10px 12px 12px;gap:10px}
        .ee-side{width:clamp(190px,32vw,260px)}
        .ee-title{font-size:19px}
        .ee-cover{height:104px}
    }
</style>
    <link rel="stylesheet" href="/css/scrollbar.css?v=1.0.1">
</head>
<body>
    <header class="ee-top">
        <div class="ee-left">
            <a class="ee-back" href="/admin.html">← 返回后台</a>
            <span class="ee-badge" id="eeTypeBadge">加载中</span>
            <span class="ee-badge" id="eeStatusBadge">—</span>
            <span class="ee-id" id="eeIdText"></span>
        </div>
        <div class="ee-right">
            <button class="ee-btn" id="eeViewBtn" onclick="eeOpenFront()">前台查看</button>
            <button class="ee-btn primary" id="eePublishBtn" onclick="eeOpenPublish()">发布</button>
            <button class="ee-btn danger" onclick="eeDelete()">删除</button>
            <button class="ee-btn" onclick="eeSavePreview()">保存并预览</button>
            <button class="ee-btn primary" id="eeSaveBtn" onclick="eeSave()">保存</button>
        </div>
    </header>

    <main class="ee-main">
        <!-- 文章 / 随记：编辑器 + 元信息 -->
        <section class="ee-editor-col" id="eeEditorCol">
            <div class="ee-title-card">
                <input id="eeTitle" class="ee-title" placeholder="标题" maxlength="100" autocomplete="off">
            </div>
            <div class="ee-editor-card"><div id="eeVditor"></div></div>
            <div class="ee-foot"><span id="eeInfo">0 字</span><span class="saved" id="eeSaved"></span></div>
        </section>

        <aside class="ee-side" id="eeSide">
            <div class="ee-card">
                <label>状态</label>
                <select id="eeStatusSel" onchange="eeMarkDirty()">
                    <option value="published">已发布</option>
                    <option value="draft">草稿</option>
                </select>
            </div>
            <div class="ee-card">
                <label>标签（逗号分隔）</label>
                <input id="eeTags" placeholder="如：技术, 随笔" oninput="eeMarkDirty()">
            </div>
            <div class="ee-card" id="eeExcerptCard">
                <label>摘要（留空自动提取）</label>
                <textarea id="eeExcerpt" rows="3" oninput="eeMarkDirty()"></textarea>
            </div>
            <div class="ee-card" id="eeCoverCard">
                <label>封面图</label>
                <div class="ee-cover" id="eeCover">
                    <img id="eeCoverImg" alt="封面预览">
                    <span id="eeCoverEmpty">未设置封面</span>
                </div>
                <div class="ee-cover-actions">
                    <label class="ee-btn" style="cursor:pointer">上传<input type="file" accept="image/*" id="eeCoverFile" style="display:none"></label>
                    <button class="ee-btn" onclick="eePickCover()">从图库选</button>
                    <button class="ee-btn danger" id="eeCoverClear" onclick="eeClearCover()">移除</button>
                </div>
                <input type="hidden" id="eeImage">
            </div>
            <div class="ee-card">
                <label>信息</label>
                <div class="ee-meta-list" id="eeMeta"></div>
            </div>
        </aside>

        <!-- 白板 -->
        <section class="ee-board" id="eeBoard" style="display:none">
            <div class="ee-board-bar">
                <span>画板内容独立保存，前台以整页白板展示</span>
                <span class="sp"></span>
                <button class="ee-btn primary" onclick="eeSaveBoard()">保存画板</button>
                <a class="ee-btn" id="eeBoardOpen" target="_blank" rel="noopener">独立窗口打开</a>
            </div>
            <div class="ee-board-host" id="eeBoardHost"><div class="ee-hint">正在加载白板…</div></div>
        </section>
    </main>

    <div class="ee-modal" id="eePublishModal">
        <div class="ee-modal-mask" onclick="eeClosePublish()"></div>
        <div class="ee-modal-box">
            <h3>发布</h3>
            <div class="ee-modal-sub">确定后会保存当前内容；状态选「草稿」即为下架。</div>
            <div class="ee-modal-field">
                <label>状态</label>
                <select id="eePubStatus">
                    <option value="published">发布</option>
                    <option value="draft">草稿（下架）</option>
                </select>
            </div>
            <div class="ee-modal-field">
                <label>标签（逗号分隔）</label>
                <input type="text" id="eePubTags" placeholder="如：白板, 灵感">
            </div>
            <div class="ee-modal-field">
                <label>封面图</label>
                <div class="ee-cover" id="eePubCoverBox">
                    <img id="eePubCoverImg" alt="封面预览">
                    <span id="eePubCoverEmpty">未设置封面</span>
                </div>
                <div class="ee-cover-actions" style="margin-top:8px">
                    <label class="ee-btn" style="cursor:pointer">上传封面<input type="file" accept="image/*" id="eePubCoverFile" style="display:none"></label>
                    <button type="button" class="ee-btn" onclick="eePickCover()">从图库选封面</button>
                    <button type="button" class="ee-btn danger" onclick="eeClearCover()">移除封面</button>
                </div>
            </div>
            <div class="ee-modal-actions">
                <button type="button" class="ee-btn" onclick="eeClosePublish()">取消</button>
                <button type="button" class="ee-btn primary" id="eePubOk" onclick="eeConfirmPublish()">确定</button>
            </div>
            <div class="ee-modal-tip" id="eePubTip"></div>
        </div>
    </div>

    <div class="ee-picker" id="eePicker">
        <div class="ee-picker-mask" onclick="eeClosePicker()"></div>
        <div class="ee-picker-box">
            <div class="ee-picker-head"><span>从图库选择封面</span><button class="ee-btn" onclick="eeClosePicker()">关闭</button></div>
            <div class="ee-picker-grid" id="eePickerGrid"></div>
        </div>
    </div>

    <div class="ee-toast" id="eeToast"></div>
    <script src="js/admin-edit.js?v=1.1.2"></script>
</body>
</html>
