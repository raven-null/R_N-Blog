<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 渡鸦_NULL BLOG</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0a0a0a;--bg-card:#141414;--bg-input:#1a1a1a;--text:#e0e0e0;--text-muted:#888;--accent:#4fc3f7;--accent-dim:#1a3a4a;--border:#2a2a2a;--danger:#ef5350;--success:#66bb6a;--radius:8px}
        body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

        /* 登录 */
        .login-page{display:flex;align-items:center;justify-content:center;min-height:100vh}
        .login-box{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:40px;width:360px;text-align:center}
        .login-box h1{font-size:20px;margin-bottom:8px;color:var(--accent)}
        .login-box p{font-size:13px;color:var(--text-muted);margin-bottom:24px}
        .login-box input{width:100%;padding:10px 14px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:14px;margin-bottom:16px}
        .login-box input:focus{outline:none;border-color:var(--accent)}
        .login-box button{width:100%;padding:10px;background:var(--accent);color:#000;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer}
        .login-box button:hover{opacity:.9}
        .login-error{color:var(--danger);font-size:13px;margin-bottom:12px;display:none}

        /* 布局 */
        .admin{display:none;height:100vh}
        .admin-header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:var(--bg-card);border-bottom:1px solid var(--border)}
        .admin-header h1{font-size:16px;color:var(--accent)}
        .admin-header button{padding:6px 14px;background:transparent;border:1px solid var(--border);border-radius:var(--radius);color:var(--text-muted);cursor:pointer;font-size:12px}
        .admin-body{display:flex;height:calc(100vh - 49px)}

        /* 侧栏 */
        .sidebar{width:200px;background:var(--bg-card);border-right:1px solid var(--border);padding:16px 0;flex-shrink:0}
        .sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;color:var(--text-muted);font-size:14px;transition:all .2s}
        .sidebar-item:hover,.sidebar-item.active{background:var(--accent-dim);color:var(--accent)}
        .sidebar-item svg{width:18px;height:18px}

        /* 内容区 */
        .content{flex:1;overflow-y:auto;padding:24px}

        /* 通用 */
        .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .toolbar h2{font-size:18px}
        .btn{padding:8px 16px;border:none;border-radius:var(--radius);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
        .btn-primary{background:var(--accent);color:#000}
        .btn-primary:hover{opacity:.85}
        .btn-danger{background:var(--danger);color:#fff}
        .btn-danger:hover{opacity:.85}
        .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-muted)}
        .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
        .btn-sm{padding:4px 10px;font-size:12px}

        /* 文章列表 */
        .article-table{width:100%;border-collapse:collapse}
        .article-table th{text-align:left;padding:10px 12px;font-size:12px;color:var(--text-muted);border-bottom:1px solid var(--border);font-weight:500}
        .article-table td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px}
        .article-table tr:hover{background:rgba(79,195,247,.05)}
        .tag{display:inline-block;padding:2px 8px;background:var(--accent-dim);color:var(--accent);border-radius:4px;font-size:11px;margin-right:4px}
        .status-published{color:var(--success)}
        .status-draft{color:var(--text-muted)}
        .actions{display:flex;gap:6px}

        /* 编辑器 */
        .editor{display:none}
        .editor-header{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
        .editor-header input,.editor-header select{padding:8px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px}
        .editor-header input{flex:1;min-width:200px}
        .editor-header select{min-width:100px}
        .editor-split{display:grid;grid-template-columns:1fr 1fr;gap:16px;height:calc(100vh - 200px)}
        .editor-textarea{width:100%;height:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'JetBrains Mono','Fira Code',monospace;font-size:13px;padding:16px;resize:none;line-height:1.6}
        .editor-textarea:focus{outline:none;border-color:var(--accent)}
        .editor-preview{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;overflow-y:auto;font-size:14px;line-height:1.8}
        .editor-preview h1,.editor-preview h2,.editor-preview h3{color:var(--accent);margin:16px 0 8px}
        .editor-preview h1{font-size:22px}.editor-preview h2{font-size:18px}.editor-preview h3{font-size:15px}
        .editor-preview p{margin-bottom:10px}
        .editor-preview code{background:var(--bg);padding:2px 6px;border-radius:4px;font-size:12px}
        .editor-preview pre{background:var(--bg);padding:12px;border-radius:var(--radius);overflow-x:auto;margin-bottom:12px}
        .editor-preview pre code{padding:0}
        .editor-preview blockquote{border-left:3px solid var(--accent);padding-left:12px;color:var(--text-muted);margin-bottom:10px}
        .editor-preview ul,.editor-preview ol{padding-left:20px;margin-bottom:10px}
        .editor-preview a{color:var(--accent)}
        .editor-preview img{max-width:100%;border-radius:var(--radius);margin:8px 0}
        .editor-preview table{width:100%;border-collapse:collapse;margin-bottom:12px}
        .editor-preview th,.editor-preview td{border:1px solid var(--border);padding:8px;text-align:left}
        .editor-preview th{background:var(--bg-input)}
        .editor-actions{display:flex;gap:8px;margin-top:12px}

        /* 图片 */
        .image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
        .image-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;position:relative}
        .image-card img{width:100%;height:140px;object-fit:cover;display:block}
        .image-card .image-info{padding:8px;font-size:11px;color:var(--text-muted);display:flex;justify-content:space-between;align-items:center}
        .image-card .image-info .url{max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .image-card .delete-btn{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);border:none;color:var(--danger);cursor:pointer;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
        .upload-area{border:2px dashed var(--border);border-radius:var(--radius);padding:40px;text-align:center;color:var(--text-muted);cursor:pointer;margin-bottom:20px;transition:all .2s}
        .upload-area:hover{border-color:var(--accent);color:var(--accent)}
        .upload-area input{display:none}

        /* Toast */
        .toast{position:fixed;bottom:24px;right:24px;padding:10px 20px;border-radius:var(--radius);font-size:13px;z-index:999;display:none}
        .toast-success{background:var(--success);color:#000}
        .toast-error{background:var(--danger);color:#fff}

        .empty{text-align:center;padding:60px;color:var(--text-muted)}

        @media(max-width:768px){
            .sidebar{display:none}
            .editor-split{grid-template-columns:1fr}
        }
    </style>
</head>
<body>
    <!-- 登录 -->
    <div class="login-page" id="loginPage">
        <div class="login-box">
            <h1>渡鸦_NULL BLOG</h1>
            <p>管理后台</p>
            <div class="login-error" id="loginError">密钥错误</div>
            <input type="password" id="adminKeyInput" placeholder="输入管理密钥" onkeydown="if(event.key==='Enter')doLogin()">
            <button onclick="doLogin()">进入后台</button>
        </div>
    </div>

    <!-- 后台 -->
    <div class="admin" id="adminApp">
        <div class="admin-header">
            <h1>管理后台</h1>
            <div style="display:flex;gap:8px;align-items:center">
                <a href="/" style="color:var(--text-muted);font-size:12px;text-decoration:none">← 返回首页</a>
                <button onclick="doLogout()">退出</button>
            </div>
        </div>
        <div class="admin-body">
            <div class="sidebar">
                <div class="sidebar-item active" onclick="switchTab('articles')" data-tab="articles">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    文章管理
                </div>
                <div class="sidebar-item" onclick="switchTab('images')" data-tab="images">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    图片管理
                </div>
            </div>
            <div class="content">
                <!-- 文章列表 -->
                <div id="tab-articles">
                    <div class="toolbar">
                        <h2>文章管理</h2>
                        <button class="btn btn-primary" onclick="openEditor()">+ 新建文章</button>
                    </div>
                    <table class="article-table">
                        <thead><tr><th>标题</th><th>标签</th><th>状态</th><th>日期</th><th>操作</th></tr></thead>
                        <tbody id="articleList"></tbody>
                    </table>
                </div>

                <!-- 编辑器 -->
                <div class="editor" id="editorPanel">
                    <div class="toolbar">
                        <h2 id="editorTitle">新建文章</h2>
                        <button class="btn btn-ghost" onclick="closeEditor()">← 返回列表</button>
                    </div>
                    <div class="editor-header">
                        <input type="text" id="edTitle" placeholder="文章标题">
                        <input type="text" id="edTags" placeholder="标签（逗号分隔）">
                        <input type="text" id="edImage" placeholder="封面图 URL（可从图片管理复制）">
                        <select id="edStatus">
                            <option value="published">已发布</option>
                            <option value="draft">草稿</option>
                        </select>
                    </div>
                    <div class="editor-split">
                        <textarea class="editor-textarea" id="edContent" placeholder="Markdown 正文..." oninput="updatePreview()"></textarea>
                        <div class="editor-preview" id="edPreview"></div>
                    </div>
                    <div class="editor-actions">
                        <button class="btn btn-primary" onclick="saveArticle()">保存文章</button>
                        <button class="btn btn-ghost" onclick="insertImage()">插入图片</button>
                        <button class="btn btn-ghost" onclick="closeEditor()">取消</button>
                    </div>
                </div>

                <!-- 图片管理 -->
                <div id="tab-images" style="display:none">
                    <div class="toolbar">
                        <h2>图片管理</h2>
                    </div>
                    <div class="upload-area" onclick="document.getElementById('imageUpload').click()">
                        <input type="file" id="imageUpload" accept="image/*" multiple onchange="uploadImages(this.files)">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        <p style="margin-top:8px">点击上传图片（自动转 WebP，限 10MB）</p>
                    </div>
                    <div class="image-grid" id="imageGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let adminKey = localStorage.getItem('admin_key') || '';
        let articles = [];
        let editingId = null;

        // 认证
        function doLogin() {
            const key = document.getElementById('adminKeyInput').value.trim();
            if (!key) return;
            adminKey = key;
            localStorage.setItem('admin_key', key);
            apiFetch('action=login', { method: 'POST', body: JSON.stringify({ key }) })
                .then(res => {
                    if (res.status === 'success') showAdmin();
                    else { document.getElementById('loginError').style.display = 'block'; document.getElementById('loginError').textContent = res.message || '密钥错误'; }
                })
                .catch(() => { document.getElementById('loginError').style.display = 'block'; document.getElementById('loginError').textContent = '连接失败'; });
        }
        function doLogout() { adminKey = ''; localStorage.removeItem('admin_key'); location.reload(); }
        function showAdmin() { document.getElementById('loginPage').style.display = 'none'; document.getElementById('adminApp').style.display = 'block'; loadArticles(); }

        // API
        async function apiFetch(params, options = {}) {
            const res = await fetch(`/api/admin?${params}`, { ...options, headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey, ...(options.headers || {}) } });
            return res.json();
        }

        // 文章列表
        async function loadArticles() {
            const res = await apiFetch('action=articles');
            if (res.status === 'success') { articles = res.data || []; renderArticleList(); }
        }
        function renderArticleList() {
            const tbody = document.getElementById('articleList');
            if (!articles.length) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--text-muted)">暂无文章，点击右上角新建</td></tr>'; return; }
            tbody.innerHTML = articles.map(a => `
                <tr>
                    <td><strong>${esc(a.title)}</strong><br><small style="color:var(--text-muted)">${a.id}</small></td>
                    <td>${(a.tags||[]).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</td>
                    <td><span class="status-${a.status}">${a.status === 'published' ? '已发布' : '草稿'}</span></td>
                    <td>${a.date}${a.update ? '<br><small style="color:var(--text-muted)">更新 '+a.update+'</small>' : ''}</td>
                    <td><div class="actions">
                        <button class="btn btn-ghost btn-sm" onclick="editArticle('${a.id}')">编辑</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteArticle('${a.id}','${esc(a.title)}')">删除</button>
                    </div></td>
                </tr>`).join('');
        }

        // 编辑器
        function openEditor(id) {
            editingId = id || null;
            document.getElementById('tab-articles').style.display = 'none';
            document.getElementById('editorPanel').style.display = 'block';
            document.getElementById('editorTitle').textContent = id ? '编辑文章' : '新建文章';
            ['edTitle','edTags','edImage'].forEach(el => document.getElementById(el).value = '');
            document.getElementById('edStatus').value = 'published';
            document.getElementById('edContent').value = '';
            document.getElementById('edPreview').innerHTML = '';
            if (id) loadArticleForEdit(id);
        }
        async function loadArticleForEdit(id) {
            const res = await apiFetch(`action=articles&id=${id}`);
            if (res.status === 'success') {
                const d = res.data;
                document.getElementById('edTitle').value = d.title || '';
                document.getElementById('edTags').value = (d.tags || []).join(', ');
                document.getElementById('edImage').value = d.image || '';
                document.getElementById('edStatus').value = d.status || 'published';
                document.getElementById('edContent').value = d.content || '';
                updatePreview();
            }
        }
        function closeEditor() { editingId = null; document.getElementById('tab-articles').style.display = 'block'; document.getElementById('editorPanel').style.display = 'none'; }
        async function saveArticle() {
            const title = document.getElementById('edTitle').value.trim();
            const tags = document.getElementById('edTags').value;
            const image = document.getElementById('edImage').value.trim();
            const status = document.getElementById('edStatus').value;
            const content = document.getElementById('edContent').value;
            if (!title || !content) { showToast('标题和内容不能为空', 'error'); return; }
            const body = { title, tags, image, content, status };
            if (editingId) body.id = editingId;
            const res = await apiFetch('action=articles', { method: 'POST', body: JSON.stringify(body) });
            if (res.status === 'success') { showToast('保存成功', 'success'); closeEditor(); loadArticles(); }
            else showToast(res.message || '保存失败', 'error');
        }
        async function deleteArticle(id, title) {
            if (!confirm(`确定删除「${title}」？`)) return;
            const res = await apiFetch(`action=articles&id=${id}`, { method: 'DELETE' });
            if (res.status === 'success') { showToast('已删除', 'success'); loadArticles(); }
            else showToast(res.message || '删除失败', 'error');
        }
        function editArticle(id) { openEditor(id); }

        // Markdown 预览
        function updatePreview() { document.getElementById('edPreview').innerHTML = renderMd(document.getElementById('edContent').value); }
        function renderMd(t) {
            let h = t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                .replace(/^### (.*$)/gm,'<h3>$1</h3>').replace(/^## (.*$)/gm,'<h2>$1</h2>').replace(/^# (.*$)/gm,'<h1>$1</h1>')
                .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>')
                .replace(/`([^`]+)`/g,'<code>$1</code>').replace(/```(\w*)\n([\s\S]*?)```/g,'<pre><code>$2</code></pre>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>')
                .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1">')
                .replace(/^> (.*$)/gm,'<blockquote>$1</blockquote>').replace(/^- (.*$)/gm,'<li>$1</li>')
                .replace(/\n\n/g,'</p><p>');
            return '<p>'+h+'</p>';
        }

        // 图片
        async function loadImages() { const res = await apiFetch('action=images'); if (res.status === 'success') renderImageGrid(res.data || []); }
        function renderImageGrid(images) {
            const grid = document.getElementById('imageGrid');
            if (!images.length) { grid.innerHTML = '<div class="empty"><p>暂无图片</p></div>'; return; }
            grid.innerHTML = images.map(img => `
                <div class="image-card">
                    <img src="${img.url}" alt="${img.key}" loading="lazy">
                    <div class="image-info">
                        <span class="url" title="${img.key}">${img.key}</span>
                        <button class="btn btn-ghost btn-sm" onclick="copyUrl('${img.url}')">复制</button>
                    </div>
                    <button class="delete-btn" onclick="deleteImage('${img.key}')">&times;</button>
                </div>`).join('');
        }
        async function uploadImages(files) {
            for (const file of files) {
                const reader = new FileReader();
                reader.onload = async () => {
                    const base64 = reader.result.split(',')[1];
                    const res = await apiFetch('action=images', { method: 'POST', body: JSON.stringify({ data: base64, mime: file.type, name: file.name }) });
                    if (res.status === 'success') { showToast(`已上传: ${file.name} → ${res.key}`, 'success'); loadImages(); }
                    else showToast(res.message || '上传失败', 'error');
                };
                reader.readAsDataURL(file);
            }
        }
        async function deleteImage(key) {
            if (!confirm(`确定删除 ${key}？`)) return;
            const res = await apiFetch(`action=images&key=${encodeURIComponent(key)}`, { method: 'DELETE' });
            if (res.status === 'success') { showToast('已删除', 'success'); loadImages(); }
        }
        function copyUrl(url) { navigator.clipboard.writeText(location.origin + url).then(() => showToast('已复制', 'success')); }
        function insertImage() {
            const url = prompt('输入图片 URL（可从图片管理复制）');
            if (!url) return;
            const ta = document.getElementById('edContent');
            const pos = ta.selectionStart;
            ta.value = ta.value.slice(0, pos) + `![图片](${url})` + ta.value.slice(pos);
            updatePreview();
        }

        // Tab
        function switchTab(tab) {
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
            document.getElementById('tab-articles').style.display = tab === 'articles' ? 'block' : 'none';
            document.getElementById('tab-images').style.display = tab === 'images' ? 'block' : 'none';
            document.getElementById('editorPanel').style.display = 'none';
            if (tab === 'images') loadImages();
            if (tab === 'articles') loadArticles();
        }

        // 工具
        function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function showToast(msg, type) { const t = document.getElementById('toast'); t.textContent = msg; t.className = `toast toast-${type}`; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2500); }

        // 初始化
        (function(){ if (adminKey) apiFetch('action=login', { method: 'POST', body: JSON.stringify({ key: adminKey }) }).then(res => { if (res.status === 'success') showAdmin(); else doLogout(); }).catch(() => doLogout()); })();
    </script>
</body>
</html>
