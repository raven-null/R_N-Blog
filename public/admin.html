<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 渡鸦_NULL BLOG</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#080808;--bg-card:#111;--bg-input:#1a1a1a;--bg-hover:#1c1c1c;--bg-active:#1a2a3a;--text:#ddd;--text-muted:#777;--accent:#4fc3f7;--accent-dim:rgba(79,195,247,.1);--border:#252525;--border-light:#333;--danger:#ef5350;--success:#66bb6a;--warning:#ffa726;--radius:10px;--radius-sm:6px;--shadow:0 8px 32px rgba(0,0,0,.5);--sidebar-w:220px;--sidebar-collapsed:52px}
        html{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.08) transparent}
        body{font-family:-apple-system,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        ::-webkit-scrollbar{width:4px;height:4px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}
        ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.15)}
        ::-webkit-scrollbar-corner{background:transparent}

        .login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 30% 40%,#0d1520 0%,#080808 70%)}
        .login-box{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:48px 40px;width:380px;text-align:center;box-shadow:var(--shadow)}
        .login-box h1{font-size:24px;margin-bottom:6px;color:var(--accent);font-weight:700;letter-spacing:2px}
        .login-box p{font-size:13px;color:var(--text-muted);margin-bottom:28px}
        .login-box input{width:100%;padding:12px 16px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;margin-bottom:16px;transition:border .2s}
        .login-box input:focus{outline:none;border-color:var(--accent)}
        .login-box button{width:100%;padding:12px;background:var(--accent);color:#000;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
        .login-box button:hover{opacity:.85}
        .login-error{color:var(--danger);font-size:13px;margin-bottom:12px;display:none}

        .admin{display:none;height:100vh}
        .admin-header{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:52px;background:var(--bg-card);border-bottom:1px solid var(--border)}
        .admin-header h1{font-size:15px;color:var(--accent);font-weight:600;letter-spacing:1px}
        .admin-header-right{display:flex;gap:12px;align-items:center}
        .admin-header-right a{color:var(--text-muted);font-size:12px;text-decoration:none;transition:color .2s}
        .admin-header-right a:hover{color:var(--accent)}
        .admin-header-right button{padding:5px 12px;background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-muted);cursor:pointer;font-size:12px;transition:all .15s}
        .admin-header-right button:hover{border-color:var(--danger);color:var(--danger)}
        .admin-body{display:flex;height:calc(100vh - 52px)}

        .sidebar{width:var(--sidebar-w);background:var(--bg-card);border-right:1px solid var(--border);flex-shrink:0;transition:width .2s cubic-bezier(.4,0,.2,1);overflow:hidden;display:flex;flex-direction:column}
        .sidebar.collapsed{width:var(--sidebar-collapsed)}
        .sidebar.collapsed .sidebar-item span{opacity:0;width:0}
        .sidebar.collapsed .sidebar-item{padding:11px 0;justify-content:center}
        .sidebar.collapsed .sidebar-toggle svg{transform:rotate(180deg)}
        .sidebar-top{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
        .sidebar-top span{font-size:12px;color:var(--text-muted);font-weight:500;white-space:nowrap}
        .sidebar.collapsed .sidebar-top span{display:none}
        .sidebar-toggle{width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;color:var(--text-muted);transition:all .15s;flex-shrink:0}
        .sidebar-toggle:hover{border-color:var(--accent);color:var(--accent)}
        .sidebar-toggle svg{width:13px;height:13px;transition:transform .2s}
        .sidebar-nav{flex:1;padding:8px 0;overflow-y:auto}
        .sidebar-item{display:flex;align-items:center;gap:12px;padding:10px 20px;cursor:pointer;color:var(--text-muted);font-size:13px;transition:all .12s;border-left:3px solid transparent;white-space:nowrap}
        .sidebar-item:hover{background:var(--bg-hover);color:var(--text)}
        .sidebar-item.active{background:var(--bg-active);color:var(--accent);border-left-color:var(--accent)}
        .sidebar-item svg{width:15px;height:15px;flex-shrink:0}

        .content{flex:1;overflow-y:auto;padding:24px 28px}
        .page-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .page-bar h2{font-size:18px;font-weight:600}
        .page-bar-actions{display:flex;gap:8px;align-items:center}
        .btn{padding:7px 16px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;font-weight:500;transition:all .12s;display:inline-flex;align-items:center;gap:5px}
        .btn-primary{background:var(--accent);color:#000}
        .btn-primary:hover{opacity:.8}
        .btn-danger{background:var(--danger);color:#fff}
        .btn-danger:hover{opacity:.8}
        .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-muted)}
        .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
        .btn-sm{padding:4px 10px;font-size:11px}

        .article-table{width:100%;border-collapse:collapse}
        .article-table th{text-align:left;padding:10px 12px;font-size:11px;color:var(--text-muted);border-bottom:2px solid var(--border);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
        .article-table td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
        .article-table tr{transition:background .08s}
        .article-table tr:hover{background:var(--bg-hover)}
        .tag{display:inline-block;padding:2px 7px;background:var(--accent-dim);color:var(--accent);border-radius:4px;font-size:10px;margin-right:3px;font-weight:500}
        .status-on{color:var(--success);font-weight:500}
        .status-off{color:var(--text-muted)}
        .row-actions{display:flex;gap:4px}

        .editor-top{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
        .editor-top input,.editor-top select{padding:9px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;transition:border .15s}
        .editor-top input:focus,.editor-top select:focus{outline:none;border-color:var(--accent)}
        .editor-top input{flex:1;min-width:180px}
        .editor-top select{min-width:90px}
        .editor-toolbar{display:flex;gap:1px;padding:6px 10px;background:var(--bg-card);border:1px solid var(--border);border-bottom:none;border-radius:var(--radius-sm) var(--radius-sm) 0 0;flex-wrap:wrap;align-items:center}
        .editor-toolbar button{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--text-muted);cursor:pointer;border-radius:4px;font-size:13px;transition:all .08s}
        .editor-toolbar button:hover{background:var(--bg-hover);color:var(--accent)}
        .editor-toolbar .sep{width:1px;height:18px;background:var(--border);margin:0 5px}
        .editor-split{display:grid;grid-template-columns:1fr 1fr;gap:0;height:calc(100vh - 310px)}
        .editor-textarea{width:100%;height:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:0 0 0 var(--radius-sm);color:var(--text);font-family:'JetBrains Mono','Fira Code',monospace;font-size:13px;padding:14px;resize:none;line-height:1.7;border-right:none}
        .editor-textarea:focus{outline:none;border-color:var(--accent)}
        .editor-preview{background:var(--bg-card);border:1px solid var(--border);border-radius:0 0 var(--radius-sm) 0;padding:18px;overflow-y:auto;font-size:14px;line-height:1.8}
        .editor-preview h1,.editor-preview h2,.editor-preview h3{color:var(--accent);margin:18px 0 8px;font-weight:600}
        .editor-preview h1{font-size:22px;border-bottom:1px solid var(--border);padding-bottom:6px}
        .editor-preview h2{font-size:18px}.editor-preview h3{font-size:15px}
        .editor-preview p{margin-bottom:10px}
        .editor-preview code{background:var(--bg);padding:2px 5px;border-radius:3px;font-size:12px;font-family:'JetBrains Mono',monospace}
        .editor-preview pre{background:var(--bg);padding:12px;border-radius:var(--radius-sm);overflow-x:auto;margin-bottom:12px;border:1px solid var(--border)}
        .editor-preview pre code{padding:0;background:none}
        .editor-preview blockquote{border-left:3px solid var(--accent);padding:6px 12px;color:var(--text-muted);margin-bottom:10px;background:var(--accent-dim);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
        .editor-preview ul,.editor-preview ol{padding-left:22px;margin-bottom:10px}
        .editor-preview a{color:var(--accent)}
        .editor-preview img{max-width:100%;border-radius:var(--radius-sm);margin:8px 0}
        .editor-preview table{width:100%;border-collapse:collapse;margin-bottom:12px}
        .editor-preview th,.editor-preview td{border:1px solid var(--border);padding:8px 10px;text-align:left}
        .editor-preview th{background:var(--bg-input);font-weight:600;font-size:12px}
        .editor-preview hr{border:none;border-top:1px solid var(--border);margin:16px 0}
        .editor-footer{display:flex;margin-top:12px;align-items:center;justify-content:space-between}
        .editor-info{font-size:11px;color:var(--text-muted)}
        .editor-footer-actions{display:flex;gap:8px}
        .drop-overlay{display:none;position:absolute;inset:0;background:rgba(79,195,247,.08);border:2px dashed var(--accent);border-radius:var(--radius-sm);z-index:10;align-items:center;justify-content:center;font-size:15px;color:var(--accent);pointer-events:none}
        .drop-overlay.show{display:flex}

        /* 图片管理 */
        .imgm-top{display:flex;gap:12px;margin-bottom:16px;align-items:center}
        .imgm-upload{padding:14px 20px;border:2px dashed var(--border);border-radius:var(--radius-sm);color:var(--text-muted);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:10px;font-size:12px}
        .imgm-upload:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
        .imgm-upload input{display:none}

        .classify-workspace{display:flex;gap:16px;height:calc(100vh - 200px)}
        .classify-left{flex:1;display:flex;flex-direction:column;min-width:0}
        .classify-right{flex:1.5;display:flex;flex-direction:column;min-width:0}
        .classify-panel{flex:1;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;flex-direction:column;overflow:hidden;position:relative}
        .classify-panel.drag-over{border-color:var(--accent);box-shadow:0 0 20px rgba(79,195,247,.15)}
        .classify-panel.drag-over::after{content:'释放上传图片';position:absolute;inset:0;background:rgba(79,195,247,.1);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--accent);font-weight:600;pointer-events:none;z-index:10;border-radius:var(--radius-sm)}
        .classify-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
        .classify-header h3{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
        .classify-header .count{font-size:11px;color:var(--text-muted);font-weight:400}
        .classify-body{flex:1;overflow-y:auto;padding:10px}
        .classify-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
        .classify-card{background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;cursor:grab;transition:all .12s;position:relative}
        .classify-card:hover{border-color:var(--border-light);transform:translateY(-1px)}
        .classify-card.selected{border-color:var(--accent);box-shadow:0 0 8px rgba(79,195,247,.3)}
        .img-checkbox{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
        .classify-card.dragging{opacity:.4;transform:scale(.92)}
        .classify-card img{width:100%;height:85px;object-fit:cover;display:block}
        .classify-card .cc-bottom{padding:4px 6px;display:flex;justify-content:space-between;align-items:center}
        .classify-card .cc-name{font-size:9px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
        .classify-card .cc-del{background:rgba(0,0,0,.7);border:none;color:var(--danger);cursor:pointer;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;opacity:0;transition:opacity .1s;flex-shrink:0}
        .classify-card:hover .cc-del{opacity:1}

        .classify-right .classify-header{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
        .classify-right .tag-sel{display:flex;gap:4px;flex-wrap:wrap}
        .classify-right .tag-sel button{padding:4px 10px;border:1px solid var(--border);border-radius:12px;background:transparent;color:var(--text-muted);font-size:11px;cursor:pointer;transition:all .1s}
        .classify-right .tag-sel button:hover{border-color:var(--text-muted)}
        .classify-right .tag-sel button.active{background:var(--accent);color:#000;border-color:var(--accent)}
        .classify-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:13px;border:2px dashed var(--border);border-radius:var(--radius-sm);margin:10px}

        .tag-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center}
        .tag-modal.open{display:flex}
        .tag-modal-box{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:400px;box-shadow:var(--shadow)}
        .tag-modal-box h3{font-size:15px;margin-bottom:16px;color:var(--accent)}
        .tag-modal-box .tag-options{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
        .tag-modal-box .tag-opt{padding:5px 12px;border:1px solid var(--border);border-radius:16px;cursor:pointer;font-size:12px;color:var(--text-muted);transition:all .1s}
        .tag-modal-box .tag-opt:hover{border-color:var(--text-muted)}
        .tag-modal-box .tag-opt.selected{background:var(--accent);color:#000;border-color:var(--accent)}
        .tag-modal-box .custom-tag{display:flex;gap:8px;margin-bottom:16px}
        .tag-modal-box .custom-tag input{flex:1;padding:8px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px}
        .tag-modal-box .custom-tag input:focus{outline:none;border-color:var(--accent)}
        .tag-modal-actions{display:flex;gap:8px;justify-content:flex-end}

        .image-picker-panel{display:none;position:fixed;top:0;right:0;width:340px;height:100vh;background:var(--bg-card);border-left:1px solid var(--border);z-index:100;flex-direction:column;box-shadow:-4px 0 24px rgba(0,0,0,.5)}
        .image-picker-panel.open{display:flex}
        .image-picker-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
        .image-picker-header h3{font-size:13px;color:var(--accent)}
        .image-picker-header button{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:18px}
        .image-picker-upload{padding:12px 16px;border-bottom:1px solid var(--border)}
        .image-picker-upload label{display:block;padding:16px;border:2px dashed var(--border);border-radius:var(--radius-sm);text-align:center;color:var(--text-muted);cursor:pointer;font-size:12px;transition:all .15s}
        .image-picker-upload label:hover{border-color:var(--accent);color:var(--accent)}
        .image-picker-list{flex:1;overflow-y:auto;padding:10px}
        .image-picker-item{display:flex;align-items:center;gap:10px;padding:7px;border-radius:var(--radius-sm);cursor:pointer;transition:background .08s}
        .image-picker-item:hover{background:var(--bg-hover)}
        .image-picker-item img{width:40px;height:40px;object-fit:cover;border-radius:4px}
        .image-picker-item .name{font-size:11px;color:var(--text-muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

        .toast{position:fixed;bottom:20px;right:20px;padding:10px 20px;border-radius:var(--radius-sm);font-size:12px;z-index:999;display:none;box-shadow:var(--shadow);font-weight:500}
        .toast-success{background:var(--success);color:#000}
        .toast-error{background:var(--danger);color:#fff}
        .empty{text-align:center;padding:48px;color:var(--text-muted);font-size:13px}
        .upload-progress{display:none;align-items:center;gap:6px;padding:6px 12px;background:var(--accent-dim);border-radius:var(--radius-sm);font-size:11px;color:var(--accent)}
        .upload-progress.show{display:inline-flex}
        .upload-progress .spinner{width:12px;height:12px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}

        /* 标签管理 */
        .tags-nav{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:12px}
        .tags-nav-btn{display:flex;align-items:center;gap:6px;padding:8px 18px;border:1px solid var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--text-muted);font-size:13px;cursor:pointer;transition:all .12s}
        .tags-nav-btn:hover{border-color:var(--text-muted);color:var(--text)}
        .tags-nav-btn.active{background:var(--accent-dim);color:var(--accent);border-color:var(--accent)}
        .tags-info{font-size:11px;color:var(--text-muted);margin-bottom:14px;padding:8px 12px;background:var(--bg-input);border-radius:var(--radius-sm)}
        .tags-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}

        /* 标签选择器 */
        .tag-picker-wrap{position:relative}
        .tag-picker-input{display:flex;flex-wrap:wrap;gap:4px;padding:6px 10px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);min-height:36px;cursor:text;align-items:center;transition:border .15s}
        .tag-picker-input:focus-within{border-color:var(--accent)}
        .tag-picker-input .tp-chip{display:flex;align-items:center;gap:4px;padding:2px 8px;background:var(--accent-dim);color:var(--accent);border-radius:12px;font-size:11px}
        .tag-picker-input .tp-chip button{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;padding:0;line-height:1;opacity:.6}
        .tag-picker-input .tp-chip button:hover{opacity:1}
        .tag-picker-input input{flex:1;min-width:80px;border:none;background:transparent;color:var(--text);font-size:12px;outline:none}
        .tag-picker-input input::placeholder{color:#555}
        .tag-picker-dropdown{display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);margin-top:4px;max-height:180px;overflow-y:auto;z-index:50;box-shadow:var(--shadow)}
        .tag-picker-dropdown.open{display:block}
        .tag-picker-dropdown .tp-item{padding:6px 12px;font-size:12px;color:var(--text-muted);cursor:pointer;transition:background .08s}
        .tag-picker-dropdown .tp-item:hover{background:var(--bg-hover);color:var(--text)}
        .tag-picker-dropdown .tp-item.selected{color:var(--accent);background:var(--accent-dim)}
        .tags-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;transition:all .12s}
        .tags-card:hover{border-color:var(--border-light);background:var(--bg-hover)}
        .tags-card .tc-info{flex:1;min-width:0}
        .tags-card .tc-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
        .tags-card .tc-counts{font-size:11px;color:var(--text-muted);display:flex;gap:12px}
        .tags-card .tc-counts span{display:flex;align-items:center;gap:4px}
        .tags-card .tc-actions{display:flex;gap:6px;margin-left:12px}
        .tags-card .tc-actions button{opacity:0;transition:opacity .12s}
        .tags-card:hover .tc-actions button{opacity:1}
        .tags-add{display:flex;gap:8px;margin-bottom:20px}
        .tags-add input{flex:1;padding:9px 14px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px}
        .tags-add input:focus{outline:none;border-color:var(--accent)}

        /* 重命名弹窗 */
        .rename-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center}
        .rename-modal.open{display:flex}
        .rename-box{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:360px;box-shadow:var(--shadow)}
        .rename-box h3{font-size:15px;margin-bottom:16px;color:var(--accent)}
        .rename-box input{width:100%;padding:10px 14px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;margin-bottom:16px}
        .rename-box input:focus{outline:none;border-color:var(--accent)}
        .rename-box .rename-actions{display:flex;gap:8px;justify-content:flex-end}

        @media(max-width:768px){.sidebar{display:none}.editor-split{grid-template-columns:1fr}.image-picker-panel{width:100%}.classify-workspace{flex-direction:column;height:auto}.tags-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <div class="login-page" id="loginPage">
        <div class="login-box"><h1>渡鸦_NULL</h1><p>管理后台</p><div class="login-error" id="loginError">密钥错误</div><input type="password" id="adminKeyInput" placeholder="输入管理密钥" onkeydown="if(event.key==='Enter')doLogin()"><button onclick="doLogin()">进入后台</button></div>
    </div>
    <div class="admin" id="adminApp">
        <div class="admin-header"><h1>管理后台</h1><div class="admin-header-right"><a href="/" target="_blank">首页 ↗</a><button onclick="doLogout()">退出</button></div></div>
        <div class="admin-body">
            <div class="sidebar" id="sidebar">
                <div class="sidebar-top"><span>菜单</span><button class="sidebar-toggle" onclick="toggleSidebar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button></div>
                <div class="sidebar-nav">
                    <div class="sidebar-item active" onclick="switchTab('articles')" data-tab="articles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>文章管理</span></div>
                    <div class="sidebar-item" onclick="switchTab('write')" data-tab="write"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg><span>写文章</span></div>
                    <div class="sidebar-item" onclick="switchTab('images')" data-tab="images"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>图片管理</span></div>
                    <div class="sidebar-item" onclick="switchTab('tags')" data-tab="tags"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg><span>标签管理</span></div>
                </div>
            </div>
            <div class="content">
                <!-- 文章列表 -->
                <div id="tab-articles">
                    <div class="page-bar"><h2>文章管理</h2><div class="page-bar-actions"><label class="btn btn-ghost" style="cursor:pointer">📄 导入 .md<input type="file" accept=".md,.markdown" onchange="importAndEdit(this.files[0])" style="display:none"></label></div></div>
                    <table class="article-table"><thead><tr><th>标题</th><th>标签</th><th>状态</th><th>日期</th><th>操作</th></tr></thead><tbody id="articleList"></tbody></table>
                </div>

                <!-- 写文章 -->
                <div id="tab-write" style="display:none">
                    <div class="page-bar"><h2 id="writeTitle">写文章</h2><div class="page-bar-actions"><label class="btn btn-ghost" style="cursor:pointer">📄 导入<input type="file" accept=".md,.markdown" onchange="importToEditor(this.files[0])" style="display:none"></label><button class="btn btn-ghost" onclick="exportMarkdown()">💾 导出</button></div></div>
                    <div class="editor-top">
                        <input type="text" id="edTitle" placeholder="文章标题">
                        <div class="tag-picker-wrap" style="flex:1;min-width:200px">
                            <div class="tag-picker-input" id="tagPickerInput" onclick="focusTagPicker()">
                                <input type="text" id="tagPickerText" placeholder="输入或选择标签..." oninput="filterTagDropdown()" onkeydown="tagPickerKeydown(event)" onfocus="openTagDropdown()" autocomplete="off">
                            </div>
                            <div class="tag-picker-dropdown" id="tagPickerDropdown"></div>
                        </div>
                        <select id="edStatus"><option value="published">已发布</option><option value="draft">草稿</option></select>
                    </div>
                    <div class="editor-toolbar">
                        <button onclick="mdInsert('heading')" title="标题"><b>H</b></button><button onclick="mdInsert('bold')" title="粗体"><b>B</b></button><button onclick="mdInsert('italic')" title="斜体"><i>I</i></button><button onclick="mdInsert('strike')" title="删除线"><s>S</s></button><span class="sep"></span>
                        <button onclick="mdInsert('code')" title="代码">{ }</button><button onclick="mdInsert('codeblock')" title="代码块">```</button><button onclick="mdInsert('quote')" title="引用">"</button><button onclick="mdInsert('list')" title="列表">☰</button><button onclick="mdInsert('olist')" title="有序列表">1.</button><span class="sep"></span>
                        <button onclick="mdInsert('link')" title="链接">🔗</button><button onclick="mdInsert('image')" title="图片URL">🖼</button><button onclick="openImagePicker()" title="从图库插入">📁</button><button onclick="mdInsert('table')" title="表格">▦</button><button onclick="mdInsert('hr')" title="分割线">—</button><span class="sep"></span>
                        <div class="upload-progress" id="uploadProgress"><div class="spinner"></div><span id="uploadProgressText">上传中...</span></div>
                    </div>
                    <div class="editor-split" style="position:relative">
                        <textarea class="editor-textarea" id="edContent" placeholder="Markdown 正文...&#10;支持拖拽/粘贴图片自动上传" oninput="updatePreview()" ondrop="handleDrop(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)"></textarea>
                        <div class="editor-preview" id="edPreview"></div>
                        <div class="drop-overlay" id="dropOverlay">📤 拖拽图片到这里上传</div>
                    </div>
                    <div class="editor-footer"><span class="editor-info" id="editorInfo">0 字</span><div class="editor-footer-actions"><button class="btn btn-ghost" onclick="resetEditor()">清空</button><button class="btn btn-primary" onclick="saveArticle()">保存文章</button></div></div>
                </div>

                <!-- 图片管理 -->
                <div id="tab-images" style="display:none">
                    <div class="page-bar"><h2>图片管理</h2></div>
                    <div class="imgm-top">
                        <label class="imgm-upload">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                            上传图片（自动转 WebP，限 10MB，上传后归入未分类）
                            <input type="file" id="imageUpload" accept="image/*" multiple onchange="uploadImages(this.files)">
                        </label>
                    </div>
                    <div class="classify-workspace">
                        <div class="classify-left">
                            <div class="classify-panel" id="classifyLeft">
                                <div class="classify-header"><h3>未分类 <span class="count" id="unclassifiedCount">0</span></h3><span style="font-size:11px;color:var(--text-muted)">拖拽图片到此处上传或移入</span></div>
                                <div class="classify-body"><div class="classify-grid" id="unclassifiedGrid"></div></div>
                            </div>
                        </div>
                        <div class="classify-right">
                            <div class="classify-panel" id="classifyRight">
                                <div class="classify-header">
                                    <div class="tag-sel" id="classifyTagSel"></div>
                                    <div style="display:flex;gap:6px;margin-left:auto">
                                        <button class="btn btn-ghost btn-sm" onclick="toggleBatchMode()" id="btnBatchMode">批量操作</button>
                                        <div id="batchActions" style="display:none;display:flex;gap:6px">
                                            <button class="btn btn-ghost btn-sm" onclick="toggleSelectAll()" id="btnSelectAll">全选</button>
                                            <button class="btn btn-ghost btn-sm" onclick="batchClearTags()" id="btnBatchClear" disabled>清除标签</button>
                                            <button class="btn btn-ghost btn-sm" onclick="toggleBatchMode()">取消</button>
                                        </div>
                                    </div>
                                </div>
                                <div class="classify-body"><div class="classify-grid" id="classifiedGrid"></div></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 标签管理 -->
                <div id="tab-tags" style="display:none">
                    <div class="page-bar"><h2>标签管理</h2><div class="page-bar-actions"><button class="btn btn-ghost" onclick="loadTags()">刷新</button></div></div>
                    <div class="tags-nav">
                        <button class="tags-nav-btn active" onclick="switchTagsView('article')" data-tview="article">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                            文章标签
                        </button>
                        <button class="tags-nav-btn" onclick="switchTagsView('image')" data-tview="image">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                            图片标签
                        </button>
                    </div>
                    <div class="tags-add"><input type="text" id="newTagInput" placeholder="输入新标签名称，回车添加" onkeydown="if(event.key==='Enter')addNewTag()"><button class="btn btn-primary" onclick="addNewTag()">添加标签</button></div>
                    <div id="tagsViewArticle">
                        <div class="tags-info">文章标签来自文章管理中保存的文章，删除标签会从所有文章中移除。</div>
                        <div class="tags-grid" id="articleTagsGrid"></div>
                    </div>
                    <div id="tagsViewImage" style="display:none">
                        <div class="tags-info">图片标签来自图片管理中分类的图片，删除标签会从所有图片中移除。</div>
                        <div class="tags-grid" id="imageTagsGrid"></div>
                    </div>
                </div>
            </div>
                </div>
            </div>
        </div>
    </div>

    <div class="tag-modal" id="tagModal">
        <div class="tag-modal-box"><h3>编辑图片标签</h3><div class="tag-options" id="tagModalOptions"></div><div class="custom-tag"><input type="text" id="customTagInput" placeholder="自定义标签，回车添加" onkeydown="if(event.key==='Enter')addCustomTag()"><button class="btn btn-ghost btn-sm" onclick="addCustomTag()">添加</button></div><div class="tag-modal-actions"><button class="btn btn-ghost" onclick="closeTagModal()">取消</button><button class="btn btn-primary" onclick="saveTagModal()">保存</button></div></div>
    </div>

    <div class="image-picker-panel" id="imagePickerPanel">
        <div class="image-picker-header"><h3>选择图片插入</h3><button onclick="closeImagePicker()">&times;</button></div>
        <div class="image-picker-upload"><label>📤 上传新图片<input type="file" accept="image/*" multiple onchange="uploadAndInsert(this.files)" style="display:none"></label></div>
        <div class="image-picker-list" id="imagePickerList"></div>
    </div>

    <div class="rename-modal" id="renameModal">
        <div class="rename-box"><h3>重命名标签</h3><input type="text" id="renameInput" placeholder="新名称" onkeydown="if(event.key==='Enter')confirmRename()"><div class="rename-actions"><button class="btn btn-ghost" onclick="closeRenameModal()">取消</button><button class="btn btn-primary" onclick="confirmRename()">确认</button></div></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let adminKey=localStorage.getItem('admin_key')||'';
        let articles=[],editingId=null,cachedImages=[];
        let tagModalKey='',tagModalSelected=[];
        let classifyTag='',allImageData=[];
        let imageTagNames=[];
        let articleTagNames=[];
        let selectedArticleTags=[];
        let tagPickerOpen=false;
        let selectedImageKeys=new Set();
        let batchMode=false;

        function doLogin(){const k=document.getElementById('adminKeyInput').value.trim();if(!k)return;adminKey=k;localStorage.setItem('admin_key',k);apiFetch('action=login',{method:'POST',body:JSON.stringify({key:k})}).then(r=>{if(r.status==='success')showAdmin();else{document.getElementById('loginError').style.display='block';document.getElementById('loginError').textContent=r.message||'密钥错误'}}).catch(()=>{document.getElementById('loginError').style.display='block';document.getElementById('loginError').textContent='连接失败'})}
        function doLogout(){adminKey='';localStorage.removeItem('admin_key');location.reload()}
        function showAdmin(){document.getElementById('loginPage').style.display='none';document.getElementById('adminApp').style.display='block';loadArticles()}
        async function apiFetch(p,o={}){const r=await fetch(`/api/admin?${p}`,{...o,headers:{'Content-Type':'application/json','X-Admin-Key':adminKey,...(o.headers||{})}});return r.json()}
        function toggleSidebar(){document.getElementById('sidebar').classList.toggle('collapsed')}

        // ===== 文章 =====
        async function loadArticles(){const r=await apiFetch('action=articles');if(r.status==='success'){articles=r.data||[];renderArticleList()}}
        function renderArticleList(){const t=document.getElementById('articleList');if(!articles.length){t.innerHTML='<tr><td colspan="5" class="empty">暂无文章</td></tr>';return}t.innerHTML=articles.map(a=>`<tr><td><strong>${esc(a.title)}</strong><br><small style="color:var(--text-muted);font-size:10px">${a.id}</small></td><td>${(a.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</td><td><span class="status-${a.status==='published'?'on':'off'}">${a.status==='published'?'● 已发布':'○ 草稿'}</span></td><td style="font-size:11px;color:var(--text-muted)">${a.date}${a.update?'<br>↑ '+a.update:''}</td><td><div class="row-actions"><button class="btn btn-ghost btn-sm" onclick="editArticle('${a.id}')">编辑</button><button class="btn btn-danger btn-sm" onclick="deleteArticle('${a.id}','${esc(a.title)}')">删除</button></div></td></tr>`).join('')}
        async function deleteArticle(id,title){if(!confirm(`确定删除「${title}」？`))return;const r=await apiFetch(`action=articles&id=${id}`,{method:'DELETE'});if(r.status==='success'){showToast('已删除','success');loadArticles()}else showToast(r.message||'删除失败','error')}
        function editArticle(id){editingId=id;switchTab('write');document.getElementById('writeTitle').textContent='编辑文章';loadArticleForEdit(id)}
        async function loadArticleForEdit(id){const r=await apiFetch(`action=articles&id=${id}`);if(r.status==='success'){const d=r.data;document.getElementById('edTitle').value=d.title||'';selectedArticleTags=[...(d.tags||[])];renderTagPickerChips();document.getElementById('edStatus').value=d.status||'published';document.getElementById('edContent').value=d.content||'';updatePreview()}}
        function importAndEdit(f){if(!f)return;const r=new FileReader();r.onload=()=>{const raw=r.result,m=raw.match(/^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/);let title=f.name.replace(/\.md$/),tags=[],content=raw;if(m){const fm=m[1],t=fm.match(/title:\s*(.+)/);if(t)title=t[1].trim();const tg=fm.match(/tags:\s*\[([^\]]+)\]/);if(tg)tags=tg[1].split(',').map(s=>s.trim());content=m[2]}editingId=null;switchTab('write');document.getElementById('writeTitle').textContent='导入文章';document.getElementById('edTitle').value=title;selectedArticleTags=tags;renderTagPickerChips();document.getElementById('edContent').value=content;updatePreview();showToast(`已导入: ${f.name}`,'success')};r.readAsText(f)}

        // ===== 写文章 =====
        function resetEditor(){editingId=null;document.getElementById('writeTitle').textContent='写文章';document.getElementById('edTitle').value='';selectedArticleTags=[];renderTagPickerChips();document.getElementById('edStatus').value='published';document.getElementById('edContent').value='';document.getElementById('edPreview').innerHTML='';document.getElementById('editorInfo').textContent='0 字'}
        async function saveArticle(){const title=document.getElementById('edTitle').value.trim(),tags=selectedArticleTags.join(', '),status=document.getElementById('edStatus').value,content=document.getElementById('edContent').value;if(!title){showToast('标题不能为空','error');return}if(!content){showToast('内容不能为空','error');return}const body={title,tags,content,status};if(editingId)body.id=editingId;const r=await apiFetch('action=articles',{method:'POST',body:JSON.stringify(body)});if(r.status==='success'){showToast('保存成功','success');resetEditor();switchTab('articles')}else showToast(r.message||'保存失败','error')}
        function mdInsert(t){const ta=document.getElementById('edContent'),s=ta.selectionStart,e=ta.selectionEnd,sel=ta.value.slice(s,e),b=ta.value.slice(0,s),a=ta.value.slice(e);const m={heading:{b:'## ',a:'',d:'标题'},bold:{b:'**',a:'**',d:'粗体'},italic:{b:'*',a:'*',d:'斜体'},strike:{b:'~~',a:'~~',d:'删除线'},code:{b:'`',a:'`',d:'code'},codeblock:{b:'```\n',a:'\n```',d:'// 代码'},quote:{b:'> ',a:'',d:'引用'},list:{b:'- ',a:'',d:'列表项'},olist:{b:'1. ',a:'',d:'列表项'},link:{b:'[',a:'](https://)',d:'链接'},image:{b:'![',a:'](url)',d:'图片'},table:{b:'| 列1 | 列2 |\n| --- | --- |\n',a:'',d:'| 内容 | 内容 |'},hr:{b:'\n---\n',a:'',d:''}};const i=m[t];if(!i)return;const tx=sel||i.d;ta.value=b+i.b+tx+i.a+a;ta.focus();ta.selectionStart=s+i.b.length;ta.selectionEnd=s+i.b.length+tx.length;updatePreview()}
        function updatePreview(){const md=document.getElementById('edContent').value;document.getElementById('edPreview').innerHTML=renderMd(md);document.getElementById('editorInfo').textContent=md.length+' 字'}
        function renderMd(t){return'<p>'+t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/^### (.*$)/gm,'<h3>$1</h3>').replace(/^## (.*$)/gm,'<h2>$1</h2>').replace(/^# (.*$)/gm,'<h1>$1</h1>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/~~(.*?)~~/g,'<del>$1</del>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/```(\w*)\n([\s\S]*?)```/g,'<pre><code>$2</code></pre>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>').replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1">').replace(/^> (.*$)/gm,'<blockquote>$1</blockquote>').replace(/^- (.*$)/gm,'<li>$1</li>').replace(/^1\. (.*$)/gm,'<li>$1</li>').replace(/^---$/gm,'<hr>').replace(/\n\n/g,'</p><p>')+'</p>'}
        function handleDragOver(e){e.preventDefault();e.stopPropagation();document.getElementById('dropOverlay').classList.add('show')}
        function handleDragLeave(e){e.preventDefault();e.stopPropagation();document.getElementById('dropOverlay').classList.remove('show')}
        async function handleDrop(e){e.preventDefault();e.stopPropagation();document.getElementById('dropOverlay').classList.remove('show');for(const f of[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/'))){const url=await uploadImageAndGetUrl(f);if(url)insertAtCursor(`![${f.name}](${url})`)}}
        document.addEventListener('paste',async e=>{if(document.activeElement!==document.getElementById('edContent'))return;for(const item of[...e.clipboardData.items]){if(item.type.startsWith('image/')){e.preventDefault();const url=await uploadImageAndGetUrl(item.getAsFile());if(url)insertAtCursor(`![图片](${url})`)}}});
        function insertAtCursor(t){const ta=document.getElementById('edContent'),p=ta.selectionStart;ta.value=ta.value.slice(0,p)+t+ta.value.slice(p);ta.focus();ta.selectionStart=ta.selectionEnd=p+t.length;updatePreview()}

        // ===== 图片上传 =====
        // tags 参数：['图库'] = 图库图片（图片管理），不传 = 文章/评论图片（不归图片管理）
        async function uploadImageAndGetUrl(file, tags){
            const prog=document.getElementById('uploadProgress'),pt=document.getElementById('uploadProgressText');
            prog.classList.add('show');pt.textContent=`上传 ${file.name}...`;
            try{const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file)});
            const body={data:b64,mime:file.type,name:file.name};
            if(tags)body.tags=tags;
            const r=await apiFetch('action=images',{method:'POST',body:JSON.stringify(body)});
            if(r.status==='success'){showToast(`已上传: ${r.key}`,'success');return r.url}else{showToast(r.message||'上传失败','error');return null}
            }catch{showToast('上传失败','error');return null}finally{prog.classList.remove('show')}
        }
        // 图片管理上传（不再标记特殊标签）
        async function uploadImages(files){
            const total = files.length;
            let success = 0, fail = 0;
            for(const f of files){
                showToast(`上传中 (${success + fail + 1}/${total}): ${f.name}`, 'success');
                const url = await uploadImageAndGetUrl(f);
                if(url){
                    success++;
                }else{
                    fail++;
                }
            }
            if(fail === 0){
                showToast(`上传完成: ${success} 张图片全部成功`, 'success');
            }else{
                showToast(`上传完成: ${success} 成功, ${fail} 失败`, fail > 0 ? 'error' : 'success');
            }
            await loadData();
        }
        function importToEditor(f){if(!f)return;const r=new FileReader();r.onload=()=>{const m=r.result.match(/^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/);insertAtCursor(m?m[2]:r.result);showToast(`已插入: ${f.name}`,'success')};r.readAsText(f)}
        function exportMarkdown(){const title=document.getElementById('edTitle').value.trim()||'untitled',md=`---\ntitle: ${title}\ndate: ${new Date().toISOString().slice(0,10)}\ntags: [${selectedArticleTags.join(', ')}]\nauthor: 渡鸦NULL\n---\n\n${document.getElementById('edContent').value}`,a=document.createElement('a');a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'}));a.download=`${title.replace(/[^a-zA-Z0-9\u4e00-\u9fff]/g,'-')}.md`;a.click();showToast('已导出','success')}

        // ===== 图片管理（显示所有图片）=====
        async function loadData(){
            // 并行加载图片和标签
            const [imgRes,tagRes]=await Promise.all([apiFetch('action=images'),apiFetch('action=tags')]);
            if(imgRes.status==='success'){
                // 显示所有图片
                allImageData=imgRes.data||[];
                cachedImages=allImageData;
            }
            if(tagRes.status==='success'){
                imageTagNames=(tagRes.data||[]).filter(t=>t.imageCount>0).map(t=>t.name);
            }
            // 默认选中第一个标签
            if(!classifyTag||!imageTagNames.includes(classifyTag)){
                classifyTag=imageTagNames[0]||'';
            }
            renderTagSel();
            renderPanels();
        }

        function renderTagSel(){
            const sel=document.getElementById('classifyTagSel');
            if(!imageTagNames.length){sel.innerHTML='<span style="color:var(--text-muted);font-size:12px">暂无图片标签，请先在标签管理中添加</span>';return}
            sel.innerHTML=imageTagNames.map(t=>`<button class="${classifyTag===t?'active':''}" onclick="selectTag('${t}')">${t}</button>`).join('');
        }

        function selectTag(tag){classifyTag=tag;renderTagSel();renderPanels()}

        function renderPanels(){
            // 未分类：没有任何标签的图片
            const untagged=allImageData.filter(i=>{
                const tags=i.tags||[];
                return tags.length===0;
            });
            const classified=allImageData.filter(i=>(i.tags||[]).includes(classifyTag));

            document.getElementById('unclassifiedCount').textContent=untagged.length;
            const leftGrid=document.getElementById('unclassifiedGrid');
            if(!untagged.length){leftGrid.innerHTML='<div class="classify-empty" style="border:none">所有图片已分类 ✓</div>'}
            else{leftGrid.innerHTML=untagged.map(img=>classifyCardHtml(img, false)).join('')}

            const rightGrid=document.getElementById('classifiedGrid');
            if(!classified.length){rightGrid.innerHTML='<div class="classify-empty">拖拽图片到这里分类</div>'}
            else{rightGrid.innerHTML=classified.map(img=>classifyCardHtml(img, true)).join('')}

            // 更新批量操作按钮状态
            updateBatchButtons();

            // 左侧放置区：拖入清除标签 或 拖入文件上传
            const leftPanel=document.getElementById('classifyLeft');
            leftPanel.ondragover=e=>{
                e.preventDefault();
                leftPanel.classList.add('drag-over');
            };
            leftPanel.ondragleave=()=>leftPanel.classList.remove('drag-over');
            leftPanel.ondrop=async e=>{
                e.preventDefault();
                leftPanel.classList.remove('drag-over');
                // 检查是否是文件拖拽
                if(e.dataTransfer.files && e.dataTransfer.files.length > 0){
                    const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
                    if(files.length > 0){
                        await uploadImages(files);
                        return;
                    }
                }
                // 否则是图片拖拽（移动到未分类）
                const key=e.dataTransfer.getData('text/key');
                if(key)await clearTags(key);
            };

            // 右侧放置区：拖入打标签
            const rightPanel=document.getElementById('classifyRight');
            rightPanel.ondragover=e=>{e.preventDefault();rightPanel.classList.add('drag-over')};
            rightPanel.ondragleave=()=>rightPanel.classList.remove('drag-over');
            rightPanel.ondrop=async e=>{e.preventDefault();rightPanel.classList.remove('drag-over');const key=e.dataTransfer.getData('text/key');if(key)await assignTag(key,classifyTag)};
        }

        function classifyCardHtml(img, showCheckbox=false){
            const checked = selectedImageKeys.has(img.key) ? 'checked' : '';
            const checkbox = (showCheckbox && batchMode) ? `<input type="checkbox" class="img-checkbox" ${checked} onclick="event.stopPropagation();toggleImageSelect('${img.key}')" style="position:absolute;top:4px;left:4px;z-index:2">` : '';
            return `<div class="classify-card${selectedImageKeys.has(img.key) && batchMode ? ' selected' : ''}" draggable="true" data-key="${img.key}" ondragstart="dragStart(event,'${img.key}')">${checkbox}<img src="${img.url}" loading="lazy"><div class="cc-bottom"><span class="cc-name" title="${img.key}">${img.key}</span><button class="cc-del" onclick="event.stopPropagation();deleteImage('${img.key}')" title="删除">&times;</button></div></div>`;
        }

        function dragStart(e,key){e.dataTransfer.setData('text/key',key);e.target.classList.add('dragging');e.target.addEventListener('dragend',()=>e.target.classList.remove('dragging'),{once:true})}

        async function clearTags(key){
            const img=allImageData.find(i=>i.key===key);
            const cur=img?(img.tags||[]):[];
            // 清空所有标签
            const newTags=[];
            if(cur.length===0){showToast('本就未分类','error');return}
            // 乐观更新
            if(img)img.tags=newTags;
            renderPanels();
            showToast('已移至未分类','success');
            // 后台同步
            const r=await apiFetch('action=images',{method:'PATCH',body:JSON.stringify({key,tags:newTags})});
            if(r.status!=='success'){if(img)img.tags=cur;renderPanels();showToast(r.message||'同步失败','error')}
        }

        // 切换批量模式
        function toggleBatchMode(){
            batchMode = !batchMode;
            const btnBatchMode = document.getElementById('btnBatchMode');
            const batchActions = document.getElementById('batchActions');
            
            if(batchMode){
                btnBatchMode.style.display = 'none';
                batchActions.style.display = 'flex';
            }else{
                btnBatchMode.style.display = '';
                batchActions.style.display = 'none';
                selectedImageKeys.clear();
            }
            renderPanels();
        }

        // 切换图片选中状态
        function toggleImageSelect(key){
            if(selectedImageKeys.has(key)){
                selectedImageKeys.delete(key);
            }else{
                selectedImageKeys.add(key);
            }
            renderPanels();
        }

        // 全选/取消全选
        function toggleSelectAll(){
            const classified=allImageData.filter(i=>(i.tags||[]).includes(classifyTag));
            if(selectedImageKeys.size === classified.length){
                // 取消全选
                selectedImageKeys.clear();
            }else{
                // 全选
                classified.forEach(img=>selectedImageKeys.add(img.key));
            }
            renderPanels();
        }

        // 更新批量操作按钮状态
        function updateBatchButtons(){
            if(!batchMode) return;
            
            const btnSelectAll=document.getElementById('btnSelectAll');
            const btnBatchClear=document.getElementById('btnBatchClear');
            const classified=allImageData.filter(i=>(i.tags||[]).includes(classifyTag));
            
            if(btnSelectAll){
                btnSelectAll.textContent = selectedImageKeys.size === classified.length && classified.length > 0 ? '取消全选' : '全选';
            }
            if(btnBatchClear){
                btnBatchClear.disabled = selectedImageKeys.size === 0;
            }
        }

        // 批量清除标签（移到未分类）
        async function batchClearTags(){
            if(selectedImageKeys.size === 0){showToast('请先选择图片','error');return}
            
            const count = selectedImageKeys.size;
            if(!confirm(`确定将 ${count} 张图片移至未分类？`))return;

            let success = 0, fail = 0;
            const keys = Array.from(selectedImageKeys);
            
            for(const key of keys){
                const img=allImageData.find(i=>i.key===key);
                const cur=img?(img.tags||[]):[];
                const newTags=[];
                
                // 乐观更新
                if(img)img.tags=newTags;
                
                // 后台同步
                const r=await apiFetch('action=images',{method:'PATCH',body:JSON.stringify({key,tags:newTags})});
                if(r.status==='success'){
                    success++;
                }else{
                    fail++;
                    if(img)img.tags=cur;
                }
            }

            selectedImageKeys.clear();
            batchMode = false;
            document.getElementById('btnBatchMode').style.display = '';
            document.getElementById('batchActions').style.display = 'none';
            renderPanels();
            
            if(fail === 0){
                showToast(`已将 ${success} 张图片移至未分类`,'success');
            }else{
                showToast(`${success} 成功，${fail} 失败`,'error');
            }
        }

        async function assignTag(key,tag){
            const img=allImageData.find(i=>i.key===key);
            const cur=img?(img.tags||[]):[];
            if(cur.includes(tag)){showToast(`已属于「${tag}」`,'error');return}
            const newTags=[...cur,tag];
            // 乐观更新：先改本地数据并刷新 UI
            if(img)img.tags=newTags;
            renderPanels();
            showToast(`已归入「${tag}」`,'success');
            // 后台同步
            const r=await apiFetch('action=images',{method:'PATCH',body:JSON.stringify({key,tags:newTags})});
            if(r.status!=='success'){
                // 失败则回滚
                if(img)img.tags=cur;
                renderPanels();
                showToast(r.message||'同步失败','error');
            }
        }

        async function deleteImage(key){if(!confirm(`确定删除 ${key}？`))return;
            // 乐观删除：先从本地移除
            const idx=allImageData.findIndex(i=>i.key===key);
            if(idx>=0)allImageData.splice(idx,1);
            renderPanels();
            // 后台同步
            const r=await apiFetch(`action=images&key=${encodeURIComponent(key)}`,{method:'DELETE'});
            if(r.status==='success'){showToast('已删除','success')}else{showToast(r.message||'删除失败','error');await loadData()}
        }

        // ===== 标签弹窗 =====
        function openTagModal(key,tags){tagModalKey=key;tagModalSelected=[...tags];const o=document.getElementById('tagModalOptions');o.innerHTML=imageTagNames.map(t=>`<span class="tag-opt ${tagModalSelected.includes(t)?'selected':''}" onclick="toggleTagOpt(this,'${t}')">${t}</span>`).join('');document.getElementById('customTagInput').value='';document.getElementById('tagModal').classList.add('open')}
        function closeTagModal(){document.getElementById('tagModal').classList.remove('open')}
        function toggleTagOpt(el,tag){if(tagModalSelected.includes(tag)){tagModalSelected=tagModalSelected.filter(t=>t!==tag);el.classList.remove('selected')}else{tagModalSelected.push(tag);el.classList.add('selected')}}
        function addCustomTag(){const input=document.getElementById('customTagInput'),tag=input.value.trim();if(!tag||tagModalSelected.includes(tag))return;tagModalSelected.push(tag);const o=document.getElementById('tagModalOptions'),s=document.createElement('span');s.className='tag-opt selected';s.textContent=tag;s.onclick=()=>toggleTagOpt(s,tag);o.appendChild(s);input.value=''}
        async function saveTagModal(){const r=await apiFetch('action=images',{method:'PATCH',body:JSON.stringify({key:tagModalKey,tags:tagModalSelected})});if(r.status==='success'){showToast('标签已更新','success');closeTagModal();await loadData()}else showToast(r.message||'更新失败','error')}

        // ===== 图片选择面板 =====
        async function openImagePicker(){
            document.getElementById('imagePickerPanel').classList.add('open');
            // 图片选择器加载所有图片（包括文章图片）
            const r=await apiFetch('action=images');
            if(r.status==='success')cachedImages=r.data||[];
            renderImagePicker();
        }
        function closeImagePicker(){document.getElementById('imagePickerPanel').classList.remove('open')}
        function renderImagePicker(){const l=document.getElementById('imagePickerList');if(!cachedImages.length){l.innerHTML='<div class="empty" style="padding:32px">暂无图片</div>';return}l.innerHTML=cachedImages.map(img=>`<div class="image-picker-item" onclick="insertFromPicker('${img.url}')"><img src="${img.url}" loading="lazy"><span class="name">${img.key}</span></div>`).join('')}
        function insertFromPicker(url){insertAtCursor(`![图片](${url})`);closeImagePicker();showToast('已插入','success')}
        async function uploadAndInsert(files){for(const f of files){const url=await uploadImageAndGetUrl(f);if(url)insertAtCursor(`![${f.name}](${url})`)}cachedImages=[];openImagePicker()}

        // ===== 标签选择器（写文章） =====
        async function loadArticleTagNames(){
            const r=await apiFetch('action=tags');
            if(r.status==='success'){
                articleTagNames=(r.data||[]).filter(t=>t.articleCount>0).map(t=>t.name);
            }
        }

        function renderTagPickerChips(){
            const wrap=document.getElementById('tagPickerInput');
            const input=document.getElementById('tagPickerText');
            // 移除旧的 chips
            wrap.querySelectorAll('.tp-chip').forEach(c=>c.remove());
            // 在 input 前插入 chips
            selectedArticleTags.forEach(tag=>{
                const chip=document.createElement('span');
                chip.className='tp-chip';
                chip.innerHTML=`${esc(tag)}<button onclick="removeArticleTag('${esc(tag)}')">&times;</button>`;
                wrap.insertBefore(chip,input);
            });
        }

        function addArticleTag(tag){
            tag=tag.trim();
            if(!tag||selectedArticleTags.includes(tag))return;
            selectedArticleTags.push(tag);
            renderTagPickerChips();
            closeTagDropdown();
            document.getElementById('tagPickerText').value='';
        }

        function removeArticleTag(tag){
            selectedArticleTags=selectedArticleTags.filter(t=>t!==tag);
            renderTagPickerChips();
        }

        function focusTagPicker(){
            document.getElementById('tagPickerText').focus();
            openTagDropdown();
        }

        function openTagDropdown(){
            if(tagPickerOpen)return;
            tagPickerOpen=true;
            renderTagDropdown();
            document.getElementById('tagPickerDropdown').classList.add('open');
            // 点击外部关闭
            setTimeout(()=>document.addEventListener('click',closeTagDropdownOutside),0);
        }

        function closeTagDropdown(){
            tagPickerOpen=false;
            document.getElementById('tagPickerDropdown').classList.remove('open');
            document.removeEventListener('click',closeTagDropdownOutside);
        }

        function closeTagDropdownOutside(e){
            const wrap=document.querySelector('.tag-picker-wrap');
            if(wrap&&!wrap.contains(e.target))closeTagDropdown();
        }

        function renderTagDropdown(){
            const dd=document.getElementById('tagPickerDropdown');
            const input=document.getElementById('tagPickerText').value.toLowerCase();
            const filtered=articleTagNames.filter(t=>!selectedArticleTags.includes(t)&&(!input||t.toLowerCase().includes(input)));
            if(!filtered.length){dd.innerHTML='<div style="padding:10px 12px;font-size:12px;color:var(--text-muted)">无匹配标签，回车添加新标签</div>';return}
            dd.innerHTML=filtered.map(t=>`<div class="tp-item" onclick="addArticleTag('${esc(t)}')">${esc(t)}</div>`).join('');
        }

        function filterTagDropdown(){if(tagPickerOpen)renderTagDropdown()}

        function tagPickerKeydown(e){
            const input=e.target.value.trim();
            if(e.key==='Enter'&&input){
                e.preventDefault();
                addArticleTag(input);
            }
            if(e.key==='Backspace'&&!input&&selectedArticleTags.length){
                selectedArticleTags.pop();
                renderTagPickerChips();
            }
        }

        // ===== Tab =====
        function switchTab(tab){
            document.querySelectorAll('.sidebar-item').forEach(el=>el.classList.toggle('active',el.dataset.tab===tab));
            ['articles','write','images','tags'].forEach(t=>document.getElementById('tab-'+t).style.display=t===tab?'block':'none');
            if(tab==='articles')loadArticles();
            if(tab==='images')loadData();
            if(tab==='tags')loadTags();
            if(tab==='write'){if(!editingId)resetEditor();loadArticleTagNames()}
        }

        // ===== 标签管理 =====
        let articleTagsData=[];
        let imageTagsData=[];
        let currentTagsView='article';
        let renameOldName='';
        let renameType='article';

        async function loadTags(){
            const r=await apiFetch('action=tags');
            if(r.status!=='success')return;
            const all=r.data||[];
            articleTagsData=all.filter(t=>t.articleCount>0).map(t=>({name:t.name,count:t.articleCount}));
            imageTagsData=all.filter(t=>t.imageCount>0).map(t=>({name:t.name,count:t.imageCount}));
            // 补充只有文章或只有图片的标签
            const allNames=new Set(all.map(t=>t.name));
            renderTags();
        }

        function switchTagsView(view){
            currentTagsView=view;
            document.querySelectorAll('.tags-nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tview===view));
            document.getElementById('tagsViewArticle').style.display=view==='article'?'block':'none';
            document.getElementById('tagsViewImage').style.display=view==='image'?'block':'none';
            renderTags();
        }

        function renderTags(){
            const data=currentTagsView==='article'?articleTagsData:imageTagsData;
            const gridId=currentTagsView==='article'?'articleTagsGrid':'imageTagsGrid';
            const grid=document.getElementById(gridId);
            const typeLabel=currentTagsView==='article'?'文章':'图片';
            if(!data.length){grid.innerHTML=`<div class="empty">暂无${typeLabel}标签</div>`;return}
            grid.innerHTML=data.map(t=>`
                <div class="tags-card">
                    <div class="tc-info">
                        <div class="tc-name">${esc(t.name)}</div>
                        <div class="tc-counts"><span>${currentTagsView==='article'?'📄':'🖼'} ${t.count} 个${typeLabel}</span></div>
                    </div>
                    <div class="tc-actions">
                        <button class="btn btn-ghost btn-sm" onclick="openRenameModal('${esc(t.name)}','${currentTagsView}')">重命名</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteTag('${esc(t.name)}',${t.count},'${currentTagsView}')">删除</button>
                    </div>
                </div>
            `).join('');
        }

        async function addNewTag(){
            const input=document.getElementById('newTagInput');
            const name=input.value.trim();
            if(!name){showToast('标签名不能为空','error');return}
            const data=currentTagsView==='article'?articleTagsData:imageTagsData;
            if(data.some(t=>t.name===name)){showToast('标签已存在','error');return}
            // 调用 API 保存到注册表
            const r=await apiFetch('action=tags',{method:'POST',body:JSON.stringify({name,type:currentTagsView})});
            if(r.status==='success'){
                data.unshift({name,count:0});
                renderTags();
                input.value='';
                showToast(`${currentTagsView==='article'?'文章':'图片'}标签「${name}」已添加`,'success');
            }else showToast(r.message||'添加失败','error');
        }

        function openRenameModal(oldName,type){
            renameOldName=oldName;
            renameType=type||currentTagsView;
            document.getElementById('renameInput').value=oldName;
            document.getElementById('renameModal').classList.add('open');
            setTimeout(()=>document.getElementById('renameInput').focus(),100);
        }
        function closeRenameModal(){document.getElementById('renameModal').classList.remove('open');renameOldName=''}

        async function confirmRename(){
            const newName=document.getElementById('renameInput').value.trim();
            if(!newName){showToast('名称不能为空','error');return}
            if(newName===renameOldName){closeRenameModal();return}
            const data=renameType==='article'?articleTagsData:imageTagsData;
            if(data.some(t=>t.name===newName)){showToast('标签名已存在','error');return}
            const r=await apiFetch('action=tags',{method:'PATCH',body:JSON.stringify({oldName:renameOldName,newName})});
            if(r.status==='success'){
                showToast(`已重命名：${renameOldName} → ${newName}`,'success');
                closeRenameModal();
                await loadTags();
            }else showToast(r.message||'重命名失败','error');
        }

        async function deleteTag(name,count,type){
            const typeLabel=type==='article'?'文章':'图片';
            if(count>0&&!confirm(`标签「${name}」下有 ${count} 个${typeLabel}，确定删除？`))return;
            if(count===0&&!confirm(`确定删除空标签「${name}」？`))return;
            const r=await apiFetch(`action=tags&name=${encodeURIComponent(name)}`,{method:'DELETE'});
            if(r.status==='success'){
                showToast(`已删除「${name}」，影响 ${r.imageChanges} 张图片、${r.articleChanges} 篇文章`,'success');
                await loadTags();
                await loadData(); // 刷新图片数据
            }else showToast(r.message||'删除失败','error');
        }

        function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
        function showToast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className=`toast toast-${type}`;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
        (function(){if(adminKey)apiFetch('action=login',{method:'POST',body:JSON.stringify({key:adminKey})}).then(r=>{if(r.status==='success')showAdmin();else doLogout()}).catch(()=>doLogout())})();
    </script>
</body>
</html>
