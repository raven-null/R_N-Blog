<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="渡鸦NULL 博客文章。">
    <meta name="author" content="渡鸦NULL">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="渡鸦NULL">
    <meta property="og:title" content="文章 - 渡鸦NULL">
    <meta property="og:description" content="渡鸦NULL 博客文章。">
    <meta property="og:image" content="https://ravennull.work/images/Default/web-logo.webp">
    <meta property="og:locale" content="zh_CN">
    <meta name="twitter:card" content="summary">
    <title>文章详情 - 我的博客</title>
    <link rel="icon" id="siteFavicon" href="/images/Default/web-logo.webp" type="image/webp">
    <link rel="apple-touch-icon" href="/images/Default/web-logo.webp">
    <!-- 手写体 Virgil：hand-body 默认开，preload 消掉 swap 闪动 -->
    <link rel="preload" href="/fonts/Virgil.woff2" as="font" type="font/woff2" crossorigin>
    <!-- 进入文章页前先把上次的阅读设置（字号 / 行距 / 衬线 / 手写）贴回 <html>，
         否则会先按默认渲染一帧，看着像"设置被重置" -->
    <script>
        (function () {
            try {
                var s = JSON.parse(localStorage.getItem('reader-settings') || '{}');
                var root = document.documentElement;
                if (s && s.font) root.style.setProperty('--reader-font-size', s.font + 'px');
                if (s && s.line) root.style.setProperty('--reader-line-height', s.line);
                if (s && s.fontFamily === 'serif') root.classList.add('reader-serif');
                if (localStorage.getItem('blog-hand-body') === '1') root.classList.add('hand-body');
            } catch (e) { /* 读不到就按默认 */ }
        })();
    </script>
    <script src="/js/site-icon.js?v=1.0.0" defer></script>
    
    <!-- 主样式 -->
    <link rel="stylesheet" href="css/style.css?v=4.27.0">
    <link rel="stylesheet" href="css/glass.css?v=4.26.2">

    <!-- 共享胶囊样式：文章正文里的白板嵌入块由白板编辑器渲染
         （.mm-capsule / .mm-cap-btn），这些类是它的一部分，必须保留；
         文章页自己的底部胶囊已废弃，不受影响 -->
    <link rel="stylesheet" href="css/capsule.css?v=1.0.0">
    <!-- 共享留言抽屉样式：白板 / 导图编辑器自带的「留言」右侧抽屉（.mm-drawer*）
         在文章正文内嵌块里同样要显示，抽屉结构由编辑器渲染而非文章页；
         文章页自己的 #mmDrawer 与底部胶囊已废弃，不受影响 -->
    <link rel="stylesheet" href="css/drawer.css?v=1.0.1">
    
    <!-- Marked.js -->
    <script src="js/vendor/marked.min.js" defer></script>
    
    <!-- Highlight.js -->
    <link rel="stylesheet" href="css/highlight-github-dark.min.css">
    <!-- highlight.js 由 article-app.js 在文章含代码块时按需加载 -->

    <!-- Anime.js -->
    <script src="js/vendor/anime.umd.min.js" defer></script>
    
    <style>
        /* ===== 页面整体布局 ===== */
        .article-layout {
            max-width: 100%;
            margin: 0 auto;
            padding: 24px 48px 80px 296px;
        }

        /* 正文卡宽度跟着 .article-main 走（v3.47.0）。
           style.css 里 `.article-content { max-width: 900px }` 是远古的单栏上限：
           在宽屏上它把正文卡死死卡在 900px，而 .article-main 已经是 1400px，
           于是正文右边先空 500px、再空掉整条视口右侧（2K 屏上实测空 1340px）。 */
        .article-content { max-width: 100%; }

        /* ===== 左侧目录栏（固定定位，不随页面滚动） ===== */
        .toc-sidebar {
            width: 240px;
            position: fixed;
            top: 24px;
            left: 24px;
            height: calc(100vh - 48px);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 100;
        }

        /* 返回按钮：固定在侧边栏顶部 */
        .toc-sidebar .back-button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            flex-shrink: 0;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .toc-sidebar .back-button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* 顶部操作栏 */
        .sidebar-top-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .sidebar-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .sidebar-action-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-primary);
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: border-color 0.2s ease, color 0.2s ease;
            text-decoration: none;
        }

        .sidebar-action-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* 返回上一页按钮 - 大尺寸 */
        .sidebar-go-back {
            width: auto;
            height: 40px;
            padding: 0 16px;
            gap: 8px;
            font-size: 13px;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
        }

        /* 移动端顶部操作栏 */
        .mobile-top-bar {
            display: none;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        /* 目录容器：可滚动，占据返回按钮以下的空间 */
        .toc-sidebar-inner {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        /* 隐藏滚动条但保留功能 */
        .toc-sidebar-inner::-webkit-scrollbar {
            width: 0;
        }

        /* 目录头部（固定不滚动） */
        .toc-header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--bg-secondary);
            padding-bottom: 12px;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .toc-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .toc-title .toc-collapse-btn {
            margin-left: auto;
        }

        /* 目录列表容器（可滚动） */
        .toc-list-wrapper {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            will-change: scroll-position;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .toc-list-wrapper::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        /* 目录搜索框 */
        .toc-search {
            flex: 1;
            position: relative;
            margin-left: auto;
        }

        .toc-search-input {
            width: 100%;
            padding: 4px 24px 4px 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        .toc-search-input::placeholder {
            color: var(--text-muted);
        }

        .toc-search-input:focus {
            border-color: var(--accent);
        }

        .toc-search-icon {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .toc-list {
            list-style: none;
            padding: 0;
        }

        .toc-list li {
            margin-bottom: 2px;
        }

        .toc-list a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            transition: all 0.2s ease;
            display: block;
            padding: 6px 10px;
            border-radius: 6px;
            border-left: 2px solid transparent;
            line-height: 1.4;
            outline: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        .toc-list a:focus {
            outline: none;
            box-shadow: none;
        }

        .toc-list a:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        .toc-list a.active {
            color: var(--accent);
            border-left-color: var(--accent);
            background: var(--glow);
        }

        .toc-list .toc-h2 {
            padding-left: 10px;
            font-weight: 500;
        }

        .toc-list .toc-h3 {
            padding-left: 24px;
            font-size: 12px;
        }

        .toc-list .toc-h4 {
            padding-left: 38px;
            font-size: 12px;
        }

        /* 无目录空状态（短文） */
        .toc-empty {
            list-style: none;
            padding: 32px 12px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.6;
        }

        /* 目录折叠按钮 */
        .toc-collapse-btn {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            margin-left: 8px;
        }

        .toc-collapse-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .toc-collapse-btn.collapsed svg {
            transform: rotate(-90deg);
        }

        /* 折叠状态的子目录 */
        .toc-list .toc-child {
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.2s ease;
            max-height: none;
            opacity: 1;
        }

        .toc-list .toc-child.collapsed {
            max-height: 0;
            opacity: 0;
        }

        .toc-list .toc-child-container {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        /* 可折叠的父级目录项 */
        .toc-list .toc-parent {
            position: relative;
        }

        .toc-list .toc-parent-title {
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }

        .toc-list .toc-parent-title > a {
            cursor: pointer;
            flex: 1;
            min-width: 0;
        }

        /* 折叠图标 */
        .toc-toggle-icon {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s ease;
            border-radius: 3px;
            flex-shrink: 0;
            margin-left: auto;
        }

        .toc-toggle-icon:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .toc-toggle-icon svg {
            transition: transform 0.2s ease;
        }

        .toc-list .toc-parent.collapsed .toc-toggle-icon svg {
            transform: rotate(-90deg);
        }

        .toc-list .toc-parent.collapsed .toc-toggle-icon {
            color: var(--accent);
        }

        /* ===== 右侧主内容区 ===== */
        .article-main {
            width: 100%;
            max-width: 1250px;
            min-width: 0;
        }

        /* ===== 移动端功能汇总悬浮球 =====
           基础样式放全局、默认隐藏，窄屏或触屏设备才显示。
           不再由 JS 按窗口宽度写内联 display，避免手机上不出现。 */
        .mobile-float-ball {
            position: fixed;
            right: 16px;
            bottom: 100px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 150;
            box-shadow: 0 4px 16px var(--shadow);
            transition: all 0.3s;
        }

        /* 窄屏或触摸设备（含手机「桌面版网站」模式）显示悬浮球 */
        @media (max-width: 773px), (hover: none) and (pointer: coarse) {
            .mobile-float-ball {
                display: flex;
            }
        }

        .mobile-menu-btn.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* 专注模式下目录侧栏是隐藏的，菜单里的目录入口一并收起 */
        html.reader-focus .mobile-menu-btn[data-focus-hide] {
            display: none;
        }

        /* 移动端返回按钮（侧边栏隐藏时显示在主内容区） */
        .article-main .back-button {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            margin-bottom: 24px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .article-main .back-button:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 12px var(--glow);
        }

        /* 文章头部 */
        .article-header {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px var(--shadow);
        }

        .article-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent-dim), var(--text-muted));
            box-shadow: 0 0 10px var(--glow);
        }

        .article-title {
            font-size: 32px;
            font-weight: 900;
            color: var(--text-primary);
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .article-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .meta-icon {
            color: var(--accent);
            opacity: 0.8;
            flex-shrink: 0;
        }

        .article-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }

        .article-tag {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            background: color-mix(in srgb, var(--accent) 10%, transparent);
            color: var(--accent);
            border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
            box-shadow: 0 0 8px var(--glow);
        }

        /* 文章内容 */
        .article-content {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 32px;
            border: 1px solid var(--border);
            line-height: 1.8;
            color: var(--text-primary);
            box-shadow: 0 4px 20px var(--shadow);
        }

        /* Markdown 内容样式 */
        .article-content h1,
        .article-content h2,
        .article-content h3,
        .article-content h4,
        .article-content h5,
        .article-content h6 {
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 700;
            line-height: 1.3;
            color: var(--text-primary);
        }

        .article-content h1 {
            font-size: 28px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border);
        }

        .article-content h2 {
            font-size: 24px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .article-content h3 {
            font-size: 20px;
        }

        .article-content p {
            margin-bottom: 16px;
        }

        .article-content a {
            color: var(--accent-dim);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s ease;
        }

        .article-content a:hover {
            border-bottom-color: var(--accent-dim);
            text-shadow: 0 0 8px var(--glow);
        }

        .article-content strong {
            color: var(--accent);
            font-weight: 700;
        }

        .article-content em {
            font-style: italic;
            color: var(--text-secondary);
        }

        .article-content ul,
        .article-content ol {
            margin-bottom: 16px;
            padding-left: 24px;
        }

        .article-content li {
            margin-bottom: 8px;
        }

        .article-content blockquote {
            margin: 16px 0;
            padding: 16px 20px;
            border-left: 4px solid var(--accent);
            background: var(--bg-tertiary);
            border-radius: 0 8px 8px 0;
            color: var(--text-secondary);
            box-shadow: inset 4px 0 12px var(--glow);
            position: relative;
        }

        .article-content blockquote p:last-child {
            margin-bottom: 0;
        }

        .article-content code {
            font-family: 'Fira Code', 'Consolas', monospace;
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
            /* 行内代码跟正文同字号（v3.47.2）：写死 14px 时，整行被反引号包住的
               段落会比相邻普通段落小一号。等宽字体和底色保留，仍看得出是代码。
               代码块（pre > code）有自己的 14px，不受影响。 */
            font-size: 1em;
            color: var(--accent-dim);
        }

        /* 标题里的行内代码跟随标题（v3.47.4）
           同一个 h3，写成 `### \`xxx\`` 会变成灰色等宽 + 深色底片，写成 `### xxx`
           才是白色粗体 —— 看起来就是「都是 3 级标题，样式完全不一样」。
           标题是结构，样式交给级别决定。 */
        .article-content h1 code,
        .article-content h2 code,
        .article-content h3 code,
        .article-content h4 code,
        .article-content h5 code,
        .article-content h6 code {
            font-family: inherit;
            font-size: 1em;
            font-weight: inherit;
            color: inherit;
            background: none;
            padding: 0;
            border-radius: 0;
        }

        /* 列表嵌在标题里时不要跟着标题变大（v3.47.5）：
           实测 <h2><ol><li> 的 li 与序号是 24.8px，正文才 16px */
        .article-content h1 ol, .article-content h1 ul,
        .article-content h2 ol, .article-content h2 ul,
        .article-content h3 ol, .article-content h3 ul,
        .article-content h4 ol, .article-content h4 ul,
        .article-content h5 ol, .article-content h5 ul,
        .article-content h6 ol, .article-content h6 ul,
        .article-content h1 li, .article-content h2 li,
        .article-content h3 li, .article-content h4 li,
        .article-content h5 li, .article-content h6 li {
            font-size: 1em;
            font-weight: 400;
            line-height: 1.8;
        }

        /* 文字高亮 */
        .article-content mark {
            background: linear-gradient(120deg, rgba(255, 210, 0, 0.2) 0%, rgba(255, 210, 0, 0.4) 100%);
            color: inherit;
            padding: 2px 6px;
            border-radius: 4px;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
        }
        /* 多色高亮（v3.48.0）：=={red}文字== 渲染成 <mark class="hl hl-red">。
           写作页那套调色板与此一一对应，颜色值两处保持一致。 */
        .article-content mark.hl { background: none; }
        .article-content mark.hl-yellow { background: rgba(255, 210, 0, .38); }
        .article-content mark.hl-orange { background: rgba(255, 150, 60, .38); }
        .article-content mark.hl-red { background: rgba(255, 90, 90, .38); }
        .article-content mark.hl-green { background: rgba(80, 210, 130, .34); }
        .article-content mark.hl-blue { background: rgba(90, 160, 255, .38); }
        .article-content mark.hl-purple { background: rgba(180, 120, 255, .38); }
        .article-content mark.hl-gray { background: rgba(160, 170, 190, .34); }

        /* 代码块 */
        .article-content .code-block {
            margin: 16px 0;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .article-content .code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }

        .article-content .code-lang {
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'Fira Code', 'Consolas', monospace;
        }

        .article-content pre {
            margin: 0;
            padding: 16px;
            background: var(--bg-tertiary);
            overflow-x: auto;
            border: none;
            /* 隐藏滚动条，按住可左右拖动查看超长行 */
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            cursor: grab;
        }

        .article-content pre::-webkit-scrollbar {
            display: none;
        }

        .article-content pre code {
            background: none;
            padding: 0;
            font-size: 14px;
            line-height: 1.6;

        .article-content .excalidraw-embed:not(.embed-block) {

        /* ===== 内嵌画布块（```embed board:/map: 与历史 ```excalidraw）=====
           由 markdown-config.js 的 renderer.code 产出占位容器，
           再经 article-app.js 的 mountEmbeds() 挂载真实画布。 */

        /* 内嵌白板会让页面长出横向滚动条，这里兜一下：
           Excalidraw 内部的 .SVGLayer 是 position:fixed 且宽度按窗口算（1440px），
           卡片左侧还有目录占位时 right 就跑到 1769 —— fixed 元素不受祖先 overflow:hidden
           裁剪（上面的 .embed-block 规则拦不住它），只能用 overflow-x: clip 让浏览器
           不再把它算进 scrollWidth。视觉上画布本来就该被卡片裁掉，不影响渲染。 */
        .article-content {
            overflow-x: clip;

        .article-content .embed-figure {

        .article-content .embed-block {

            min-height: 260px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: #fff;                 /* 画布为浅色底，避免暗色主题下与画布反差过大 */
        }

        .board-done, .board-save {

    <script>
    /* DSH-LAZY: 桌宠引擎（约 200KB）空闲时再注入，别挡住文章首屏 */
    (function () {
        var DEPS = [
            '/vendor/grok/geometry-data.js?v=1.0.0',
            '/vendor/grok/math.js?v=1.0.0',
            '/vendor/grok/tables.js?v=1.0.0',
            '/vendor/grok/pose.js?v=1.0.0',
            '/vendor/grok/tricks.js?v=1.0.0',
            '/vendor/grok/fx.js?v=1.0.0',
            '/vendor/grok/eyes.js?v=1.0.0',
            '/vendor/grok/character.js?v=1.0.2',
            '/js/pet-core.js?v=2.0.6',
            '/js/pet-mind.js?v=2.0.5'
        ];
        var started = false;
        function load() {
            if (started) return;
            started = true;
            DEPS.forEach(function (src) {
                var s = document.createElement('script');
                s.src = src;
                s.async = false;   // 保持顺序：grok 引擎有依赖链
                s.onload = function () {
                    if (src.indexOf('pet-core') !== -1 && window.PetCore) PetCore.init();
                    if (src.indexOf('pet-mind') !== -1 && window.PetMind) PetMind.start();
                };
                document.body.appendChild(s);
            });
        }
        function schedule() {
            // 空闲回调 + 超时兜底：后台标签可能一直不"空闲"（load 内有 started 守卫）
            if ('requestIdleCallback' in window) requestIdleCallback(load, { timeout: 1500 });
            setTimeout(load, 'requestIdleCallback' in window ? 2100 : 700);
        }
        if (document.readyState === 'complete') schedule();
        else {
            window.addEventListener('load', function () { setTimeout(schedule, 200); });
            // 兜底：load 迟迟不来（后台标签 / 慢资源）也照样注入
            setTimeout(schedule, 1500);
        }
    })();
    </script>

    <script>
        // 手写体是「首页 hero 的笔形按钮」在全站总开关，文章页只跟随设置、不再自己开一个开关：
        // 进页时把 <html> 上的 hand-body 同步成 localStorage 里的值即可（首帧由 head 里的脚本先行套用）
        (function () {
            try {
                var on = localStorage.getItem('blog-hand-body') === '1';
                document.documentElement.classList.toggle('hand-body', on);
            } catch (e) { /* 读不到就按默认 */ }
        })();
    </script>
