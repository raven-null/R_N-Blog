<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章详情 - 我的博客</title>
    <link rel="icon" id="siteFavicon" href="/images/Default/web-logo.webp" type="image/webp">
    <link rel="apple-touch-icon" href="/images/Default/web-logo.webp">
    <script src="/js/site-icon.js?v=1.0.0"></script>
    
    <!-- 主样式 -->
    <link rel="stylesheet" href="css/style.css?v=3.16.3">
    <link rel="stylesheet" href="css/glass.css?v=1.0.11">
    
    <!-- Marked.js -->
    <script src="js/vendor/marked.min.js" defer></script>
    
    <!-- Highlight.js -->
    <link rel="stylesheet" href="css/highlight-github-dark.min.css">
    <!-- highlight.js 由 article-app.js 在文章含代码块时按需加载 -->

    <!-- Anime.js -->
    <script src="js/vendor/anime.umd.min.js" defer></script>
    
    <style>
        /* ===== 页面整体布局 ===== */
        .article-layout {
            max-width: 100%;
            margin: 0 auto;
            padding: 24px 48px 80px 296px;
        }

        /* ===== 左侧目录栏（固定定位，不随页面滚动） ===== */
        .toc-sidebar {
            width: 240px;
            position: fixed;
            top: 24px;
            left: 24px;
            height: calc(100vh - 48px);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 100;
        }

        /* 返回按钮：固定在侧边栏顶部 */
        .toc-sidebar .back-button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            flex-shrink: 0;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .toc-sidebar .back-button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* 顶部操作栏 */
        .sidebar-top-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .sidebar-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .sidebar-action-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-primary);
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: border-color 0.2s ease, color 0.2s ease;
            text-decoration: none;
        }

        .sidebar-action-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* 返回上一页按钮 - 大尺寸 */
        .sidebar-go-back {
            width: auto;
            height: 40px;
            padding: 0 16px;
            gap: 8px;
            font-size: 13px;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
        }

        /* 移动端顶部操作栏 */
        .mobile-top-bar {
            display: none;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        /* 目录容器：可滚动，占据返回按钮以下的空间 */
        .toc-sidebar-inner {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        /* 隐藏滚动条但保留功能 */
        .toc-sidebar-inner::-webkit-scrollbar {
            width: 0;
        }

        /* 目录头部（固定不滚动） */
        .toc-header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--bg-secondary);
            padding-bottom: 12px;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .toc-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .toc-title .toc-collapse-btn {
            margin-left: auto;
        }

        /* 目录列表容器（可滚动） */
        .toc-list-wrapper {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            will-change: scroll-position;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .toc-list-wrapper::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        /* 目录搜索框 */
        .toc-search {
            flex: 1;
            position: relative;
            margin-left: auto;
        }

        .toc-search-input {
            width: 100%;
            padding: 4px 24px 4px 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        .toc-search-input::placeholder {
            color: var(--text-muted);
        }

        .toc-search-input:focus {
            border-color: var(--accent);
        }

        .toc-search-icon {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .toc-list {
            list-style: none;
            padding: 0;
        }

        .toc-list li {
            margin-bottom: 2px;
        }

        .toc-list a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            transition: all 0.2s ease;
            display: block;
            padding: 6px 10px;
            border-radius: 6px;
            border-left: 2px solid transparent;
            line-height: 1.4;
            outline: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        .toc-list a:focus {
            outline: none;
            box-shadow: none;
        }

        .toc-list a:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        .toc-list a.active {
            color: var(--accent);
            border-left-color: var(--accent);
            background: var(--glow);
        }

        .toc-list .toc-h2 {
            padding-left: 10px;
            font-weight: 500;
        }

        .toc-list .toc-h3 {
            padding-left: 24px;
            font-size: 12px;
        }

        .toc-list .toc-h4 {
            padding-left: 38px;
            font-size: 12px;
        }

        /* 无目录空状态（短文） */
        .toc-empty {
            list-style: none;
            padding: 32px 12px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.6;
        }

        /* 目录折叠按钮 */
        .toc-collapse-btn {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            margin-left: 8px;
        }

        .toc-collapse-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .toc-collapse-btn.collapsed svg {
            transform: rotate(-90deg);
        }

        /* 折叠状态的子目录 */
        .toc-list .toc-child {
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.2s ease;
            max-height: none;
            opacity: 1;
        }

        .toc-list .toc-child.collapsed {
            max-height: 0;
            opacity: 0;
        }

        .toc-list .toc-child-container {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        /* 可折叠的父级目录项 */
        .toc-list .toc-parent {
            position: relative;
        }

        .toc-list .toc-parent-title {
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }

        .toc-list .toc-parent-title > a {
            cursor: pointer;
            flex: 1;
            min-width: 0;
        }

        /* 折叠图标 */
        .toc-toggle-icon {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s ease;
            border-radius: 3px;
            flex-shrink: 0;
            margin-left: auto;
        }

        .toc-toggle-icon:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .toc-toggle-icon svg {
            transition: transform 0.2s ease;
        }

        .toc-list .toc-parent.collapsed .toc-toggle-icon svg {
            transform: rotate(-90deg);
        }

        .toc-list .toc-parent.collapsed .toc-toggle-icon {
            color: var(--accent);
        }

        /* ===== 右侧主内容区 ===== */
        .article-main {
            width: 100%;
            max-width: 1250px;
            min-width: 0;
        }

        /* 移动端返回按钮（侧边栏隐藏时显示在主内容区） */
        .article-main .back-button {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            margin-bottom: 24px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .article-main .back-button:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 12px var(--glow);
        }

        /* 文章头部 */
        .article-header {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px var(--shadow);
        }

        .article-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent-dim), var(--text-muted));
            box-shadow: 0 0 10px var(--glow);
        }

        .article-title {
            font-size: 32px;
            font-weight: 900;
            color: var(--text-primary);
            margin-bottom: 16px;
            line-height: 1.3;
            /* 抵消 header 左右内边距，标题文字与卡片同宽（顶到左右边缘） */
            margin-left: -32px;
            margin-right: -32px;
        }

        .article-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .meta-icon {
            color: var(--accent);
            opacity: 0.8;
            flex-shrink: 0;
        }

        .article-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }

        .article-tag {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            background: color-mix(in srgb, var(--accent) 10%, transparent);
            color: var(--accent);
            border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
            box-shadow: 0 0 8px var(--glow);
        }

        /* 文章内容 */
        .article-content {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 32px;
            border: 1px solid var(--border);
            line-height: 1.8;
            color: var(--text-primary);
            box-shadow: 0 4px 20px var(--shadow);
        }

        /* Markdown 内容样式 */
        .article-content h1,
        .article-content h2,
        .article-content h3,
        .article-content h4,
        .article-content h5,
        .article-content h6 {
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 700;
            line-height: 1.3;
            color: var(--text-primary);
        }

        .article-content h1 {
            font-size: 28px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border);
        }

        .article-content h2 {
            font-size: 24px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .article-content h3 {
            font-size: 20px;
        }

        .article-content p {
            margin-bottom: 16px;
        }

        .article-content a {
            color: var(--accent-dim);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s ease;
        }

        .article-content a:hover {
            border-bottom-color: var(--accent-dim);
            text-shadow: 0 0 8px var(--glow);
        }

        .article-content strong {
            color: var(--accent);
            font-weight: 700;
        }

        .article-content em {
            font-style: italic;
            color: var(--text-secondary);
        }

        .article-content ul,
        .article-content ol {
            margin-bottom: 16px;
            padding-left: 24px;
        }

        .article-content li {
            margin-bottom: 8px;
        }

        .article-content blockquote {
            margin: 16px 0;
            padding: 16px 20px;
            border-left: 4px solid var(--accent);
            background: var(--bg-tertiary);
            border-radius: 0 8px 8px 0;
            color: var(--text-secondary);
            box-shadow: inset 4px 0 12px var(--glow);
            position: relative;
        }

        .article-content blockquote p:last-child {
            margin-bottom: 0;
        }

        .article-content code {
            font-family: 'Fira Code', 'Consolas', monospace;
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 14px;
            color: var(--accent-dim);
        }

        /* 文字高亮 */
        .article-content mark {
            background: linear-gradient(120deg, rgba(255, 210, 0, 0.2) 0%, rgba(255, 210, 0, 0.4) 100%);
            color: inherit;
            padding: 2px 6px;
            border-radius: 4px;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
        }

        /* 代码块 */
        .article-content .code-block {
            margin: 16px 0;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .article-content .code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }

        .article-content .code-lang {
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'Fira Code', 'Consolas', monospace;
        }

        .article-content pre {
            margin: 0;
            padding: 16px;
            background: var(--bg-tertiary);
            overflow-x: auto;
            border: none;
            /* 隐藏滚动条，按住可左右拖动查看超长行 */
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            cursor: grab;
        }

        .article-content pre::-webkit-scrollbar {
            display: none;
        }

        .article-content pre code {
            background: none;
            padding: 0;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-primary);
        }

        /* 复制按钮 */
        .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-primary);
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .copy-btn.copied {
            border-color: #10b981;
            color: #10b981;
        }

        .article-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 0;
        }

        .article-content .img-figure {
            margin: 20px 0;
            text-align: center;
            background: var(--bg-tertiary);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        /* Excalidraw 内嵌白板（```excalidraw fence 渲染后的容器） */
        .article-content .excalidraw-embed {
            height: 70vh;
            min-height: 420px;
            max-height: 900px;
            margin: 20px 0;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: #fff;
            position: relative;
        }
        .article-content .excalidraw-error {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-tertiary);
            color: var(--text-muted);
            font-size: 14px;
        }
        /* 纯白板文章（type=whiteboard）：整页白板、无目录 */
        body.no-toc .toc-sidebar { display: none !important; }
        .article-content .article-whiteboard {
            height: calc(100dvh - 240px);
            min-height: 460px;
            margin: 10px 0 26px;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 10px 40px -18px var(--shadow);
            background: #fff;
            position: relative;
        }
        .article-content .article-empty-tip {
            padding: 60px 0;
            text-align: center;
            color: var(--text-muted);
        }

        /* ===== 纯白板文章 · 沉浸式画布舞台（body.board-mode） ===== */
        body.board-mode { overflow: hidden; height: 100%; }
        body.board-mode .article-progress,
        body.board-mode #tocSidebar,
        body.board-mode .mobile-top-bar,
        body.board-mode .reader-toolbar,
        body.board-mode #article-header,
        body.board-mode #article-navigation,
        body.board-mode .mobile-float-ball { display: none !important; }
        body.board-mode .article-layout { padding: 0; margin: 0; max-width: 100%; }
        body.board-mode .article-main { width: 100%; max-width: none; padding: 0; }
        body.board-mode #article-content {
            position: fixed; inset: 0; padding: 0; margin: 0; width: auto; max-width: none;
        }
        .board-stage {
            position: absolute; inset: 0; overflow: hidden;
            background:
                radial-gradient(ellipse 55% 45% at 12% 15%, rgba(90, 120, 255, 0.14), transparent 65%),
                radial-gradient(ellipse 45% 38% at 88% 12%, rgba(190, 90, 255, 0.10), transparent 60%),
                radial-gradient(ellipse 55% 45% at 80% 85%, rgba(0, 210, 190, 0.08), transparent 60%),
                #0a0a0e;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        }
        .board-stage .board-canvas { position: absolute; inset: 0; }
        .board-stage .board-canvas .excalidraw { position: absolute; inset: 0; }
        /* 画布宿主（view/edit 共用的容器）必须占满舞台，否则高度塌陷不显示 */
        .board-stage .board-canvas #boardCanvasHost,
        .board-stage .board-canvas .excalidraw-edit-host { position: absolute; inset: 0; }
        /* 同一个胶囊内按状态切换：查看态显示返回/编辑/信息/留言，编辑态显示保存/完成 */
        .board-topbar .bb-edit-only { display: none; }
        .board-stage.editing .board-topbar .bb-view-only { display: none !important; }
        .board-stage.editing .board-topbar .bb-edit-only { display: inline-flex; }
        .board-done, .board-save {
            display: inline-flex; align-items: center; gap: 6px;
            color: #e8e8ea; font-size: 12.5px; padding: 7px 15px; border-radius: 999px; cursor: pointer;
            background: linear-gradient(145deg, rgba(30, 30, 37, 0.85), rgba(20, 20, 26, 0.78));
            backdrop-filter: blur(26px) saturate(180%); -webkit-backdrop-filter: blur(26px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.13);
            box-shadow: 0 14px 44px -10px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease;
            font-family: inherit;
        }
        .board-done svg, .board-save svg { width: 14px; height: 14px; }
        .board-done:hover, .board-save:hover { background: linear-gradient(145deg, rgba(48, 48, 58, 0.95), rgba(28, 28, 36, 0.85)); }
        .board-save {
            color: #eaf2ff; border-color: rgba(115, 170, 255, 0.45);
            background: linear-gradient(145deg, rgba(59, 130, 246, 0.42), rgba(115, 170, 255, 0.28));
        }
        .board-save:hover { background: linear-gradient(145deg, rgba(59, 130, 246, 0.6), rgba(115, 170, 255, 0.42)); }
        .board-save[disabled] { opacity: 0.6; cursor: default; }
        .board-tip {
            position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
            white-space: nowrap; font-size: 12px; color: #e8e8ea; padding: 6px 12px; border-radius: 999px;
            background: rgba(20, 20, 26, 0.92); border: 1px solid rgba(255, 255, 255, 0.13);
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
        }
        .board-tip.show { opacity: 1; }
        .board-tip.ok { border-color: rgba(123, 216, 143, 0.45); color: #d7f5df; }
        .board-tip.err { border-color: rgba(239, 106, 94, 0.5); color: #ffd9d5; }
        @media (max-width: 768px) {
            /* 手机端：不提供保存键（保存时机由「完成」时的询问处理），只留「完成」且移到工具栏上方 */
            /* 手机端：不提供保存键（保存时机由「完成」时的询问处理） */
            .board-topbar .board-save { display: none; }
            .board-tip { left: auto; right: 0; transform: none; bottom: calc(100% + 6px); }
        }
        /* 编辑态：隐藏舞台浮层 */
        .board-stage.editing .exc-shell .exc-bar { border-radius: 0; }
        .board-stage.editing .exc-shell .exc-msg { margin: 6px 10px 8px; }
        /* 退出编辑确认弹层 */
        .board-dlg {
            position: absolute; inset: 0; z-index: 60; display: none;
            align-items: center; justify-content: center; padding: 18px;
            background: rgba(5, 5, 9, 0.5); backdrop-filter: blur(10px) saturate(140%);
            -webkit-backdrop-filter: blur(10px) saturate(140%);
        }
        .board-dlg.show { display: flex; }
        .board-dlg .bd-card {
            width: min(350px, 92vw); padding: 22px; border-radius: 22px;
            background: linear-gradient(145deg, rgba(34, 34, 42, 0.97), rgba(20, 20, 26, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.13);
            box-shadow: 0 30px 90px -20px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
            animation: board-pop-in 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .board-dlg .bd-title { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .board-dlg .bd-sub { font-size: 12.5px; color: rgba(255, 255, 255, 0.45); margin-bottom: 16px; line-height: 1.7; }
        .board-dlg .bd-btns { display: flex; flex-direction: column; gap: 8px; }
        .board-dlg .bd-btn {
            display: flex; align-items: center; justify-content: center; gap: 7px;
            padding: 10px 16px; border-radius: 13px; cursor: pointer;
            font-size: 13.5px; color: #e8e8ea; font-family: inherit;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.04));
            border: 1px solid rgba(255, 255, 255, 0.13);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease, border-color 0.2s ease;
        }
        .board-dlg .bd-btn:hover { background: linear-gradient(145deg, rgba(255, 255, 255, 0.17), rgba(255, 255, 255, 0.07)); border-color: rgba(255, 255, 255, 0.28); }
        .board-dlg .bd-btn:active { transform: scale(0.97); }
        .board-dlg .bd-btn svg { width: 14px; height: 14px; }
        .board-dlg .bd-btn.primary { color: #0b0b10; font-weight: 600; background: linear-gradient(180deg, #fff, #d9d9e3); border-color: rgba(255, 255, 255, 0.55); }
        .board-dlg .bd-btn.primary:hover { background: linear-gradient(180deg, #fff, #e8e8f0); }
        .board-dlg .bd-err { display: none; margin-top: 12px; padding: 8px 12px; border-radius: 10px; font-size: 12px; color: #ff9f0a; background: rgba(255, 159, 10, 0.1); border: 1px solid rgba(255, 159, 10, 0.25); }
        .board-dlg .bd-err.show { display: block; }
        /* 底部悬浮胶囊（放页面下方，避免遮挡白板顶部工具条） */
        /* 统一底部工具条：查看态放胶囊，编辑态放「保存 / 完成」 */
        .board-bottom {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            z-index: 33; display: flex; align-items: center; justify-content: center;
            transition: opacity 0.45s ease, transform 0.45s ease;
        }
        .board-topbar {
            /* 位置由统一的 .board-bottom 负责 */
            z-index: 30; display: flex; align-items: center; gap: 2px;
            padding: 5px 6px; border-radius: 20px; max-width: 94vw;
            overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
            background: linear-gradient(145deg, rgba(30, 30, 37, 0.85), rgba(20, 20, 26, 0.78));
            backdrop-filter: blur(26px) saturate(180%); -webkit-backdrop-filter: blur(26px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.13);
            box-shadow: 0 14px 44px -10px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: opacity 0.45s ease, transform 0.45s ease;
        }
        .board-stage.idle:not(.editing) .board-bottom { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(12px); }
        .board-stage.drawer-open .board-bottom { opacity: 0; pointer-events: none; }
        @media (hover: none) {
            .board-stage.idle:not(.editing) .board-bottom { opacity: 1; pointer-events: auto; transform: translateX(-50%); }
        }
        .board-topbar::-webkit-scrollbar { display: none; }
        .bt-btn {
            display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
            color: #d8dbe4; font-size: 12.5px; padding: 6px 12px; border-radius: 14px;
            background: transparent; border: none; cursor: pointer; white-space: nowrap;
            transition: background 0.2s ease, color 0.2s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: inherit;
        }
        .bt-btn svg { width: 14px; height: 14px; flex: none; }
        .bt-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .bt-btn:active { transform: scale(0.94); }
        @media (max-width: 768px) {
            /* 窄屏：Excalidraw 底部工具条占位，胶囊再上移一档 */
            .board-bottom { bottom: 74px; }
            .board-topbar { gap: 0; padding: 4px 5px; }
        }
        /* 信息浮层 */
        .board-pop {
            position: absolute; bottom: 72px; right: 16px; z-index: 32; width: 300px; max-width: calc(100vw - 32px);
            padding: 16px 18px; border-radius: 18px;
            background: linear-gradient(145deg, rgba(32, 32, 40, 0.92), rgba(20, 20, 26, 0.88));
            backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.13);
            box-shadow: 0 22px 60px -16px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            color: #cfd3df; font-size: 12.5px; line-height: 1.8;
            animation: board-pop-in 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .board-pop h4 { margin: 0 0 8px; font-size: 15px; color: #fff; }
        .board-pop .bp-row { display: flex; gap: 8px; }
        .board-pop .bp-row .k { color: rgba(255, 255, 255, 0.4); flex: none; width: 52px; }
        .board-pop .bp-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .board-pop .bp-tags span { padding: 2px 10px; border-radius: 999px; font-size: 11px; border: 1px solid rgba(255, 255, 255, 0.16); color: #bcd0ff; }
        .board-pop .bp-actions { display: flex; gap: 8px; margin-top: 12px; }
        @keyframes board-pop-in { from { opacity: 0; transform: translateY(-6px) scale(0.97); } to { opacity: 1; transform: none; } }
        /* 遮罩 + 评论抽屉 */
        .board-scrim { position: absolute; inset: 0; z-index: 34; background: rgba(5, 5, 8, 0.4); opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
        .board-scrim.show { opacity: 1; pointer-events: auto; }
        .board-drawer {
            position: absolute; top: 0; right: 0; bottom: 0; z-index: 36;
            width: min(430px, 94vw); transform: translateX(103%);
            display: flex; flex-direction: column;
            background: linear-gradient(145deg, rgba(26, 26, 33, 0.96), rgba(17, 17, 22, 0.94));
            backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-left: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: -24px 0 60px -20px rgba(0, 0, 0, 0.7);
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .board-drawer.open { transform: none; }
        .board-drawer-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 10px 12px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.09); flex: none;
        }
        .board-drawer-head .dh-title { color: #fff; font-weight: 600; font-size: 14px; }
        /* 抽屉头部：只留标题 */
        .board-drawer-head { gap: 12px; padding: 12px 12px 12px 20px; }
        .board-drawer-head .dh-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .board-drawer-body { flex: 1; overflow-y: auto; padding: 0 18px 30px; overscroll-behavior: contain; }
        /* 抽屉内留言区外观重置 */
        .board-drawer-body .dash-panel { background: transparent; border: none; box-shadow: none; margin: 0; padding: 10px 0 0; }
        .board-drawer-body .dash-panel-title { color: rgba(255, 255, 255, 0.55); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
        /* 画廊式上下篇箭头 */
        .board-navbtn {
            position: absolute; top: 50%; transform: translateY(-50%); z-index: 30;
            width: 46px; height: 46px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            color: #d8dbe4; border: 1px solid rgba(255, 255, 255, 0.14);
            background: linear-gradient(145deg, rgba(30, 30, 37, 0.8), rgba(18, 18, 24, 0.7));
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 10px 30px -8px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            opacity: 0.9; transition: opacity 0.4s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease;
        }
        .board-navbtn:hover { background: linear-gradient(145deg, rgba(48, 48, 58, 0.9), rgba(26, 26, 34, 0.8)); }
        .board-navbtn:active { transform: translateY(-50%) scale(0.92); }
        .board-navbtn.prev { left: 14px; }
        .board-navbtn.next { right: 14px; }
        .board-stage.idle .board-navbtn { opacity: 0; pointer-events: none; }
        @media (hover: none) { .board-stage.idle .board-navbtn { opacity: 0.9; pointer-events: auto; } }
        .board-navbtn svg { width: 18px; height: 18px; }
        .board-navbtn[hidden] { display: none; }
        .board-canvas-empty {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            color: rgba(255, 255, 255, 0.4); font-size: 14px;
        }

        .article-content .img-figure img {
            display: block;
            margin: 0 auto;
            border-radius: 0;
        }

        .article-content .img-caption {
            padding: 10px 16px;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            background: var(--bg-secondary);
        }

        .article-content table {
            /* 表格按内容自然宽度平铺（文字不折行），超出容器时拖拽查看，不显示滚动条 */
            display: block;
            width: max-content;
            min-width: 100%;
            max-width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            cursor: grab;
        }

        .article-content table::-webkit-scrollbar {
            display: none;
        }

        .article-content table.dragging,
        .article-content pre.dragging {
            cursor: grabbing;
            user-select: none;
        }

        .article-content th,
        .article-content td {
            padding: 12px;
            border: 1px solid var(--border);
            text-align: left;
            /* 文字优先平铺不折行；需要手动换行时可在单元格内用 <br> */
            white-space: nowrap;
        }

        .article-content th {
            background: var(--bg-tertiary);
            font-weight: 600;
        }

        .article-content hr {
            margin: 24px 0;
            border: none;
            border-top: 1px solid var(--border);
        }

        /* 图片灯箱 */
        .lightbox-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            cursor: zoom-out;
        }

        .lightbox-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .lightbox-overlay img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transition: transform 0.15s ease;
            user-select: none;
            -webkit-user-drag: none;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .lightbox-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* 文章导航 */
        .article-navigation {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 24px;
        }

        .nav-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .nav-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--shadow), 0 0 16px var(--glow);
        }

        .nav-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .nav-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .nav-card.prev {
            text-align: left;
        }

        .nav-card.next {
            text-align: right;
        }

        /* 加载状态 */
        .loading-article {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        /* 错误状态 */
        .error-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .error-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .error-state .message {
            font-size: 18px;
            margin-bottom: 24px;
        }

        .error-state .back-link {
            color: var(--accent);
            text-decoration: none;
        }

        .error-state .error-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .error-state .back-link.secondary {
            color: var(--text-secondary);
        }

        /* ===== 留言区 ===== */
        .comment-section {
            padding: 20px 24px 24px;
            margin-top: 24px;
        }

        .dash-panel {
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px var(--shadow);
        }

        .dash-panel-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            padding: 20px 24px 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 4px;
        }

        .comment-list {
            display: flex;
            flex-direction: column;
            margin-bottom: 24px;
        }

        /* 评论项（B 站评论区风格：头像居左，主体居右） */
        .comment-item {
            display: flex;
            gap: 12px;
            padding: 16px 0;
        }

        .comment-item + .comment-item {
            border-top: 1px solid var(--border);
        }

        .comment-item-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #fff));
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            flex-shrink: 0;
            box-shadow: 0 2px 6px color-mix(in srgb, var(--accent) 30%, transparent);
            margin-top: 2px;
        }

        .comment-item-main {
            flex: 1;
            min-width: 0;
        }

        .comment-item-user {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        .comment-item-name {
            font-size: 13px;
            color: color-mix(in srgb, var(--accent) 75%, var(--text-muted));
            font-weight: 500;
        }

        .comment-item-tag {
            font-size: 10px;
            color: var(--accent);
            border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
            border-radius: 4px;
            padding: 0 4px;
            line-height: 1.4;
        }

        .comment-item-content {
            color: var(--text-primary);
            line-height: 1.7;
            font-size: 14px;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .comment-item-content .mention {
            color: var(--accent);
            font-weight: 600;
        }

        .comment-item-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .comment-reply-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            transition: color 0.15s;
        }

        .comment-reply-btn:hover {
            color: var(--accent);
        }

        .comment-item-image {
            margin-top: 10px;
            max-width: 100%;
            max-height: 320px;
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: zoom-in;
        }

        .comment-empty {
            color: var(--text-muted);
            text-align: center;
            padding: 24px;
            font-size: 14px;
        }

        .comment-form-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .comment-form input,
        .comment-form textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .comment-form input:focus,
        .comment-form textarea:focus {
            border-color: var(--accent);
        }

        .comment-form textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* 文本框 + 右侧按钮列 */
        .comment-form-main {
            display: flex;
            align-items: stretch;
            gap: 12px;
            margin-bottom: 12px;
        }

        .comment-form-main textarea {
            flex: 1;
            min-width: 0;
            min-height: 100px;
            resize: vertical;
        }

        .comment-form-side {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
            justify-content: flex-end;
        }

        .comment-form-footer {
            display: flex;
            align-items: center;
        }

        .comment-tip {
            color: var(--text-muted);
            font-size: 12px;
        }

        /* 上传图片 + 发表留言（文本框右侧） */
        .comment-upload {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 16px;
            border: 1px dashed var(--border-light);
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .comment-upload:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .comment-form-side #comment-submit {
            padding: 9px 20px;
            border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
            border-radius: 8px;
            background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 15%, transparent), color-mix(in srgb, var(--accent) 5%, transparent));
            color: var(--accent);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            white-space: nowrap;
        }

        .comment-form-side #comment-submit:hover {
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--glow);
        }

        .comment-form-side #comment-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .comment-image-preview {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 10px;
        }

        .comment-image-preview img {
            max-height: 48px;
            max-width: 96px;
            border-radius: 6px;
            object-fit: cover;
        }

        .comment-image-preview button {
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            line-height: 1;
            padding: 2px;
        }

        .comment-image-preview button:hover {
            color: var(--accent);
        }

        @media (max-width: 480px) {
            .comment-section {
                padding: 16px;
            }

            .comment-form-row {
                flex-direction: column;
            }

            .comment-form-main {
                flex-direction: column;
            }

            .comment-form-side {
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
            }
        }

        /* ===== 响应式 ===== */

        /* 文章页隐藏全局浮动按钮 */
        .theme-toggle {
            display: none !important;
        }

        .chat-container .chat-toggle {
            display: none !important;
        }

        /* Extra large screens */
        @media (min-width: 1800px) {
            .article-main {
                max-width: 1400px;
            }

            .article-layout {
                padding-left: 320px;
                padding-right: 64px;
            }

            .toc-sidebar {
                width: 260px;
                left: 48px;
            }
        }

        /* Large screens */
        @media (min-width: 1415px) and (max-width: 1799px) {
            .article-main {
                max-width: 1200px;
            }

            .article-layout {
                padding-left: 296px;
                padding-right: 48px;
            }
        }

        /* Large tablets */
        @media (max-width: 1200px) {
            .article-layout {
                padding-left: 280px;
            }

            .toc-sidebar {
                width: 220px;
            }
        }

        /* Tablets */
        @media (max-width: 1024px) {
            .toc-sidebar {
                width: 200px;
                left: 12px;
            }

            .toc-sidebar .back-button {
                font-size: 12px;
                padding: 10px 12px;
            }

            .sidebar-action-btn {
                width: 36px;
                height: 36px;
            }

            .sidebar-go-back {
                height: 36px;
                padding: 0 12px;
                font-size: 12px;
            }

            .toc-sidebar-inner {
                height: auto;
                max-height: calc(100vh - 100px);
            }

            .article-main {
                width: 100%;
            }

            .article-layout {
                padding-left: 236px;
            }

            .article-header {
                padding: 24px;
            }

            .article-title {
                margin-left: -24px;
                margin-right: -24px;
            }

            .article-content {
                padding: 24px;
            }

            .article-title {
                font-size: 28px;
            }
        }

        /* Small tablets */
        @media (max-width: 773px) {
            .article-header {
                padding: 20px;
            }

            .article-title {
                font-size: 24px;
                margin-left: -20px;
                margin-right: -20px;
            }

            .article-content {
                padding: 16px;
            }

            .article-navigation {
                grid-template-columns: 1fr;
            }

            .toc-sidebar {
                position: fixed;
                left: -260px;
                top: 0;
                width: 240px;
                height: 100vh;
                z-index: 200;
                transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            }

            .toc-sidebar.show {
                left: 0;
            }

            .sidebar-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.5);
                z-index: 199;
                opacity: 0;
                transition: opacity 0.3s;
            }

            .sidebar-overlay.show {
                display: block;
                opacity: 1;
            }

            /* 移动端操作栏 */
            .mobile-top-bar {
                display: none;
            }

            /* 右侧悬浮球 */
            .mobile-float-ball {
                position: fixed;
                right: 16px;
                bottom: 100px;
                width: 48px;
                height: 48px;
                border-radius: 50%;
                background: var(--bg-secondary);
                border: 1px solid var(--border);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                z-index: 150;
                box-shadow: 0 4px 16px var(--shadow);
                transition: all 0.3s;
            }

            .mobile-float-ball:hover {
                border-color: var(--accent);
                box-shadow: 0 4px 20px var(--shadow), 0 0 12px var(--glow);
            }

            .mobile-float-ball.active {
                border-color: var(--accent);
                color: var(--accent);
            }

            .mobile-float-ball svg {
                color: var(--text-muted);
            }

            /* 右侧弹出菜单 */
            .mobile-menu-popup {
                position: fixed;
                right: -80px;
                bottom: 160px;
                display: none;
                flex-direction: column;
                gap: 8px;
                z-index: 150;
                transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            }

            .mobile-menu-popup.show {
                display: flex;
                right: 16px;
            }

            .mobile-menu-btn {
                width: 48px;
                height: 48px;
                border-radius: 50%;
                background: var(--bg-secondary);
                border: 1px solid var(--border);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                box-shadow: 0 4px 12px var(--shadow);
                transition: all 0.3s;
                text-decoration: none;
                color: var(--text-muted);
                transform: scale(0);
                opacity: 0;
            }

            .mobile-menu-popup.show .mobile-menu-btn {
                transform: scale(1);
                opacity: 1;
            }

            .mobile-menu-popup.show .mobile-menu-btn:nth-child(1) { transition-delay: 0s; }
            .mobile-menu-popup.show .mobile-menu-btn:nth-child(2) { transition-delay: 0.05s; }
            .mobile-menu-popup.show .mobile-menu-btn:nth-child(3) { transition-delay: 0.1s; }
            .mobile-menu-popup.show .mobile-menu-btn:nth-child(4) { transition-delay: 0.15s; }
            .mobile-menu-popup.show .mobile-menu-btn:nth-child(5) { transition-delay: 0.2s; }

            .mobile-menu-btn:hover {
                border-color: var(--accent);
                color: var(--accent);
            }

            .article-layout {
                padding-left: 16px;
                padding-right: 16px;
            }

            .article-meta {
                gap: 12px;
                font-size: 13px;
            }

            .article-tags {
                gap: 6px;
            }

            .article-tag {
                padding: 3px 10px;
                font-size: 11px;
            }

            .nav-card {
                padding: 16px;
            }

            .nav-label {
                font-size: 11px;
            }

            .nav-title {
                font-size: 13px;
            }
        }

        /* Mobile phones */
        @media (max-width: 480px) {
            .article-layout {
                padding-left: 12px;
                padding-right: 12px;
            }

            .article-header {
                padding: 16px;
                border-radius: 12px;
            }

            .article-title {
                font-size: 20px;
                margin-left: -16px;
                margin-right: -16px;
            }

            .article-content {
                padding: 12px;
                border-radius: 12px;
            }

            .article-content h1 {
                font-size: 22px;
            }

            .article-content h2 {
                font-size: 18px;
            }

            .article-content h3 {
                font-size: 16px;
            }

            .article-content pre {
                padding: 12px;
                font-size: 12px;
            }

            .article-content code {
                font-size: 12px;
            }

            .article-content blockquote {
                padding: 12px 16px;
            }

            .mobile-top-bar {
                gap: 6px;
                margin-bottom: 16px;
            }

            .mobile-top-bar .sidebar-go-back {
                height: 32px;
                padding: 0 10px;
                font-size: 11px;
            }

            .mobile-top-bar .sidebar-action-btn {
                width: 32px;
                height: 32px;
            }
        }
    </style>
    <link rel="stylesheet" href="/css/scrollbar.css?v=1.0.1">
</head>
<body>
    <!-- 图片灯箱 -->
    <div class="lightbox-overlay" id="lightboxOverlay" onclick="closeLightbox()">
        <button class="lightbox-close" onclick="closeLightbox()">×</button>
        <img id="lightboxImg" src="" alt="">
    </div>

    <!-- 移动端侧边栏遮罩 -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- 移动端悬浮球 -->
    <div class="mobile-float-ball" id="mobileFloatBall" onclick="toggleMobileMenu()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="1"></circle>
            <circle cx="12" cy="5" r="1"></circle>
            <circle cx="12" cy="19" r="1"></circle>
        </svg>
    </div>

    <!-- 移动端弹出菜单 -->
    <div class="mobile-menu-popup" id="mobileMenuPopup">
        <button class="mobile-menu-btn" onclick="showSidebar()" title="目录">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <button class="mobile-menu-btn" id="mobileGoBack" onclick="history.back()" title="返回上一页">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        <a href="index.html" class="mobile-menu-btn" title="返回首页">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </a>
        <button class="mobile-menu-btn" id="mobileThemeToggle" onclick="toggleTheme()" title="切换主题">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        </button>
        <button class="mobile-menu-btn" id="mobileChatToggle" onclick="toggleChat()" title="AI 助手">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
        </button>
    </div>

    <!-- 阅读进度条 -->
    <div class="article-progress" id="articleProgress"></div>

    <!-- 主内容 -->
    <div class="article-layout">
        <!-- 左侧目录栏 -->
        <aside class="toc-sidebar" id="tocSidebar" style="display: none;">
            <!-- 顶部操作栏 -->
            <div class="sidebar-top-bar">
                <button class="sidebar-action-btn sidebar-go-back" id="sidebarGoBack" title="返回上一页">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    <span>返回</span>
                </button>
                <div class="sidebar-actions">
                    <a href="index.html" class="sidebar-action-btn" title="返回首页">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                    </a>
                    <button class="sidebar-action-btn" id="sidebarThemeToggle" title="切换主题">
                        ◐
                    </button>
                    <button class="sidebar-action-btn" id="sidebarChatToggle" title="AI 助手">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="toc-sidebar-inner">
                <div class="toc-header">
                    <div class="toc-title">
                        <span>目录</span>
                        <div class="toc-search">
                            <input type="text" class="toc-search-input" id="tocSearchInput" placeholder="搜索标题...">
                            <svg class="toc-search-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                            </svg>
                        </div>
                        <button class="toc-collapse-btn" id="tocCollapseBtn" title="折叠子目录">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="toc-list-wrapper">
                    <ul class="toc-list" id="toc-list">
                        <!-- 由 JavaScript 动态生成 -->
                    </ul>
                </div>
            </div>
        </aside>

        <!-- 右侧主内容区 -->
        <div class="article-main">
            <!-- 移动端返回按钮（侧边栏隐藏时显示） -->
            <div class="mobile-top-bar">
                <button class="sidebar-action-btn sidebar-go-back" id="mobileGoBack" title="返回上一页">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    <span>返回</span>
                </button>
                <div class="sidebar-actions">
                    <a href="index.html" class="sidebar-action-btn" title="返回首页">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                    </a>
                    <button class="sidebar-action-btn" id="mobileThemeToggle" title="切换主题">
                        ◐
                    </button>
                    <button class="sidebar-action-btn" id="mobileChatToggle" title="AI 助手">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- 阅读工具栏 -->
            <div class="reader-toolbar" id="readerToolbar">
                <div class="reader-toolbar-group">
                    <button class="reader-btn" id="readerFontDown" title="减小字号">A−</button>
                    <span class="reader-font-size" id="readerFontSize">16</span>
                    <button class="reader-btn" id="readerFontUp" title="增大字号">A+</button>
                </div>
                <div class="reader-toolbar-sep"></div>
                <div class="reader-toolbar-group">
                    <button class="reader-btn" id="readerLineHeight" title="切换行距">行距</button>
                    <button class="reader-btn" id="readerFontFamily" title="切换字体">衬线</button>
                </div>
                <div class="reader-toolbar-sep"></div>
                <div class="reader-toolbar-group">
                    <button class="reader-btn" id="readerModeSepia" title="护眼模式">护眼</button>
                    <button class="reader-btn" id="readerModeDark" title="夜间模式">夜间</button>
                    <button class="reader-btn" id="readerFocus" title="专注阅读">专注</button>
                </div>
            </div>

            <!-- 文章头部 -->
            <div class="article-header" id="article-header">
                <div class="loading-article">
                    <div class="loading-spinner"></div>
                    <p>加载文章中...</p>
                </div>
            </div>

            <!-- 文章内容 -->
            <div class="article-content" id="article-content">
                <!-- 由 JavaScript 动态生成 -->
            </div>

            <!-- 留言区 -->
            <div class="dash-panel comment-section" id="comment-section" style="display:none;">
                <div class="dash-panel-title">留言</div>
                <div class="comment-list" id="comment-list">
                    <div class="comment-empty">加载留言中...</div>
                </div>
                <form class="comment-form" id="comment-form">
                    <div class="comment-form-row">
                        <input type="text" id="comment-name" placeholder="昵称 *" maxlength="32" required>
                    </div>
                    <div class="comment-form-main">
                        <textarea id="comment-content" placeholder="写下你的留言... *（支持纯文本，最长 5000 字）" maxlength="5000" required></textarea>
                        <div class="comment-form-side">
                            <label class="comment-upload" title="上传图片（jpg/png/gif/webp，≤2MB）">
                                <input type="file" id="comment-image" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                    <polyline points="21 15 16 10 5 21"></polyline>
                                </svg>
                                上传图片
                            </label>
                            <div class="comment-image-preview" id="comment-image-preview" style="display:none;">
                                <img id="comment-image-thumb" alt="已选图片">
                                <button type="button" id="comment-image-remove" title="移除图片">&times;</button>
                            </div>
                            <button type="submit" id="comment-submit">发表留言</button>
                        </div>
                    </div>
                    <div class="comment-form-footer">
                        <span class="comment-tip" id="comment-tip"></span>
                    </div>
                </form>
            </div>

            <!-- 文章导航 -->
            <div class="article-navigation" id="article-navigation">
                <!-- 由 JavaScript 动态生成 -->
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/theme.js?v=3.13.6"></script>
    <script src="js/markdown.js?v=3.14.2" defer></script>
    <script src="js/chat.js?v=3.16.1" defer></script>
    <script src="js/reader.js?v=3.13.6" defer></script>
    <script src="js/animations.js?v=3.14.0" defer></script>

    <script src="js/article-app.js?v=1.1.0" defer></script>
