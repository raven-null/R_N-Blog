<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预览 · 管理后台</title>
<link rel="icon" id="siteFavicon" href="/images/Default/web-logo.webp" type="image/webp">
<link rel="stylesheet" href="/css/highlight-github-dark.min.css">
<!--
  本地预览页（写作页「预览」按钮打开）
  ---------------------------------------------------------------
  以前「预览」是先 POST 保存、再打开前台文章页 —— 点一次预览就改一次线上内容，
  已发布的文章会把半成品直接推上线。
  现在这条链路完全不碰数据库：写作页把当前编辑器内容 postMessage 过来，这里渲染。
  画布（白板 / 导图）不加载 iframe，用占位卡片说明「正式页面会显示可交互画布」。
-->
<style>
    :root{
        --bg:#0d0e14;--card:#15161e;--border:rgba(255,255,255,.1);
        --text:#e8e9f2;--text-muted:#8c8fa8;--text-secondary:#b8b9c9;--accent:#73aaff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
        background:var(--bg);color:var(--text);min-height:100vh;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
        -webkit-font-smoothing:antialiased;
    }
    /* 顶部条：明确「这是预览，未保存未发布」 */
    .pv-bar{
        position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
        gap:12px;flex-wrap:wrap;padding:9px 20px;
        background:rgba(21,22,30,.94);backdrop-filter:blur(18px) saturate(160%);
        border-bottom:1px solid var(--border);
    }
    .pv-bar-left{display:flex;align-items:center;gap:10px;min-width:0}
    .pv-badge{
        flex:none;padding:4px 11px;border-radius:99px;font-size:12px;
        background:rgba(255,176,32,.16);border:1px solid rgba(255,176,32,.34);color:#ffe0ac;
    }
    .pv-dim{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pv-bar-actions{display:flex;gap:8px;flex:none}
    .pv-btn{
        padding:6px 13px;border-radius:99px;font-size:12.5px;font-family:inherit;cursor:pointer;
        background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--text-secondary);
        transition:all .18s ease;
    }
    .pv-btn:hover{background:rgba(255,255,255,.16);color:#fff}

    .pv-doc{width:min(760px,92vw);margin:0 auto;padding:34px 0 90px}
    .pv-title{font-size:30px;line-height:1.35;margin:0 0 14px;font-weight:700}
    .pv-meta{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:12.5px;color:var(--text-muted);margin-bottom:18px}
    .pv-tag{padding:2px 9px;border-radius:99px;background:rgba(115,170,255,.12);border:1px solid rgba(115,170,255,.3);color:#cfe2ff}
    .pv-cover img{width:100%;border-radius:14px;display:block;margin-bottom:20px;border:1px solid var(--border)}
    .pv-excerpt{
        font-size:14px;line-height:1.85;color:var(--text-secondary);
        border-left:3px solid rgba(115,170,255,.55);padding:2px 0 2px 14px;margin-bottom:26px;
    }
    .pv-body{font-size:16px;line-height:1.92;color:var(--text)}
    .pv-body h1,.pv-body h2,.pv-body h3,.pv-body h4{line-height:1.4;margin:1.6em 0 .7em;font-weight:700}
    .pv-body h1{font-size:26px}.pv-body h2{font-size:22px}.pv-body h3{font-size:18px}.pv-body h4{font-size:16px}
    .pv-body h2{padding-bottom:.35em;border-bottom:1px solid var(--border)}
    .pv-body p{margin:0 0 1.1em}
    .pv-body a{color:var(--accent)}
    .pv-body img{max-width:100%;border-radius:10px;display:block;margin:1.2em auto}
    .pv-body ul,.pv-body ol{margin:0 0 1.1em;padding-left:1.5em}
    .pv-body li{margin:.35em 0}
    .pv-body blockquote{
        margin:1.2em 0;padding:.4em 1em;color:var(--text-secondary);
        border-left:3px solid rgba(115,170,255,.5);background:rgba(115,170,255,.06);border-radius:0 8px 8px 0;
    }
    .pv-body code{
        font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;
        background:rgba(255,255,255,.08);padding:.15em .4em;border-radius:5px;
    }
    .pv-body pre{background:#0a0a0d;border:1px solid var(--border);border-radius:10px;padding:14px 16px;overflow:auto}
    .pv-body pre code{background:none;padding:0;font-size:13px;line-height:1.7}
    .pv-body table{width:100%;border-collapse:collapse;margin:1.2em 0;font-size:14px}
    .pv-body th,.pv-body td{border:1px solid rgba(255,255,255,.16);padding:8px 11px;text-align:left}
    .pv-body th{background:rgba(255,255,255,.06)}
    .pv-body hr{border:0;border-top:1px solid var(--border);margin:2em 0}
    .pv-body .img-figure,.pv-body .embed-figure{margin:1.2em 0}
    .pv-body .img-caption,.pv-body .embed-caption{font-size:12.5px;color:var(--text-muted);text-align:center;margin-top:.5em}
    .pv-body .code-block{margin:1.2em 0}
    .pv-body .code-header{
        display:flex;align-items:center;justify-content:space-between;
        padding:6px 12px;font-size:12px;color:var(--text-muted);
        background:rgba(255,255,255,.05);border:1px solid var(--border);border-bottom:0;border-radius:10px 10px 0 0;
    }
    .pv-body .code-block pre{margin:0;border-radius:0 0 10px 10px}
    .pv-body .copy-btn{
        display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;cursor:pointer;
        font-size:11.5px;font-family:inherit;color:var(--text-muted);
        background:transparent;border:1px solid var(--border);
    }
    .pv-body .copy-btn:hover{color:#fff;background:rgba(255,255,255,.1)}
    /* 画布占位：预览页不挂 iframe */
    .pv-canvas{
        display:flex;flex-wrap:wrap;align-items:center;gap:10px;
        margin:1.4em 0;padding:18px 20px;border-radius:12px;
        background:linear-gradient(135deg,rgba(115,170,255,.1),rgba(115,170,255,.04));
        border:1px dashed rgba(115,170,255,.45);
    }
    .pv-canvas-k{font-size:13px;font-weight:600;color:#cfe2ff}
    .pv-canvas-id{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--text-muted)}
    .pv-canvas-tip{flex-basis:100%;font-size:12.5px;color:var(--text-muted);line-height:1.7}
    /* 相关画布（文末） */
    .pv-related{margin-top:34px;padding-top:20px;border-top:1px solid var(--border)}
    .pv-related-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:14.5px;font-weight:600}
    .pv-related-count{padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:500;color:#cfe2ff;background:rgba(115,170,255,.16);border:1px solid rgba(115,170,255,.32)}
    .pv-related-list{display:flex;flex-direction:column;gap:9px}
    .pv-related-row{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:11px;font-size:13px;background:rgba(255,255,255,.04);border:1px solid var(--border)}
    .pv-related-k{flex:none;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600;color:#cfe2ff;background:rgba(115,170,255,.18);border:1px solid rgba(115,170,255,.34)}
    .pv-related-row.map .pv-related-k{color:#f0d7ff;background:rgba(180,120,255,.18);border-color:rgba(180,120,255,.36)}
    .pv-related-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-secondary)}
    .pv-related-note{flex:none;font-size:11.5px;color:var(--text-muted)}
    /* 未收到数据 / 已断开 */
    .pv-empty{
        width:min(560px,90vw);margin:14vh auto;padding:26px 28px;border-radius:16px;
        background:var(--card);border:1px solid var(--border);text-align:center;
        color:var(--text-secondary);font-size:13.5px;line-height:1.9;
    }
    .pv-empty b{color:var(--text)}
    @media(max-width:640px){
        .pv-doc{width:94vw;padding:22px 0 70px}
        .pv-title{font-size:23px}
        .pv-body{font-size:15px}
    }
</style>
</head>
<body>
    <div class="pv-bar">
        <div class="pv-bar-left">
            <span class="pv-badge">预览 · 未保存未发布</span>
            <span class="pv-dim" id="pvDim">等待写作页发送内容…</span>
        </div>
        <div class="pv-bar-actions">
            <button class="pv-btn" id="pvRefresh" title="重新向写作页要一次内容">重新载入</button>
            <button class="pv-btn" id="pvClose">关闭</button>
        </div>
    </div>

    <article class="pv-doc" id="pvDoc" style="display:none">
        <h1 class="pv-title" id="pvTitle"></h1>
        <div class="pv-meta" id="pvMeta"></div>
        <div class="pv-cover" id="pvCover"></div>
        <div class="pv-excerpt" id="pvExcerpt" style="display:none"></div>
        <div class="pv-body" id="pvBody"></div>
        <!-- 相关画布：关联的白板 / 导图。预览页不加载画布本体，只列出来 -->
        <div class="pv-related" id="pvRelated" style="display:none"></div>
    </article>

    <div class="pv-empty" id="pvEmpty">
        <b>还没收到内容</b><br>
        请在写作页（admin-edit.html）点侧栏的「预览」按钮。<br>
        这个页面只负责本地渲染，不会保存也不会发布。
    </div>

    <script src="/js/vendor/marked.min.js"></script>
    <script src="/js/vendor/highlight.min.js"></script>
    <script src="/js/markdown-config.js?v=1.3.0"></script>
    <script src="/js/preview-render.js?v=1.1.0"></script>
</body>
</html>
