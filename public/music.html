<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>音乐 · 渡鸦 NULL</title>
  <meta name="description" content="渡鸦NULL 的音乐角：嵌入 Folia 播放器，全屏沉浸式歌词。" />
  <link rel="icon" id="siteFavicon" href="/images/Default/web-logo.webp" type="image/webp">
  <link rel="apple-touch-icon" href="/images/Default/web-logo.webp">
  <!-- Folia 首屏是个不小的 SPA：提前建连，省掉 DNS/TLS 往返 -->
  <link rel="preconnect" href="https://music.ravennull.work" crossorigin>
  <link rel="dns-prefetch" href="https://music.ravennull.work">
  <script src="/js/site-icon.js?v=1.0.0" defer></script>
  <link rel="stylesheet" href="/css/scrollbar.css?v=1.0.1">
  <link rel="stylesheet" href="/css/tokens.css?v=1.6.0">
  <style>
    /* 液态玻璃体系（与博客 glass.css / excalidraw.html 同款变量） */
    :root {
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --glass-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.035));
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-hi: rgba(255, 255, 255, 0.08);
      --glass-blur: blur(24px) saturate(180%);
      --music-bg: #0b0b0e;
      /* 顶栏高度：JS 会按真实高度写回，兜底值给首帧用 */
      --header-h: 52px;
    }

    html, body { margin: 0; padding: 0; height: 100%; background: var(--music-bg); color: #e8e8ea; overflow: hidden; }
    * { box-sizing: border-box; }

    /* 全屏应用布局：顶栏固定，播放器占满剩余空间，页面本身不滚动 */
    body {
      display: flex; flex-direction: column;
      height: 100dvh; /* iOS 地址栏自适应；老引擎由 JS 写 --app-h 兜底 */
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", sans-serif;
    }
    body.use-app-h { height: var(--app-h, 100dvh); }

    /* 环境光斑背景：Folia 加载前不至于是一块死黑 */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 55% 45% at 12% 18%, rgba(90, 120, 255, 0.14), transparent 65%),
        radial-gradient(ellipse 50% 40% at 88% 12%, rgba(190, 90, 255, 0.10), transparent 65%),
        radial-gradient(ellipse 60% 50% at 78% 82%, rgba(0, 210, 190, 0.07), transparent 65%);
    }

    /* ---------- 顶栏 ---------- */
    .site-header {
      position: relative; z-index: 3; flex: none;
      display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap;
      padding: 9px 16px;
      padding-top: calc(9px + env(safe-area-inset-top, 0px));
      background: rgba(16, 16, 19, 0.62);
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      font-size: 14px;
    }
    .nav-pill {
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
      color: #e8e8ea; padding: 5px 13px; border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: inset 0 1px 0 var(--glass-hi);
      transition: transform 0.25s var(--spring), background 0.2s ease, border-color 0.2s ease;
      white-space: nowrap; font-size: 13px; line-height: 1.2;
    }
    .nav-pill:hover { background: linear-gradient(145deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.07)); border-color: rgba(255, 255, 255, 0.26); }
    .nav-pill:active { transform: scale(0.95); }
    .nav-pill svg { width: 14px; height: 14px; flex: none; }
    .site-header .title {
      color: #fff; font-weight: 600; font-size: 14px; min-width: 0; flex: 1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      padding-inline: 4px;
    }
    .site-header .actions { display: flex; gap: 8px; flex: none; }
    button.nav-pill { font-family: inherit; cursor: pointer; }

    /* ---------- 播放器舞台 ---------- */
    #stage {
      position: relative; z-index: 2; flex: 1 1 auto; min-height: 0;
      background: transparent;
    }
    #folia {
      display: block; width: 100%; height: 100%; border: 0;
      background: var(--music-bg);
    }

    /* 加载中遮罩：Folia 首屏较大，先给个呼吸感，避免纯白/纯黑闪屏 */
    #booting {
      position: absolute; inset: 0; z-index: 2;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: radial-gradient(ellipse 60% 50% at 50% 40%, rgba(30, 30, 40, 0.55), rgba(11, 11, 14, 0.92));
      color: rgba(255, 255, 255, 0.66); font-size: 13px; letter-spacing: 0.04em;
      transition: opacity 0.45s ease;
    }
    #booting.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 26px; height: 26px; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.16);
      border-top-color: rgba(255, 255, 255, 0.72);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }

    /* 兜底提示条：Folia 长时间没加载出来时，给一条不挡路的提示 */
    #notice {
      position: absolute; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      z-index: 4; display: none; align-items: center; gap: 10px; flex-wrap: wrap;
      max-width: min(92vw, 520px);
      padding: 10px 14px; border-radius: 14px;
      background: rgba(24, 24, 30, 0.92);
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.75);
      color: rgba(255, 255, 255, 0.78); font-size: 13px; line-height: 1.5;
    }
    #notice.show { display: flex; }
    #notice .notice-text { flex: 1 1 200px; }
    #notice a, #notice button {
      font-family: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap;
      color: #0b0b10; background: linear-gradient(180deg, #fff, #d9d9e3);
      border: 1px solid rgba(255, 255, 255, 0.55); border-radius: 999px;
      padding: 5px 12px; text-decoration: none;
    }
    #notice button { transition: transform 0.2s var(--spring); }
    #notice button:active { transform: scale(0.95); }

    /* ---------- 小屏降级面板 ---------- */
    /* 手机上把全屏沉浸式播放器塞进 iframe，体验远不如直接打开；默认给一张卡片 */
    #degrade {
      position: absolute; inset: 0; z-index: 5;
      display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      padding: 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      text-align: center;
      background: radial-gradient(ellipse 70% 55% at 50% 35%, rgba(30, 30, 44, 0.55), rgba(11, 11, 14, 0.96));
    }
    body.is-degraded #degrade { display: flex; }
    body.is-degraded #stage { overflow: hidden; }
    body.is-degraded #folia, body.is-degraded #booting { display: none; }
    #degrade h1 { margin: 0; font-size: 19px; font-weight: 600; color: #fff; letter-spacing: 0.02em; }
    #degrade p { margin: 0; max-width: 30em; color: rgba(255, 255, 255, 0.58); font-size: 13px; line-height: 1.7; }
    .degrade-actions { display: flex; flex-direction: column; gap: 10px; width: min(320px, 82vw); }
    .big-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 18px; border-radius: 14px; text-decoration: none;
      font-size: 14.5px; font-weight: 600; font-family: inherit; cursor: pointer;
      transition: transform 0.25s var(--spring), filter 0.2s ease;
    }
    .big-btn:active { transform: scale(0.97); }
    .big-btn.primary { color: #0b0b10; background: linear-gradient(180deg, #fff, #d5d5e0); border: 1px solid rgba(255, 255, 255, 0.6); }
    .big-btn.ghost { color: #e8e8ea; background: var(--glass-bg); border: 1px solid var(--glass-border); font-weight: 500; }
    .big-btn svg { width: 16px; height: 16px; flex: none; }

    /* 嵌入态（被别处 iframe 引用时）不重复顶栏 */
    body.embedded .site-header { display: none; }
  </style>
</head>
<body>
  <!--
    音乐页：把 Folia（https://music.ravennull.work/）嵌进博客。
    用法：
      /music                      默认全屏嵌入（桌面）
      /music?mode=inline          移动端也强制在此页嵌入（覆盖降级）
      /music?to=/library          透传给 Folia 的路径（Folia 自己处理路由）
    注意：iframe 绝对不能加 sandbox —— Folia 用 localStorage 存登录态与播放设置，
          sandbox 会让它初始化即报错。
  -->
  <header class="site-header">
    <a class="nav-pill" href="/" title="返回博客">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path>
      </svg>
      博客
    </a>
    <span class="title">音乐</span>
    <div class="actions">
      <button class="nav-pill" id="btnFull" type="button" title="全屏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M21 8V5a2 2 0 0 0-2-2h-3"></path>
          <path d="M3 16v3a2 2 0 0 0 2 2h3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
        </svg>
        全屏
      </button>
      <a class="nav-pill" id="btnOpen" href="https://music.ravennull.work/" target="_blank" rel="noopener noreferrer" title="在新窗口打开 Folia">
        新窗口
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 17 17 7"></path><path d="M8 7h9v9"></path>
        </svg>
      </a>
    </div>
  </header>

  <main id="stage">
    <div id="booting"><div class="spinner" aria-hidden="true"></div><span>正在唤醒播放器…</span></div>
    <!-- src 必须先占位：空 src 的 iframe 会把本页当成地址，导致无限递归加载 -->
    <iframe id="folia" src="about:blank" title="Folia 音乐播放器"
            allow="autoplay; fullscreen; encrypted-media; clipboard-write; picture-in-picture"
            referrerpolicy="strict-origin-when-cross-origin"></iframe>

    <!-- 小屏降级：默认不加载 iframe，省流量也省心 -->
    <div id="degrade">
      <h1>音乐播放器</h1>
      <p>全屏歌词播放器在手机上更适合单独打开，独立窗口不会挤、也不会被地址栏打断。</p>
      <div class="degrade-actions">
        <a class="big-btn primary" id="btnMobileOpen" href="https://music.ravennull.work/" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle>
          </svg>
          打开播放器
        </a>
        <button class="big-btn ghost" id="btnInline" type="button">还是在这个页面里听</button>
      </div>
    </div>

    <div id="notice" role="status">
      <span class="notice-text">播放器好像没加载出来。</span>
      <button type="button" id="btnRetry">重试</button>
      <a href="https://music.ravennull.work/" target="_blank" rel="noopener noreferrer">新窗口打开</a>
    </div>
  </main>

  <script>
    (function () {
      'use strict';

      var FOLIA_ORIGIN = 'https://music.ravennull.work';
      var MOBILE_MAX = 768;          // 与博客移动端断点对齐（renewal.css 里 760，这里放宽一点）
      var FORCE_INLINE_KEY = 'music-inline-mobile';
      // Folia 首屏实测要十几秒（大 SPA + 无缓存冷启动），所以：
      // BOOT_MAX_COVER 之后自家遮罩主动让位，让 Folia 自己的启动动画露出来，别把用户挡在外面；
      // 只有连探活都失败时才等到 BOOT_TIMEOUT 再喊"加载不出来"。
      var BOOT_TIMEOUT = 20000;
      var BOOT_MAX_COVER = 6000;

      var frame = document.getElementById('folia');
      var booting = document.getElementById('booting');
      var notice = document.getElementById('notice');
      var stage = document.getElementById('stage');
      var header = document.querySelector('.site-header');

      var params = new URLSearchParams(location.search);
      var mode = params.get('mode') || '';
      var loaded = false;
      var bootTimer = 0;
      var coverTimer = 0;

      // ---------- 真实视口高度兜底（老引擎 100dvh 不准） ----------
      function syncHeight() {
        var vv = window.visualViewport;
        var h = (vv && vv.height) || window.innerHeight || 0;
        if (h > 0) {
          document.documentElement.style.setProperty('--app-h', Math.round(h) + 'px');
          document.body.classList.add('use-app-h');
        }
      }
      syncHeight();
      window.addEventListener('resize', syncHeight, { passive: true });
      window.addEventListener('orientationchange', function () { setTimeout(syncHeight, 120); });
      if (window.visualViewport) window.visualViewport.addEventListener('resize', syncHeight, { passive: true });

      // ---------- 嵌入态识别：被别处 iframe 引用时去掉自家顶栏 ----------
      try { if (window.parent !== window) document.body.classList.add('embedded'); } catch (e) { /* 忽略 */ }

      // ---------- 拼 Folia 地址（支持 ?to= 透传子路径） ----------
      function foliaUrl() {
        var to = params.get('to') || '';
        // 只接受站内绝对路径，避免被拼成外链
        if (!/^\/[A-Za-z0-9\-._~!$&'()*+,;=:@%/?#]*$/.test(to)) return FOLIA_ORIGIN + '/';
        return FOLIA_ORIGIN + to;
      }

      function showNotice() {
        notice.classList.add('show');
      }
      function hideNotice() {
        notice.classList.remove('show');
      }

      // 遮罩淡出：让位给 Folia 自己的启动画面，别把用户挡在自己这层外面
      function elideBooting() {
        clearTimeout(coverTimer);
        booting.classList.add('hidden');
      }

      // 轻量探活：no-cors 只要网络可达就 resolve（opaque 响应），
      // 用来区分"只是慢"和"根本连不上"，避免对着慢加载喊"加载失败"。
      function probe() {
        try {
          // 探首页：静态资源上 Cloudflare 有时会直接断连接（ERR_ABORTED），首页反而更稳
          fetch(FOLIA_ORIGIN + '/?probe=' + Date.now(), { mode: 'no-cors', cache: 'no-store' })
            .then(function () {
              clearTimeout(bootTimer);              // 网络通，就别再误报加载失败
              setTimeout(elideBooting, 800);        // 留一点渲染时间再让位
            })
            .catch(function () { /* 探活失败不处理：load 事件和超时会兜住 */ });
        } catch (e) { /* 老引擎没有 fetch，忽略 */ }
      }

      // ---------- 真正把播放器挂上去（只做一次） ----------
      function mountFrame() {
        if (loaded) return;
        loaded = true;
        hideNotice();
        booting.classList.remove('hidden');
        frame.src = foliaUrl();
        coverTimer = setTimeout(elideBooting, BOOT_MAX_COVER);
        clearTimeout(bootTimer);
        bootTimer = setTimeout(showNotice, BOOT_TIMEOUT);
        probe();
      }

      // 跨域 iframe 的 onload 只能证明"文档到货了"，内容对不对它不会报错；
      // 所以 onload 只负责收起遮罩，真正的失败兜底交给上面的超时。
      // 注意：about:blank 占位页也会触发 load，必须排除，否则遮罩会提前消失。
      frame.addEventListener('load', function () {
        if (!loaded) return;
        if (String(frame.src).indexOf(FOLIA_ORIGIN) !== 0) return;
        clearTimeout(bootTimer);
        elideBooting();
        hideNotice();
      });

      // ---------- 小屏降级 ----------
      function wantsInline() {
        if (mode === 'inline') return true;                  // 显式要求
        if (params.get('mode') === 'external') return false; // 显式要求降级
        try { if (localStorage.getItem(FORCE_INLINE_KEY) === '1') return true; } catch (e) { /* 隐私模式 */ }
        return window.innerWidth > MOBILE_MAX;
      }

      function syncLayout() {
        var inline = wantsInline();
        document.body.classList.toggle('is-degraded', !inline);
        if (inline) mountFrame();
      }

      document.getElementById('btnInline').addEventListener('click', function () {
        try { localStorage.setItem(FORCE_INLINE_KEY, '1'); } catch (e) { /* 忽略 */ }
        syncLayout();
      });

      document.getElementById('btnRetry').addEventListener('click', function () {
        hideNotice();
        booting.classList.remove('hidden');
        // 加时间戳绕过中间缓存，也保证 iframe 一定会重新导航
        var url = foliaUrl();
        frame.src = url + (url.indexOf('?') > -1 ? '&' : '?') + '_t=' + Date.now();
        clearTimeout(coverTimer);
        coverTimer = setTimeout(elideBooting, BOOT_MAX_COVER);
        clearTimeout(bootTimer);
        bootTimer = setTimeout(showNotice, BOOT_TIMEOUT);
        probe();
      });

      // ---------- 全屏（跨域 iframe 需要 allow="fullscreen"） ----------
      document.getElementById('btnFull').addEventListener('click', function () {
        var el = stage || document.documentElement;
        try {
          if (document.fullscreenElement) {
            document.exitFullscreen();
          } else if (el.requestFullscreen) {
            el.requestFullscreen().catch(function () { /* 用户拒绝或平台不允许，静默 */ });
          } else if (window.webkitRequestFullscreen) {
            window.webkitRequestFullscreen();
          }
        } catch (e) { /* 忽略 */ }
      });

      // ---------- 尺寸/断点变化 ----------
      var resizeTimer = 0;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          if (header) document.documentElement.style.setProperty('--header-h', header.offsetHeight + 'px');
          // 已强制内嵌的用户不因缩小窗口被踢回降级面板
          var forced = false;
          try { forced = localStorage.getItem(FORCE_INLINE_KEY) === '1'; } catch (e) { /* 忽略 */ }
          if (forced || mode === 'inline') return;
          syncLayout();
        }, 150);
      }, { passive: true });

      // ---------- 启动 ----------
      if (header) document.documentElement.style.setProperty('--header-h', header.offsetHeight + 'px');
      syncLayout();
    })();
  </script>
</body>
</html>
