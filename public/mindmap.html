<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>思维导图</title>
  <link rel="icon" id="siteFavicon" href="/images/Default/web-logo.webp" type="image/webp">
  <link rel="apple-touch-icon" href="/images/Default/web-logo.webp">
  <script src="/js/site-icon.js?v=1.0.0" defer></script>
  <link rel="stylesheet" href="/css/scrollbar.css?v=1.0.1">
  <link rel="stylesheet" href="/css/responsive.css?v=1.0.0">
  <link rel="stylesheet" href="/css/capsule.css?v=1.0.0">
  <link rel="stylesheet" href="/css/drawer.css?v=1.0.0">
  <style>
    :root {
      --mm-bg: #0b0b0e;
      --mm-panel: rgba(16, 16, 19, 0.72);
      --mm-border: rgba(255, 255, 255, 0.12);
      --mm-text: #e8e8ea;
      --mm-dim: rgba(255, 255, 255, 0.55);
      --mm-accent: #ff9f0a;
    }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--mm-bg); color: var(--mm-text); overflow: hidden; }
    * { box-sizing: border-box; }
    body { display: block; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", sans-serif; }
    #mm-root { position: absolute; inset: 0; } /* 绝对定位铺满视口，容器尺寸不依赖 flex 计算 */
    /* ---------- 导图专属样式 ---------- */
    /* 只读态 */
    /* 左侧按钮组：竖直排列、竖直居中、图标等距。库默认 span 是 block，必须自己开 flex */
    #mm-root .mind-elixir-toolbar.lt {
      display: flex !important; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px;
      top: 50%; transform: translateY(-50%);
      left: 16px;
      padding: 12px 10px; border-radius: 16px;
      background: linear-gradient(145deg, rgba(30, 30, 37, 0.85), rgba(20, 20, 26, 0.78));
      backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    /* 左侧工具条：竖直排列、竖直居中、图标等距 */
    #mm-root .mind-elixir-toolbar.lt {
      display: flex !important; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px;
      top: 50%; transform: translateY(-50%);
      left: 16px;
      padding: 12px 10px; border-radius: 16px;
      background: linear-gradient(145deg, rgba(30, 30, 37, 0.85), rgba(20, 20, 26, 0.78));
      backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    /* 库自带的 span+span { margin-top: 10px } 会和 gap 叠加，统一改成 gap 控制间距 */
    #mm-root .mind-elixir-toolbar.lt > span + span { margin-top: 0; }
    /* 每个按钮统一热区并让图标居中；间距由 gap 统一负责 */
    #mm-root .mind-elixir-toolbar.lt > span {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; margin: 0; cursor: pointer;
      color: rgba(255, 255, 255, 0.72);
      border-radius: 10px;
      transition: background 0.2s ease, color 0.2s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #mm-root .mind-elixir-toolbar.lt > span svg {
      width: 18px !important; height: 18px !important; display: block; max-width: 100%; max-height: 100%;
    }
    /* 大纲按钮（我们加的）也用同样的热区与居中 */
    #mm-root .mind-elixir-toolbar.lt > span.mm-outline-btn { display: inline-flex !important; }
    #mm-root .mind-elixir-toolbar.lt > span.mm-outline-btn svg { width: 18px !important; height: 18px !important; }
    #mm-root .mind-elixir-toolbar.lt > span:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
    #mm-root .mind-elixir-toolbar.lt > span:active { transform: scale(0.92); }
    #mm-root .mind-elixir-toolbar.lt > span.active,
    #mm-root .mind-elixir-toolbar.lt > span.mm-outline-btn.active { background: rgba(255, 159, 10, 0.18); color: var(--mm-accent); }
    /* 行式大纲（幕布手感）：每行 = 折叠三角 + 文字 + 行内缩略图 */
    .mm-outline-tree {
      flex: 1; min-height: 0; overflow-y: auto; padding: 8px 10px 14px;
      scrollbar-width: thin;
    }
    .mm-oline {
      display: flex; align-items: center;
      min-height: 28px; padding: 1px 6px; border-radius: 8px;
      font-size: 13.5px; line-height: 1.6; color: var(--mm-text);
      transition: background 0.15s ease;
    }
    .mm-oline:hover { background: rgba(255, 255, 255, 0.04); }
    .mm-oline.lv0 {
      font-size: 15px; font-weight: 600; color: #fff;
      margin-bottom: 4px; padding-bottom: 5px; border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
    }
    .mm-oline .mm-tri {
      flex: none; width: 22px; height: 22px; margin-right: 6px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; border: 0; cursor: pointer; font-size: 13px; line-height: 1;
      color: var(--mm-accent); opacity: 0.85; border-radius: 6px;
      transition: background 0.15s ease, opacity 0.15s ease;
    }
    .mm-oline .mm-tri:hover { opacity: 1; background: rgba(255, 255, 255, 0.08); }
    .mm-oline .mm-tri:active { transform: scale(0.94); }
    .mm-oline .mm-tri.empty { cursor: default; opacity: 0; }
    /* 行首拖拽手柄：小圆点，只在编辑模式可拖 */
    .mm-oline .mm-oline-drag {
      flex: none; width: 14px; height: 18px; margin-right: 4px;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: grab;
    }
    .mm-oline .mm-oline-drag::before {
      content: ""; width: 5px; height: 5px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.38);
      transition: background 0.15s ease;
    }
    /* 只用灰色深浅表达可拖：不变橙、不放大 */
    .mm-oline:hover .mm-oline-drag::before { background: rgba(255, 255, 255, 0.72); }
    .mm-oline .mm-oline-drag:active { cursor: grabbing; }
    .mm-oline .mm-oline-drag.off { cursor: default; }
    .mm-oline .mm-oline-drag.off::before { background: rgba(255, 255, 255, 0.18); }
    .mm-oline:hover .mm-oline-drag.off::before { background: rgba(255, 255, 255, 0.18); }
    .mm-oline .mm-oline-topic { flex: 1 1 auto; outline: none; word-break: break-word; min-width: 1em; white-space: pre-wrap; }
    /* 多选高亮 */
    .mm-oline.selected-row { background: rgba(255, 159, 10, 0.16); box-shadow: inset 0 0 0 1px rgba(255, 159, 10, 0.45); }
    /* 拖拽落点提示 */
    .mm-oline.dragging { opacity: 0.45; }
    .mm-oline.drop-before { box-shadow: inset 0 2px 0 var(--mm-accent); }
    .mm-oline.drop-after { box-shadow: inset 0 -2px 0 var(--mm-accent); }
    .mm-oline.drop-in { background: rgba(255, 159, 10, 0.14); }
    .mm-oline .mm-oline-topic:focus { background: rgba(255, 255, 255, 0.06); border-radius: 4px; }
    .mm-oline .mm-oline-img {
      flex: none; width: 104px; height: 72px; object-fit: cover; margin-left: 10px;
      border-radius: 8px; border: 1px solid var(--mm-border); cursor: zoom-in;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .mm-oline .mm-oline-img:hover { border-color: var(--mm-accent); transform: translateY(-1px); }
    @media (max-width: 720px) {
      .mm-oline .mm-oline-img { width: 76px; height: 52px; }
    }

    /* 只读时大纲可看不可改：视觉上和「正在编辑」区分开 */
    #mm-root.mm-readonly .mm-outline-text { color: rgba(255, 255, 255, 0.72); cursor: default; }
    #mm-root.mm-readonly me-tpc > .text { -webkit-user-select: none; -ms-user-select: none; user-select: none; }
    #mm-root.mm-readonly me-epd { display: none !important; }
    html[data-embedded="1"] .mm-capsule { bottom: 14px; }
    /* 窄屏：工具条再紧凑一点，避免压住内容 */
    @media (max-width: 720px) {
      #mm-root .mind-elixir-toolbar.lt { left: 10px; gap: 8px; padding: 9px 8px; }
      #mm-root .mind-elixir-toolbar.lt > span { width: 26px; height: 26px; }
      #mm-root .mind-elixir-toolbar.lt > span svg { width: 16px; height: 16px; }
    }


    .mm-empty { height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--mm-dim); }
    .mm-empty .card { padding: 28px 26px; border-radius: 22px; background: var(--mm-panel); border: 1px solid var(--mm-border); max-width: calc(100vw - 40px); }
    .mm-empty .t { font-size: 17px; color: #fff; font-weight: 600; margin-bottom: 8px; }
    .mm-empty .row { font-size: 13px; line-height: 1.9; }
    /* 大纲按钮已并入左侧工具条的统一样式（见上），这里不再单独设尺寸与间距 */

    /* 导图画布容器：库会写入内联 position:relative，这里用 !important 保持绝对定位铺满 */
    .mm-canvas-host {
      position: absolute !important;
      top: 0; right: 0; bottom: 0; left: 0;
      transition: left 0.25s ease;
    }    .mm-canvas-host.outline-open { left: min(380px, 86vw); }

    /* 大纲面板：默认关闭，打开后左侧写大纲、右侧实时成图。
       用 fixed 相对视口定位，避免被祖先容器（iframe、全屏态、canvasHost 的偏移）困住导致看不到。 */
    /* 节点图片：库对 me-tpc>img 设了 object-fit:cover，尺寸超过节点宽度就会被裁，
       这里改成完整显示并限制最大宽高（旧数据里按原图尺寸存的图片也能立刻正常） */
    #mm-root me-tpc > img {
      object-fit: contain !important;
      max-width: 320px !important;
      max-height: 240px !important;
      width: auto !important;
      height: auto !important;
      border-radius: 8px;
    }

    .mm-outline {
      position: fixed; left: 0; top: 0; z-index: 2147483000;
      width: min(380px, 86vw); height: 100vh;
      display: none; flex-direction: column;
      background: rgba(13, 13, 17, 0.94);
      border-right: 1px solid var(--mm-border);
      backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
    }
    .mm-outline.open { display: flex; }
    .mm-outline-head {
      display: flex; align-items: center;
      padding: 10px 14px 8px; border-bottom: 1px solid var(--mm-border);
      font-size: 12.5px; color: var(--mm-dim);
    }
    /* 只留标题；关闭大纲点左侧工具条的图标即可 */
    .mm-outline-title { flex: 1; font-weight: 600; color: var(--mm-text); }
    /* 缩略图现在直接嵌在大纲行内（见 .mm-oline-img） */

    .mm-outline-text {
      flex: 1; width: 100%; box-sizing: border-box; padding: 12px 14px;
      border: 0; outline: none; resize: none; background: transparent; color: var(--mm-text);
      font-size: 13.5px; line-height: 1.85;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .mm-outline-text::placeholder { color: rgba(255, 255, 255, 0.28); }

    /* 大纲顶部的缩略图条（纯文本大纲 + 缩略图条） */
    .mm-outline-images {
      flex: none; display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden;
      padding: 10px 12px; border-bottom: 1px solid var(--mm-border);
      scrollbar-width: thin;
    }
    .mm-outline-images[hidden] { display: none; }
    .mm-oimg {
      flex: none; width: 92px; padding: 0; cursor: pointer; text-align: left;
      background: transparent; border: 0; color: var(--mm-text); font-family: inherit;
    }
    .mm-oimg img {
      width: 92px; height: 62px; object-fit: cover; border-radius: 8px; display: block;
      border: 1px solid var(--mm-border);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .mm-oimg:hover img { border-color: var(--mm-accent); transform: translateY(-1px); }
    .mm-oimg .t {
      display: block; margin-top: 4px; font-size: 11px; color: var(--mm-dim);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mm-oimg .d { display: block; font-size: 10px; color: rgba(255, 255, 255, 0.32); }

    .mm-outline-text.rich {
      display: block; overflow-y: auto; padding: 10px 12px;
      cursor: text; outline: none;
    }
    .mm-outline-text.rich:focus { background: rgba(255, 255, 255, 0.02); }
    .mm-oline {
      display: flex; align-items: center; flex-wrap: wrap;
      /* 间距细调：这里不用 gap，改成各部分自己留右边距，好控制「·」与文字的距离 */
      gap: 0;
      min-height: 30px; padding: 2px 6px; border-radius: 8px;
      font-size: 13.5px; line-height: 1.6; color: var(--mm-text);
      transition: background 0.15s ease;
    }
    .mm-oline:hover { background: rgba(255, 255, 255, 0.04); }
    .mm-oline.lv0 {
      font-size: 15px; font-weight: 600; color: #fff;
      margin-bottom: 4px; padding-bottom: 6px; border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
    }
    /* 「·」与后面文字的间距（用户要求：拉开一点） */
    .mm-oline-bullet { color: var(--mm-accent); flex: none; opacity: 0.75; margin-right: 10px; }

    /* 按住 Ctrl 拖动缩放：光标提示 */
    #mm-root .mm-canvas-host.mm-zoom-ready { cursor: zoom-in; }
    #mm-root .mm-canvas-host.mm-zoom-pending { cursor: zoom-in; }
    #mm-root .mm-canvas-host.mm-zooming { cursor: zoom-in; }
    #mm-root .mm-canvas-host.mm-zooming * { cursor: zoom-in !important; }
    #mm-root .mm-canvas-host.mm-zooming .map-canvas { transition: transform 0.06s linear; }

    /* 选区工具栏：选中文字后浮出来套样式（替代手写 ** == 之类） */
    .mm-fmtbar {
      position: fixed; z-index: 2147483180; display: none; gap: 2px; padding: 4px;
      border-radius: 10px;
      background: rgba(20, 20, 26, 0.96); border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
    }
    .mm-fmtbar.show { display: flex; }
    .mm-fmtbar button {
      width: 30px; height: 28px; border: 0; border-radius: 7px; cursor: pointer;
      background: transparent; color: var(--mm-text); font-size: 13px; font-family: inherit;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background 0.15s ease;
    }
    .mm-fmtbar button:hover { background: rgba(255, 255, 255, 0.12); }
    .mm-fmtbar button.on { background: rgba(255, 255, 255, 0.2); }
    .mm-fmtbar button[data-mark="**"] { font-weight: 800; }
    .mm-fmtbar button[data-mark="=="] { background: rgba(255, 214, 102, 0.16); }
    .mm-fmtbar button[data-mark="~~"] { text-decoration: line-through; }
    .mm-fmtbar button[data-mark="__"] { text-decoration: underline; }

    /* 专注模式提示条（库的「专注」会把画布限制在一个分支里，容易让人以为节点没了） */
    .mm-focusbar {
      position: fixed; left: 50%; transform: translateX(-50%) translateY(-8px);
      top: 54px; z-index: 2147483020; display: none; align-items: center; gap: 12px;
      padding: 8px 12px; border-radius: 999px;
      background: rgba(20, 20, 26, 0.92); border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
      font-size: 12.5px; color: var(--mm-text); opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .mm-focusbar.show { display: flex; opacity: 1; transform: translateX(-50%) translateY(0); }
    .mm-focusbar .txt { color: var(--mm-dim); }
    .mm-focusbar button {
      padding: 5px 12px; border-radius: 999px; cursor: pointer; font-family: inherit; font-size: 12.5px;
      background: rgba(255, 255, 255, 0.92); border: 0; color: #16161a; font-weight: 600;
    }
    .mm-focusbar button:hover { background: #fff; }

    /* 行内样式标记：**加粗** ==高亮== ~~删除线~~ __下划线__ */
    /* 画布节点上的样式（.map-container 里 .text 会被塞进这些 span） */
    #mm-root .map-container .text .mm-b { font-weight: 700; }
    #mm-root .map-container .text .mm-mark {
      background: rgba(255, 214, 102, 0.22); border-radius: 4px; padding: 0 3px;
    }
    #mm-root .map-container .text .mm-del { text-decoration: line-through; opacity: 0.66; }
    #mm-root .map-container .text .mm-u { text-decoration: underline; text-underline-offset: 2px; }
    .mm-oline .mm-b { font-weight: 700; color: #fff; }
    .mm-oline .mm-mark {
      background: rgba(255, 214, 102, 0.18); color: #ffe6a8;
      border-radius: 4px; padding: 0 3px; box-shadow: inset 0 0 0 1px rgba(255, 214, 102, 0.22);
    }
    .mm-oline .mm-del { text-decoration: line-through; opacity: 0.62; }
    .mm-oline .mm-u { text-decoration: underline; text-underline-offset: 2px; }

    /* 备注：行尾小方块（有备注 = 实心，没有 = 悬停才显形的加号） */
    .mm-oline .mm-oline-note {
      flex: none; width: 16px; height: 16px; margin-left: 6px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 9px; line-height: 1; border-radius: 4px; cursor: pointer;
      color: var(--mm-dim); opacity: 0; transition: opacity 0.15s ease, background 0.15s ease;
    }
    .mm-oline:hover .mm-oline-note { opacity: 0.55; }
    .mm-oline .mm-oline-note:hover { opacity: 1; background: rgba(255, 255, 255, 0.1); }
    .mm-oline .mm-oline-note.has {
      opacity: 0.95; color: var(--mm-text); background: rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
    }
    /* 备注内容不占行高：默认隐藏，鼠标滑到小方块上才以气泡浮出 */
    .mm-oline .mm-oline-notetext { display: none; }
    .mm-notetip {
      position: fixed; z-index: 2147483150; display: none;
      max-width: 320px; padding: 10px 12px;
      font-size: 12.5px; line-height: 1.7; color: var(--mm-text); white-space: pre-wrap;
      background: rgba(22, 22, 27, 0.97); border: 1px solid var(--mm-border); border-radius: 10px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
    }
    .mm-notetip.show { display: block; }

    /* 备注编辑面板 */
    .mm-notebox {
      position: fixed; z-index: 2147483160; display: none; flex-direction: column;
      width: 300px; padding: 12px; gap: 8px;
      background: rgba(20, 20, 24, 0.97); border: 1px solid var(--mm-border); border-radius: 14px;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);
    }
    .mm-notebox.show { display: flex; }
    .mm-notebox-head {
      display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
      font-size: 12.5px; font-weight: 600; color: var(--mm-text);
    }
    .mm-notebox-head span { font-size: 10.5px; font-weight: 400; color: var(--mm-dim); }
    .mm-notebox-ta {
      width: 100%; box-sizing: border-box; min-height: 96px; max-height: 220px; resize: vertical;
      padding: 8px 10px; border-radius: 10px; border: 1px solid var(--mm-border);
      background: rgba(255, 255, 255, 0.04); color: var(--mm-text);
      font-size: 13px; line-height: 1.7; font-family: inherit; outline: none;
    }
    .mm-notebox-ta:focus { border-color: rgba(255, 255, 255, 0.28); background: rgba(255, 255, 255, 0.06); }
    .mm-notebox-btns { display: flex; gap: 8px; justify-content: flex-end; }
    .mm-notebox-btns button {
      padding: 6px 12px; border-radius: 9px; cursor: pointer; font-size: 12.5px; font-family: inherit;
      background: rgba(255, 255, 255, 0.06); border: 1px solid var(--mm-border); color: var(--mm-text);
    }
    .mm-notebox-btns button:hover { background: rgba(255, 255, 255, 0.12); }
    .mm-notebox-btns button.primary {
      background: rgba(255, 255, 255, 0.92); color: #16161a; border-color: transparent; font-weight: 600;
    }
    .mm-notebox-btns button.primary:hover { background: #fff; }

    /* 导入大纲面板：复用备注面板的排版，只换个宽度 */
    .mm-importbox {
      position: fixed; z-index: 2147483170; display: none; flex-direction: column;
      width: 360px; padding: 12px; gap: 8px;
      background: rgba(20, 20, 24, 0.97); border: 1px solid var(--mm-border); border-radius: 14px;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);
    }
    .mm-importbox.show { display: flex; }
    .mm-importbox .mm-import-ta { min-height: 180px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    /* 工具条上的「导入」按钮，和「大纲」按钮同一套外观 */
    #mm-root .mind-elixir-toolbar.lt > span.mm-import-btn { display: inline-flex !important; }
    #mm-root .mind-elixir-toolbar.lt > span.mm-import-btn svg { width: 18px !important; height: 18px !important; }

    /* 大纲行点图片 → 大图预览 */
    #mm-imgview {
      position: fixed; inset: 0; z-index: 2147483200; display: none;
      align-items: center; justify-content: center;
      background: rgba(6, 6, 9, 0.88);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      cursor: zoom-out;
    }
    #mm-imgview.show { display: flex; }
    #mm-imgview img {
      max-width: 88vw; max-height: 86vh; object-fit: contain;
      border-radius: 12px; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
    }
    #mm-imgview .tip {
      position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
      font-size: 12.5px; color: var(--mm-dim);
    }

    /* 大纲行右键菜单（插入 / 移除图片） */
    .mm-rowmenu {
      position: fixed; z-index: 2147483100; min-width: 210px; padding: 6px;
      display: none; flex-direction: column; gap: 2px;
      background: rgba(20, 20, 24, 0.96); border: 1px solid var(--mm-border); border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);
    }
    .mm-rowmenu.show { display: flex; }
    .mm-rowmenu button {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; cursor: pointer;
      background: transparent; color: var(--mm-text); font-size: 13px; text-align: left;
      font-family: inherit;
    }
    .mm-rowmenu button:hover { background: rgba(255, 255, 255, 0.08); }
    .mm-rowmenu button:disabled { opacity: 0.4; cursor: default; }
    .mm-rowmenu button:disabled:hover { background: transparent; }
    .mm-rowmenu button span { font-size: 11px; color: var(--mm-dim); }
    .mm-oline-topic { outline: none; word-break: break-word; flex: 0 1 auto; }
    /* 缩略图与文字之间也留一点距离 */
    .mm-oline-img { margin-left: 8px; }
    /* 行内缩略图：小方块，点了会在画布里定位到该节点 */
    .mm-oline-img {
      display: block; flex: none; width: 92px; height: 62px; object-fit: cover;
      border-radius: 8px; border: 1px solid var(--mm-border);
      cursor: pointer; transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .mm-oline-img:hover { border-color: var(--mm-accent); transform: translateY(-1px); }
    @media (max-width: 720px) {
      .mm-oline-img { width: 68px; height: 46px; }
    }

    /* 留言抽屉样式在 /css/drawer.css；这里用更高特异性兜一层显隐，避免被页面样式影响 */
    #mm-root .mm-drawer { display: none; }
    #mm-root .mm-drawer.open { display: flex; }
    #mm-root .mm-drawer-scrim { display: none; }
    #mm-root .mm-drawer-scrim.show { display: block; }
  </style>
</head>
<body>
  <!--
    思维导图页（独立页，供文章页整页展示与后台编辑页 iframe 内嵌）
    用法：
      /mindmap.html?note=<id>            只读查看
      /mindmap.html?note=<id>&edit=1     编辑（管理员，或开放编辑 + 口令）
      /mindmap.html?edit=1               新建（自动生成 id，保存时需管理员）
  -->
  <div id="mm-root"></div>

  <script>
    (function () {
      var qs = new URLSearchParams(location.search);
      var note = (qs.get('note') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 64);
      var edit = qs.get('edit') === '1' || qs.get('edit') === 'true';
      var root = document.getElementById('mm-root');

      if (!note && !edit) {
        root.innerHTML =
          '<div class="mm-empty"><div class="card">' +
          '<div class="t">思维导图</div>' +
          '<div class="row"><code>/mindmap.html?note=导图ID</code> —— 查看已有导图</div>' +
          '<div class="row"><code>/mindmap.html?note=导图ID&edit=1</code> —— 编辑</div>' +
          '<div class="row"><code>/mindmap.html?edit=1</code> —— 新建（需管理员）</div>' +
          '</div></div>';
        return;
      }

      if (!note) note = 'mm-' + Math.random().toString(36).slice(2, 10);
      root.dataset.note = note;
      root.dataset.mode = edit ? 'edit' : 'view';
      document.title = (edit ? '编辑导图' : '思维导图') + ' - ' + note;
      // 被前台文章页 iframe 嵌入：提示文案交给父页面，浮条只留导出
      try { if (window.parent !== window) document.documentElement.dataset.embedded = '1'; } catch (e) { /* 跨域则忽略 */ }
    })();
  </script>
  <link rel="stylesheet" href="/js/vendor/mindmap/mindmap-editor.v99.css">
  <script src="/js/vendor/mindmap/mindmap-editor.v99.js"></script>
  <script>
    // 兜底诊断：bundle 未加载或运行时抛错时给出可见提示，而不是静默无反应
    (function () {
      var root = document.getElementById('mm-root');
      function show(title, detail) {
        if (!root) return;
        var box = document.getElementById('mm-diag');
        if (!box) {
          box = document.createElement('div');
          box.id = 'mm-diag';
          box.style.cssText = 'position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:99;' +
            'max-width:92vw;padding:10px 14px;border-radius:12px;text-align:left;' +
            'background:rgba(40,16,16,.95);border:1px solid rgba(239,106,94,.5);color:#ffd9d5;' +
            'font-size:12.5px;line-height:1.7;word-break:break-all;';
          root.appendChild(box);
        }
        box.innerHTML = '<b>' + title + '</b><br>' + detail;
      }
      window.__mmDiag = show;
      window.addEventListener('error', function (e) {
        var msg = e.message || '未知脚本错误';
        var at = e.filename ? ' @' + String(e.filename).split('/').pop() + ':' + (e.lineno || 0) : '';
        show('脚本出错', msg + at);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        show('脚本出错', (r && (r.message || r)) || '未处理的 Promise 拒绝');
      });
      window.addEventListener('load', function () {
        if (!window.MindMapMount) {
          show('导图组件未能加载',
            '脚本 mindmap-editor.v99.js 加载失败（404 / 部署未完成 / 被拦截）。<br>' +
            '请 Ctrl+F5 强制刷新；若仍失败，检查 Netlify 最近一次部署是否成功。');
        }
      });
    })();
  </script>
</body>
</html>
