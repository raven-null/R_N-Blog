<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>思维导图</title>
  <link rel="icon" id="siteFavicon" href="/images/Default/web-logo.webp" type="image/webp">
  <link rel="apple-touch-icon" href="/images/Default/web-logo.webp">
  <script src="/js/site-icon.js?v=1.0.0"></script>
  <link rel="stylesheet" href="/css/scrollbar.css?v=1.0.1">
  <link rel="stylesheet" href="/css/responsive.css?v=1.0.0">
  <style>
    :root {
      --mm-bg: #0b0b0e;
      --mm-panel: rgba(16, 16, 19, 0.72);
      --mm-border: rgba(255, 255, 255, 0.12);
      --mm-text: #e8e8ea;
      --mm-dim: rgba(255, 255, 255, 0.55);
      --mm-accent: #ff9f0a;
    }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--mm-bg); color: var(--mm-text); overflow: hidden; }
    * { box-sizing: border-box; }
    body { display: block; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", sans-serif; }
    #mm-root { position: absolute; inset: 0; } /* 绝对定位铺满视口，容器尺寸不依赖 flex 计算 */
    /* 状态提示：浮在顶部居中的小胶囊（导出按钮已全部移到底部胶囊里） */
    .mm-bar {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 21;
      display: flex; align-items: center; max-width: 88vw;
    }
    .mm-bar .mm-msg {
      display: inline-block; padding: 6px 14px; border-radius: 999px;
      max-width: 88vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      background: var(--mm-panel); border: 1px solid var(--mm-border); color: var(--mm-dim);
      backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow: 0 12px 32px -14px rgba(0, 0, 0, 0.7);
      font-size: 12.5px;
    }
    .mm-bar .mm-msg:empty { display: none; }
    /* 口令浮条：加密导图进编辑态时自动滑出（用 fixed 定位，iframe 内也贴自身顶部） */
    .mm-key {
      position: fixed; left: 50%; top: 14px; transform: translateX(-50%) translateY(-160%); z-index: 41;
      display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
      background: var(--mm-panel); border: 1px solid var(--mm-border);
      backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
      font-size: 12px; color: var(--mm-dim);
      opacity: 0; pointer-events: none; transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
    }
    .mm-key.open { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
    .mm-key input {
      width: 140px; padding: 4px 9px; border-radius: 8px; font-size: 12px; font-family: inherit;
      background: rgba(0, 0, 0, 0.3); border: 1px solid var(--mm-border); color: var(--mm-text); outline: none;
    }

    /* ---------- 底部居中胶囊：返回 / 导出 / 编辑 · 完成 / 留言 / 信息 / 口令 ---------- */
    .mm-capsule {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 22;
      display: flex; align-items: center; justify-content: center; flex-wrap: nowrap; gap: 2px;
      padding: 5px 6px; border-radius: 20px; width: max-content; max-width: 94vw;
      background: linear-gradient(145deg, rgba(30, 30, 37, 0.85), rgba(20, 20, 26, 0.78));
      backdrop-filter: blur(26px) saturate(180%); -webkit-backdrop-filter: blur(26px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow: 0 14px 44px -10px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: mm-capsule-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
    }
    @keyframes mm-capsule-in { from { opacity: 0; transform: translateX(-50%) translateY(14px); } to { opacity: 1; transform: translateX(-50%); } }
    .mm-cap-btn {
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
      padding: 6px 11px; border-radius: 14px; cursor: pointer;
      color: #d8dbe4; font-size: 12.5px; font-family: inherit;
      background: transparent; border: none;
      transition: background 0.2s ease, color 0.2s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .mm-cap-btn svg { width: 14px; height: 14px; flex: none; }
    .mm-cap-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .mm-cap-btn:active { transform: scale(0.94); }
    .mm-cap-btn.active { background: rgba(255, 255, 255, 0.14); color: #fff; }
    /* 返回：绝不压缩，排在胶囊首位；极窄屏允许整条胶囊换行，也照样看得到 */
    .mm-cap-btn.cap-back { flex: 0 0 auto; }
    @media (max-width: 460px) {
      .mm-capsule { flex-wrap: wrap; max-width: 96vw; row-gap: 2px; }
    }
    /* 导出菜单：浮在胶囊正上方 */
    .mm-cap-menu {
      position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%) translateY(6px);
      display: flex; flex-direction: column; gap: 2px; padding: 6px; border-radius: 16px;
      min-width: 172px; z-index: 23;
      background: linear-gradient(145deg, rgba(32, 32, 40, 0.95), rgba(20, 20, 26, 0.93));
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow: 0 22px 56px -16px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .mm-cap-menu.open { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
    .mm-cap-item {
      display: flex; align-items: center; gap: 9px; white-space: nowrap;
      padding: 9px 12px; border-radius: 11px; cursor: pointer; text-align: left;
      color: #d8dbe4; font-size: 12.5px; font-family: inherit; background: transparent; border: none;
      transition: background 0.18s ease, color 0.18s ease;
    }
    .mm-cap-item svg { width: 15px; height: 15px; flex: none; opacity: 0.78; }
    .mm-cap-item:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .mm-cap-menu .bb-edit-only { display: none; }
    .mm-capsule.is-edit .mm-cap-menu .bb-edit-only { display: flex; }
    /* 窄屏：按钮紧凑一点，避免胶囊溢出（溢出会把后面的按钮挤出屏幕） */
    @media (max-width: 720px) {
      .mm-capsule { padding: 4px 4px; gap: 0; }
      .mm-cap-btn { padding: 6px 8px; gap: 4px; font-size: 12px; }
      .mm-cap-btn svg { width: 13px; height: 13px; }
      .mm-cap-menu { min-width: 156px; }
    }
    /* 查看态只显示「编辑」，编辑态只显示「保存」「完成」。
       编辑时其余按钮（返回/导出/留言/信息）一律收起，和白板的编辑态一致；
       大纲按钮不在这里，它挂在库的左侧工具条上，跟库自带图标同一排。 */
    .mm-capsule .bb-edit-only { display: none; }
    .mm-capsule.is-edit .bb-view-only { display: none; }
    .mm-capsule.is-edit .bb-edit-only { display: inline-flex; }
    /* 保存：编辑态的主按钮，给点颜色区别于「完成」 */
    .mm-cap-btn.cap-save { color: #eaf2ff; }
    .mm-cap-btn.cap-save:hover { background: rgba(115, 170, 255, 0.2); color: #fff; }
    /* 口令入口：只有服务端说这张导图设了口令、且不是管理员才显形 */
    .mm-cap-btn.cap-key { display: none; }
    .mm-capsule.is-edit .mm-cap-btn.cap-key.show { display: inline-flex; }
    /* 只读态 */
    /* 工具条常驻显示：方向切换 + 大纲入口，只读时也能看大纲；能不能改内容由 mind.editable 拦着 */
    #mm-root .mind-elixir-toolbar { display: block !important; }
    /* 左侧工具条：竖直排列、竖直居中、图标等距 */
    #mm-root .mind-elixir-toolbar.lt {
      display: flex !important; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px;
      top: 50%; transform: translateY(-50%);
      left: 16px;
      padding: 12px 10px; border-radius: 16px;
      background: linear-gradient(145deg, rgba(30, 30, 37, 0.85), rgba(20, 20, 26, 0.78));
      backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    /* 库自带的 span+span { margin-top: 10px } 会和 gap 叠加，统一改成 gap 控制间距 */
    #mm-root .mind-elixir-toolbar.lt > span + span { margin-top: 0; }
    /* 每个图标统一成 20×20 的圆形热区，间距由 gap 统一负责 */
    #mm-root .mind-elixir-toolbar.lt > span {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; margin: 0; cursor: pointer;
      color: rgba(255, 255, 255, 0.72);
      border-radius: 10px;
      transition: background 0.2s ease, color 0.2s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #mm-root .mind-elixir-toolbar.lt > span svg { width: 18px; height: 18px; display: block; }
    #mm-root .mind-elixir-toolbar.lt > span:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
    #mm-root .mind-elixir-toolbar.lt > span:active { transform: scale(0.92); }
    #mm-root .mind-elixir-toolbar.lt > span.active,
    #mm-root .mind-elixir-toolbar.lt > span.mm-outline-btn.active { background: rgba(255, 159, 10, 0.18); color: var(--mm-accent); }
    /* 只读时大纲可看不可改：视觉上和「正在编辑」区分开 */
    #mm-root.mm-readonly .mm-outline-text { color: rgba(255, 255, 255, 0.72); cursor: default; }
    #mm-root.mm-readonly me-tpc > .text { -webkit-user-select: none; -ms-user-select: none; user-select: none; }
    #mm-root.mm-readonly me-epd { display: none !important; }
    html[data-embedded="1"] .mm-capsule { bottom: 14px; }
    /* 窄屏：工具条再紧凑一点，避免压住内容 */
    @media (max-width: 720px) {
      #mm-root .mind-elixir-toolbar.lt { left: 10px; gap: 8px; padding: 9px 8px; }
      #mm-root .mind-elixir-toolbar.lt > span { width: 26px; height: 26px; }
      #mm-root .mind-elixir-toolbar.lt > span svg { width: 16px; height: 16px; }
    }

    /* 退出编辑确认弹层 */
    .mm-dlg {
      position: absolute; inset: 0; z-index: 60; display: none;
      align-items: center; justify-content: center; padding: 18px;
      background: rgba(5, 5, 9, 0.5);
      backdrop-filter: blur(10px) saturate(140%); -webkit-backdrop-filter: blur(10px) saturate(140%);
    }
    .mm-dlg.show { display: flex; }
    .mm-dlg-card {
      width: min(350px, 92vw); padding: 22px; border-radius: 22px;
      background: linear-gradient(145deg, rgba(34, 34, 42, 0.97), rgba(20, 20, 26, 0.95));
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow: 0 30px 90px -20px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: mm-dlg-in 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes mm-dlg-in { from { opacity: 0; transform: translateY(10px) scale(0.97); } to { opacity: 1; transform: none; } }
    .mm-dlg-title { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .mm-dlg-sub { font-size: 12.5px; color: rgba(255, 255, 255, 0.5); margin-bottom: 16px; line-height: 1.7; }
    .mm-dlg-btns { display: flex; flex-direction: column; gap: 8px; }
    .mm-dlg-btn {
      display: flex; align-items: center; justify-content: center; gap: 7px;
      padding: 10px 16px; border-radius: 13px; cursor: pointer; font-family: inherit; font-size: 13.5px;
      color: #e8e8ea; border: 1px solid rgba(255, 255, 255, 0.13);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.04));
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .mm-dlg-btn:hover { background: linear-gradient(145deg, rgba(255, 255, 255, 0.17), rgba(255, 255, 255, 0.07)); border-color: rgba(255, 255, 255, 0.28); }
    .mm-dlg-btn:active { transform: scale(0.97); }
    .mm-dlg-btn.primary {
      color: #eaf2ff; font-weight: 600; border-color: rgba(115, 170, 255, 0.45);
      background: linear-gradient(145deg, rgba(59, 130, 246, 0.42), rgba(115, 170, 255, 0.28));
    }
    .mm-dlg-btn.primary:hover { background: linear-gradient(145deg, rgba(59, 130, 246, 0.6), rgba(115, 170, 255, 0.42)); }
    .mm-dlg-err {
      display: none; margin-top: 12px; padding: 8px 12px; border-radius: 10px; font-size: 12px;
      color: #ff9f0a; background: rgba(255, 159, 10, 0.1); border: 1px solid rgba(255, 159, 10, 0.25);
    }
    .mm-dlg-err.show { display: block; }

    .mm-empty { height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--mm-dim); }
    .mm-empty .card { padding: 28px 26px; border-radius: 22px; background: var(--mm-panel); border: 1px solid var(--mm-border); max-width: calc(100vw - 40px); }
    .mm-empty .t { font-size: 17px; color: #fff; font-weight: 600; margin-bottom: 8px; }
    .mm-empty .row { font-size: 13px; line-height: 1.9; }
    /* 大纲按钮已并入左侧工具条的统一样式（见上），这里不再单独设尺寸与间距 */

    /* 导图画布容器：库会写入内联 position:relative，这里用 !important 保持绝对定位铺满 */
    .mm-canvas-host {
      position: absolute !important;
      top: 0; right: 0; bottom: 0; left: 0;
      transition: left 0.25s ease;
    }
    .mm-canvas-host.outline-open { left: min(380px, 86vw); }

    /* 大纲面板：默认关闭，打开后左侧写大纲、右侧实时成图 */
    .mm-outline {
      position: absolute; left: 0; top: 0; bottom: 0; z-index: 30;
      width: min(380px, 86vw); display: none; flex-direction: column;
      background: rgba(13, 13, 17, 0.94);
      border-right: 1px solid var(--mm-border);
      backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
    }
    .mm-outline.open { display: flex; }
    .mm-outline-head {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 10px 12px; border-bottom: 1px solid var(--mm-border);
      font-size: 12.5px; color: var(--mm-dim);
    }
    .mm-outline-title { font-weight: 600; color: var(--mm-text); }
    .mm-outline-tip { flex: 1; min-width: 120px; font-size: 11.5px; color: rgba(255, 255, 255, 0.42); }
    .mm-outline-text {
      flex: 1; width: 100%; box-sizing: border-box; padding: 12px 14px;
      border: 0; outline: none; resize: none; background: transparent; color: var(--mm-text);
      font-size: 13.5px; line-height: 1.85;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .mm-outline-text::placeholder { color: rgba(255, 255, 255, 0.28); }

    @media (max-width: 640px) {
      .mm-bar { left: 10px; right: 10px; bottom: 10px; justify-content: center; }
      .mm-bar .mm-msg { max-width: 100%; }
    }
  </style>
</head>
<body>
  <!--
    思维导图页（独立页，供文章页整页展示与后台编辑页 iframe 内嵌）
    用法：
      /mindmap.html?note=<id>            只读查看
      /mindmap.html?note=<id>&edit=1     编辑（管理员，或开放编辑 + 口令）
      /mindmap.html?edit=1               新建（自动生成 id，保存时需管理员）
  -->
  <div id="mm-root"></div>

  <script>
    (function () {
      var qs = new URLSearchParams(location.search);
      var note = (qs.get('note') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 64);
      var edit = qs.get('edit') === '1' || qs.get('edit') === 'true';
      var root = document.getElementById('mm-root');

      if (!note && !edit) {
        root.innerHTML =
          '<div class="mm-empty"><div class="card">' +
          '<div class="t">思维导图</div>' +
          '<div class="row"><code>/mindmap.html?note=导图ID</code> —— 查看已有导图</div>' +
          '<div class="row"><code>/mindmap.html?note=导图ID&edit=1</code> —— 编辑</div>' +
          '<div class="row"><code>/mindmap.html?edit=1</code> —— 新建（需管理员）</div>' +
          '</div></div>';
        return;
      }

      if (!note) note = 'mm-' + Math.random().toString(36).slice(2, 10);
      root.dataset.note = note;
      root.dataset.mode = edit ? 'edit' : 'view';
      document.title = (edit ? '编辑导图' : '思维导图') + ' - ' + note;
      // 被前台文章页 iframe 嵌入：提示文案交给父页面，浮条只留导出
      try { if (window.parent !== window) document.documentElement.dataset.embedded = '1'; } catch (e) { /* 跨域则忽略 */ }
    })();
  </script>
  <link rel="stylesheet" href="/js/vendor/mindmap/mindmap-editor.v23.css">
  <script src="/js/vendor/mindmap/mindmap-editor.v23.js"></script>
  <script>
    // 兜底诊断：bundle 未加载或运行时抛错时给出可见提示，而不是静默无反应
    (function () {
      var root = document.getElementById('mm-root');
      function show(title, detail) {
        if (!root) return;
        var box = document.getElementById('mm-diag');
        if (!box) {
          box = document.createElement('div');
          box.id = 'mm-diag';
          box.style.cssText = 'position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:99;' +
            'max-width:92vw;padding:10px 14px;border-radius:12px;text-align:left;' +
            'background:rgba(40,16,16,.95);border:1px solid rgba(239,106,94,.5);color:#ffd9d5;' +
            'font-size:12.5px;line-height:1.7;word-break:break-all;';
          root.appendChild(box);
        }
        box.innerHTML = '<b>' + title + '</b><br>' + detail;
      }
      window.__mmDiag = show;
      window.addEventListener('error', function (e) {
        var msg = e.message || '未知脚本错误';
        var at = e.filename ? ' @' + String(e.filename).split('/').pop() + ':' + (e.lineno || 0) : '';
        show('脚本出错', msg + at);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        show('脚本出错', (r && (r.message || r)) || '未处理的 Promise 拒绝');
      });
      window.addEventListener('load', function () {
        if (!window.MindMapMount) {
          show('导图组件未能加载',
            '脚本 mindmap-editor.v23.js 加载失败（404 / 部署未完成 / 被拦截）。<br>' +
            '请 Ctrl+F5 强制刷新；若仍失败，检查 Netlify 最近一次部署是否成功。');
        }
      });
    })();
  </script>
</body>
</html>
