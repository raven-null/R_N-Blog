<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excalidraw 白板</title>
  <link rel="stylesheet" href="/js/vendor/excalidraw/excalidraw-editor.v11.css" />
  <style>
    /* 液态玻璃体系（与博客 glass.css 同款变量） */
    :root {
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --glass-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.035));
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-hi: rgba(255, 255, 255, 0.08);
      --glass-blur: blur(24px) saturate(180%);
    }
    html, body { margin: 0; padding: 0; height: 100%; background: #0b0b0e; color: #eee; overflow: hidden; }
    * { box-sizing: border-box; }
    /* 全屏应用布局：header 固定，画布占满剩余空间，页面本身不滚动 */
    body { display: flex; flex-direction: column; }
    /* 环境光斑背景 */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 55% 45% at 12% 18%, rgba(90, 120, 255, 0.16), transparent 65%),
        radial-gradient(ellipse 50% 40% at 88% 12%, rgba(190, 90, 255, 0.11), transparent 65%),
        radial-gradient(ellipse 60% 50% at 78% 82%, rgba(0, 210, 190, 0.08), transparent 65%),
        radial-gradient(ellipse 45% 40% at 20% 85%, rgba(255, 150, 90, 0.06), transparent 65%);
    }
    /* 液态玻璃顶栏 */
    .site-header {
      position: relative; z-index: 2; flex: none;
      display: flex; align-items: center; gap: 12px;
      padding: 9px 18px; background: rgba(16, 16, 19, 0.58);
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    }
    .nav-pill {
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
      color: #e8e8ea; padding: 5px 13px; border-radius: 999px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.035));
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: transform 0.25s var(--spring), background 0.2s ease, border-color 0.2s ease;
    }
    .nav-pill:hover { background: linear-gradient(145deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.07)); border-color: rgba(255, 255, 255, 0.26); }
    .nav-pill:active { transform: scale(0.95); }
    .nav-pill svg { width: 14px; height: 14px; }
    .nav-pill.primary { color: #0b0b10; background: linear-gradient(180deg, #fff, #d9d9e3); border-color: rgba(255, 255, 255, 0.55); }
    .site-header .title {
      color: #fff; font-weight: 600; font-size: 14px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw;
    }
    .site-header .spacer { flex: 1; }
    #excalidraw-root { position: relative; z-index: 1; flex: 1; min-height: 0; }
    /* 空态（无参数用法说明） */
    .empty-tip {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #aaa;
    }
    .empty-tip .card {
      display: flex; flex-direction: column; gap: 6px; padding: 36px 46px;
      border-radius: 26px; background: var(--glass-bg);
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 60px -16px rgba(0, 0, 0, 0.6), inset 0 1px 0 var(--glass-hi);
    }
    .empty-tip .card svg { width: 30px; height: 30px; margin: 0 auto 6px; color: rgba(255, 255, 255, 0.4); }
    .empty-tip .t { font-size: 17px; color: #fff; font-weight: 600; margin-bottom: 8px; }
    .empty-tip .row { font-size: 13px; color: rgba(255, 255, 255, 0.5); line-height: 1.9; }
    .empty-tip code { background: rgba(255, 255, 255, 0.1); padding: 2px 7px; border-radius: 6px; color: #bcd0ff; font-size: 12px; }
  </style>
</head>
<body>
  <!--
    Excalidraw 笔记页
    用法：
      /excalidraw.html?note=demo            只读分享（默认）
      /excalidraw.html?note=demo&edit=1     编辑（口令/管理员）
      /excalidraw.html?edit=1               新建（自动生成 ID，需管理员登录）
  -->
  <header class="site-header">
    <a class="nav-pill" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10.5 9-7.5 9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      博客
    </a>
    <span class="title" id="noteTitle">Excalidraw 白板</span>
    <span class="spacer"></span>
    <a id="editLink" class="nav-pill" href="#" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      编辑
    </a>
    <a id="viewLink" class="nav-pill" href="#" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>
      只读
    </a>
  </header>
  <main id="excalidraw-root"></main>

  <script>
    (function () {
      var qs = new URLSearchParams(location.search);
      var note = (qs.get('note') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 64);
      var edit = qs.get('edit') === '1' || qs.get('edit') === 'true';
      var root = document.getElementById('excalidraw-root');
      var titleEl = document.getElementById('noteTitle');
      var editLink = document.getElementById('editLink');
      var viewLink = document.getElementById('viewLink');
      var path = location.pathname;

      if (note) {
        root.setAttribute('data-excalidraw', '');
        root.dataset.note = note;
        root.dataset.mode = edit ? 'edit' : 'view';
        titleEl.textContent = '白板：' + note;
        document.title = (edit ? '编辑 ' : '') + note + ' - Excalidraw';
        if (!edit) { editLink.style.display = ''; editLink.href = path + '?note=' + note + '&edit=1'; }
        else { viewLink.style.display = ''; viewLink.href = path + '?note=' + note; }
      } else if (edit) {
        // 新建：自动生成 ID（保存时需管理员）
        root.setAttribute('data-excalidraw', '');
        root.dataset.note = 'wb-' + Math.random().toString(36).slice(2, 10);
        root.dataset.mode = 'edit';
        titleEl.textContent = '新建白板';
        document.title = '新建白板 - Excalidraw';
      } else {
        root.innerHTML =
          '<div class="empty-tip"><div class="card">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 12h10M12 7v10"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/></svg>' +
          '<div class="t">Excalidraw 白板</div>' +
          '<div class="row"><code>/excalidraw.html?note=笔记ID</code> —— 打开已有白板（只读）</div>' +
          '<div class="row"><code>/excalidraw.html?note=笔记ID&edit=1</code> —— 编辑（作者开放或输入口令）</div>' +
          '<div class="row"><code>/excalidraw.html?edit=1</code> —— 新建（需管理员）</div>' +
          '</div></div>';
      }
    })();
  </script>
  <script src="/js/vendor/excalidraw/excalidraw-editor.v11.js"></script>
  <script>
    // 兜底诊断：bundle 加载失败/未生效时给出可见提示（而非空白页）
    window.addEventListener('load', function () {
      if (!window.ExcalidrawMount) {
        var root = document.getElementById('excalidraw-root');
        if (root) {
          root.innerHTML =
            '<div class="empty-tip"><div class="card">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.5 20h19Z"/><path d="M12 10v4.5"/></svg>' +
            '<div class="t">白板组件未能加载</div>' +
            '<div class="row">脚本 excalidraw-editor.v11.js 加载失败（404 / 部署未完成 / 被拦截）。<br>' +
            '请 Ctrl+F5 强制刷新；若仍失败，检查 Netlify 最近一次部署是否成功，<br>' +
            '或打开 F12 → Network 看该脚本的状态码。</div>' +
            '</div></div>';
        }
      }
    });
  </script>
</body>
</html>
