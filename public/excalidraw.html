<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excalidraw 白板</title>
  <link rel="icon" id="siteFavicon" href="/images/Default/web-logo.webp" type="image/webp">
  <link rel="apple-touch-icon" href="/images/Default/web-logo.webp">
  <script src="/js/site-icon.js?v=1.0.0"></script>
  <link rel="stylesheet" href="/js/vendor/excalidraw/excalidraw-editor.v12.css" />
  <style>
    /* 液态玻璃体系（与博客 glass.css 同款变量） */
    :root {
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --glass-bg: linear-gradient(145deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.035));
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-hi: rgba(255, 255, 255, 0.08);
      --glass-blur: blur(24px) saturate(180%);
    }
    html, body { margin: 0; padding: 0; height: 100%; background: #0b0b0e; color: #eee; overflow: hidden; }
    * { box-sizing: border-box; }
    /* 全屏应用布局：header 固定，画布占满剩余空间，页面本身不滚动 */
    body { display: flex; flex-direction: column; }
    /* 环境光斑背景 */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 55% 45% at 12% 18%, rgba(90, 120, 255, 0.16), transparent 65%),
        radial-gradient(ellipse 50% 40% at 88% 12%, rgba(190, 90, 255, 0.11), transparent 65%),
        radial-gradient(ellipse 60% 50% at 78% 82%, rgba(0, 210, 190, 0.08), transparent 65%),
        radial-gradient(ellipse 45% 40% at 20% 85%, rgba(255, 150, 90, 0.06), transparent 65%);
    }
    /* 液态玻璃顶栏 */
    .site-header {
      position: relative; z-index: 2; flex: none;
      display: flex; align-items: center; gap: 12px;
      padding: 9px 18px; background: rgba(16, 16, 19, 0.58);
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    }
    .nav-pill {
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
      color: #e8e8ea; padding: 5px 13px; border-radius: 999px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.035));
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: transform 0.25s var(--spring), background 0.2s ease, border-color 0.2s ease;
    }
    .nav-pill:hover { background: linear-gradient(145deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.07)); border-color: rgba(255, 255, 255, 0.26); }
    .nav-pill:active { transform: scale(0.95); }
    .nav-pill svg { width: 14px; height: 14px; }
    .nav-pill.primary { color: #0b0b10; background: linear-gradient(180deg, #fff, #d9d9e3); border-color: rgba(255, 255, 255, 0.55); }
    .site-header .title {
      color: #fff; font-weight: 600; font-size: 14px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw;
    }
    .site-header .spacer { flex: 1; }
    #excalidraw-root { position: relative; z-index: 1; flex: 1; min-height: 0; }
    /* 空态（无参数用法说明） */
    .empty-tip {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #aaa;
    }
    .empty-tip .card {
      display: flex; flex-direction: column; gap: 6px; padding: 36px 46px;
      border-radius: 26px; background: var(--glass-bg);
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 60px -16px rgba(0, 0, 0, 0.6), inset 0 1px 0 var(--glass-hi);
    }
    .empty-tip .card svg { width: 30px; height: 30px; margin: 0 auto 6px; color: rgba(255, 255, 255, 0.4); }
    .empty-tip .t { font-size: 17px; color: #fff; font-weight: 600; margin-bottom: 8px; }
    .empty-tip .row { font-size: 13px; color: rgba(255, 255, 255, 0.5); line-height: 1.9; }
    .empty-tip code { background: rgba(255, 255, 255, 0.1); padding: 2px 7px; border-radius: 6px; color: #bcd0ff; font-size: 12px; }
    /* ===== 发布弹窗（白板） ===== */
    .wbp-modal{position:fixed;inset:0;z-index:60;display:none}
    .wbp-modal.open{display:flex;align-items:center;justify-content:center}
    .wbp-mask{position:absolute;inset:0;background:rgba(5,5,9,.6);backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%)}
    .wbp-box{position:relative;width:min(450px,92vw);max-height:88vh;overflow-y:auto;padding:22px;border-radius:20px;
      background:linear-gradient(145deg,rgba(34,34,42,.97),rgba(18,18,24,.96));border:1px solid rgba(255,255,255,.13);
      box-shadow:0 30px 90px -20px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.08);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8e8ea}
    .wbp-box h3{font-size:16px;font-weight:700;color:#cfe2ff;margin:0 0 6px}
    .wbp-sub{font-size:12.5px;color:rgba(255,255,255,.5);line-height:1.7;margin-bottom:14px}
    .wbp-field{margin-bottom:12px}
    .wbp-field label{display:block;font-size:12px;color:rgba(255,255,255,.55);margin-bottom:6px}
    .wbp-field input,.wbp-field select{width:100%;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:13px;font-family:inherit}
    .wbp-field input:focus,.wbp-field select:focus{outline:none;border-color:rgba(115,170,255,.6)}
    .wbp-cover-row{display:flex;align-items:center;gap:12px}
    .wbp-cover-preview{width:114px;height:70px;flex:none;border-radius:10px;border:1px dashed rgba(255,255,255,.18);background:#0a0b10;display:flex;align-items:center;justify-content:center;font-size:11px;color:rgba(255,255,255,.45);overflow:hidden}
    .wbp-cover-preview img{width:100%;height:100%;object-fit:cover;display:block}
    .wbp-cover-btns{display:flex;gap:6px;flex-wrap:wrap}
    .wbp-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;cursor:pointer;font-size:12.5px;font-family:inherit;
      color:#e8e8ea;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);transition:all .2s ease}
    .wbp-btn:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.28)}
    .wbp-btn.primary{color:#0b0b10;background:linear-gradient(180deg,#fff,#d9d9e3);border-color:rgba(255,255,255,.55)}
    .wbp-btn.primary:hover{background:linear-gradient(180deg,#fff,#e8e8f0)}
    .wbp-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
    .wbp-tip{font-size:12px;color:#ffb4ad;min-height:16px;margin-top:8px;line-height:1.6}
    .wbp-picker{position:fixed;inset:0;z-index:70;display:none}
    .wbp-picker.open{display:flex;align-items:center;justify-content:center}
    .wbp-picker-box{position:relative;width:min(760px,94vw);max-height:80vh;display:flex;flex-direction:column;background:#15161d;border:1px solid rgba(255,255,255,.14);border-radius:18px;overflow:hidden}
    .wbp-picker-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.1);font-size:13px;color:rgba(255,255,255,.7)}
    .wbp-picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding:14px;overflow-y:auto}
    .wbp-picker-item{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.12);cursor:pointer;background:#000}
    .wbp-picker-item:hover{border-color:rgba(115,170,255,.7)}
    .wbp-picker-item img{width:100%;height:100%;object-fit:cover;display:block}
    .wbp-picker-empty{grid-column:1/-1;text-align:center;color:rgba(255,255,255,.45);font-size:12.5px;padding:26px 0}
    .wbp-done{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:80;padding:10px 18px;border-radius:12px;
      background:rgba(20,21,30,.96);border:1px solid rgba(123,216,143,.45);color:#d7f5df;font-size:13px;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 16px 40px -14px rgba(0,0,0,.7)}
  </style>
    <link rel="stylesheet" href="/css/scrollbar.css?v=1.0.1">
</head>
<body>
  <!--
    Excalidraw 笔记页
    用法：
      /excalidraw.html?note=demo            只读分享（默认）
      /excalidraw.html?note=demo&edit=1     编辑（口令/管理员）
      /excalidraw.html?edit=1               新建（自动生成 ID，需管理员登录）
  -->
  <header class="site-header">
    <span class="title" id="noteTitle">白板</span>
    <span class="spacer"></span>
    <button type="button" id="publishBtn" class="nav-pill" style="display:none">发布</button>
  </header>
  <main id="excalidraw-root"></main>

  <!-- 发布白板文章弹窗（标题/状态/标签/封面/可见性） -->
  <div class="wbp-modal" id="wbpModal">
    <div class="wbp-mask" id="wbpMask"></div>
    <div class="wbp-box">
      <h3 id="wbpHeading">发布白板文章</h3>
      <div class="wbp-sub">发布会先保存当前画板，再创建或更新对应的白板文章。</div>
      <div class="wbp-field"><label>文章标题</label><input type="text" id="wbpTitleInput" maxlength="60" autocomplete="off" placeholder="给这块白板起个标题"></div>
      <div class="wbp-field"><label>状态</label><select id="wbpStatus"><option value="published">发布</option><option value="draft">草稿</option></select></div>
      <div class="wbp-field"><label>标签（逗号分隔，可选）</label><input type="text" id="wbpTags" placeholder="如：白板, 灵感"></div>
      <div class="wbp-field"><label>封面图（选填，不设则用白板风格卡片）</label>
        <div class="wbp-cover-row">
          <div class="wbp-cover-preview" id="wbpCoverPreview"><span>未设置</span></div>
          <div class="wbp-cover-btns">
            <label class="wbp-btn" style="cursor:pointer">上传<input type="file" accept="image/*" id="wbpCoverFile" style="display:none"></label>
            <button type="button" class="wbp-btn" id="wbpCoverPick">从图库选</button>
            <button type="button" class="wbp-btn" id="wbpCoverClear">移除</button>
          </div>
        </div>
        <input type="hidden" id="wbpCover">
      </div>
      <div class="wbp-field"><label>可见性</label>
        <select id="wbpEditable">
          <option value="0">只读（仅博主可编辑）</option>
          <option value="1">开放编辑（拿到链接的人都能改）</option>
        </select>
      </div>
      <div class="wbp-actions">
        <button type="button" class="wbp-btn" id="wbpCancel">取消</button>
        <button type="button" class="wbp-btn primary" id="wbpOk">确定发布</button>
      </div>
      <div class="wbp-tip" id="wbpTip"></div>
    </div>
  </div>

  <!-- 图库选择（封面） -->
  <div class="wbp-picker" id="wbpPicker">
    <div class="wbp-mask" id="wbpPickerMask"></div>
    <div class="wbp-picker-box">
      <div class="wbp-picker-head"><span>从图库选择封面</span><button type="button" class="wbp-btn" id="wbpPickerClose">关闭</button></div>
      <div class="wbp-picker-grid" id="wbpPickerGrid"></div>
    </div>
  </div>

  <script>
    (function () {
      var qs = new URLSearchParams(location.search);
      var note = (qs.get('note') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 64);
      var edit = qs.get('edit') === '1' || qs.get('edit') === 'true';
      var root = document.getElementById('excalidraw-root');
      var titleEl = document.getElementById('noteTitle');
      var path = location.pathname;

      if (note) {
        root.setAttribute('data-excalidraw', '');
        root.dataset.note = note;
        root.dataset.mode = edit ? 'edit' : 'view';
        // 标题不显示画板 id（名称由 /api/excalidraw?action=meta 读取，见页脚脚本）
        document.title = (edit ? '编辑白板' : '白板') + ' - Excalidraw';
      } else if (edit) {
        // 新建：自动生成 ID（保存时需管理员）
        root.setAttribute('data-excalidraw', '');
        root.dataset.note = 'wb-' + Math.random().toString(36).slice(2, 10);
        root.dataset.mode = 'edit';
        titleEl.textContent = '新建白板';
        document.title = '新建白板 - Excalidraw';
      } else {
        root.innerHTML =
          '<div class="empty-tip"><div class="card">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 12h10M12 7v10"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/></svg>' +
          '<div class="t">Excalidraw 白板</div>' +
          '<div class="row"><code>/excalidraw.html?note=笔记ID</code> —— 打开已有白板（只读）</div>' +
          '<div class="row"><code>/excalidraw.html?note=笔记ID&edit=1</code> —— 编辑（作者开放或输入口令）</div>' +
          '<div class="row"><code>/excalidraw.html?edit=1</code> —— 新建（需管理员）</div>' +
          '</div></div>';
      }
    })();
  </script>
  <script src="/js/vendor/excalidraw/excalidraw-editor.v12.js"></script>
  <script>
    // 兜底诊断：bundle 加载失败/未生效时给出可见提示（而非空白页）
    window.addEventListener('load', function () {
      if (!window.ExcalidrawMount) {
        var root = document.getElementById('excalidraw-root');
        if (root) {
          root.innerHTML =
            '<div class="empty-tip"><div class="card">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.5 20h19Z"/><path d="M12 10v4.5"/></svg>' +
            '<div class="t">白板组件未能加载</div>' +
            '<div class="row">脚本 excalidraw-editor.v12.js 加载失败（404 / 部署未完成 / 被拦截）。<br>' +
            '请 Ctrl+F5 强制刷新；若仍失败，检查 Netlify 最近一次部署是否成功，<br>' +
            '或打开 F12 → Network 看该脚本的状态码。</div>' +
            '</div></div>';
        }
      }
    });
  </script>
  <script>
    // ===== 发布白板文章：标题 / 状态 / 标签 / 封面 / 可见性（只读·开放编辑） =====
    (function () {
      var qs = new URLSearchParams(location.search);
      var note = (qs.get('note') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 64);
      var isEdit = qs.get('edit') === '1' || qs.get('edit') === 'true';
      var adminKey = localStorage.getItem('admin_key') || '';
      var titleEl = document.getElementById('noteTitle');
      var publishBtn = document.getElementById('publishBtn');
      var modal = document.getElementById('wbpModal');
      var picker = document.getElementById('wbpPicker');
      var tipEl = document.getElementById('wbpTip');
      var currentArticle = null;

      function tip(msg) { if (tipEl) tipEl.textContent = msg || ''; }
      function esc(s) {
        return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
      function api(path, opts) {
        opts = opts || {};
        return fetch(path, {
          method: opts.method || 'GET',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
          body: opts.body,
          cache: 'no-store'
        }).then(function (r) { return r.json(); });
      }
      function done(msg) {
        var el = document.createElement('div');
        el.className = 'wbp-done';
        el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 2800);
      }

      // 画板名称：标题不再显示画板 id
      async function loadMeta() {
        if (!note || !adminKey) return;
        try {
          var r = await api('/api/excalidraw?id=' + encodeURIComponent(note) + '&metaOnly=1');
          var m = (r && r.status === 'success' && r.data) ? r.data : (r && r.meta ? r.meta : null);
          if (!m) return;
          if (titleEl && m.title) titleEl.textContent = m.title;
          if (m.title) document.title = m.title + ' - Excalidraw';
          var sel = document.getElementById('wbpEditable');
          if (sel) sel.value = String(m.editable === 1 ? 1 : 0);
        } catch (e) { }
      }
      // 该画板是否已有关联白板文章
      async function findArticle() {
        try {
          var r = await api('/api/admin?action=articles');
          if (r && r.status === 'success') {
            return (r.data || []).find(function (a) { return a.type === 'whiteboard' && a.boardId === note; }) || null;
          }
        } catch (e) { }
        return null;
      }
      // 封面
      function setCover(url) {
        var el = document.getElementById('wbpCover');
        if (el) el.value = url || '';
        var box = document.getElementById('wbpCoverPreview');
        if (box) box.innerHTML = url ? '<img src="' + esc(url) + '" alt="封面预览">' : '<span>未设置</span>';
      }
      function fileToBase64(file) {
        return new Promise(function (resolve, reject) {
          var fr = new FileReader();
          fr.onload = function () {
            var s = String(fr.result || '');
            var i = s.indexOf(',');
            resolve({ base64: i >= 0 ? s.slice(i + 1) : s, mime: file.type || 'image/png' });
          };
          fr.onerror = function () { reject(new Error('读取文件失败')); };
          fr.readAsDataURL(file);
        });
      }
      async function uploadCover(file) {
        try {
          tip('正在上传封面…');
          var d = await fileToBase64(file);
          var r = await api('/api/article-image', { method: 'POST', body: JSON.stringify({ data: d.base64, mime: d.mime, name: file.name }) });
          if (r && r.status === 'success' && r.url) { setCover(r.url); tip(''); }
          else tip((r && r.message) || '封面上传失败');
        } catch (e) { tip('封面上传失败：' + (e && e.message || e)); }
      }
      async function openPicker() {
        var grid = document.getElementById('wbpPickerGrid');
        if (!grid) return;
        grid.innerHTML = '<div class="wbp-picker-empty">加载中…</div>';
        picker.classList.add('open');
        try {
          var r = await api('/api/admin?action=images&_=' + Date.now());
          var list = (r && r.status === 'success' && Array.isArray(r.data)) ? r.data : [];
          if (!list.length) { grid.innerHTML = '<div class="wbp-picker-empty">图库暂无图片，可先上传一张</div>'; return; }
          window.__wbpPickList = list;
          grid.innerHTML = list.map(function (img, i) {
            var thumb = img.thumb || img.url || '';
            return '<div class="wbp-picker-item" data-i="' + i + '"><img src="' + esc(thumb) + '" loading="lazy" alt=""></div>';
          }).join('');
          Array.prototype.forEach.call(grid.querySelectorAll('.wbp-picker-item'), function (item) {
            item.addEventListener('click', function () {
              var img = (window.__wbpPickList || [])[Number(item.getAttribute('data-i'))];
              if (img) setCover(img.url || '');
              picker.classList.remove('open');
            });
          });
        } catch (e) { grid.innerHTML = '<div class="wbp-picker-empty">加载失败</div>'; }
      }

      async function openModal() {
        tip('');
        currentArticle = await findArticle();
        var heading = document.getElementById('wbpHeading');
        if (heading) heading.textContent = currentArticle ? '更新白板文章' : '发布白板文章';
        var tEl = document.getElementById('wbpTitleInput');
        if (tEl) {
          var guess = (currentArticle && currentArticle.title) || (titleEl && titleEl.textContent !== '白板' ? titleEl.textContent : '');
          tEl.value = guess || ('白板 ' + new Date().toLocaleDateString());
        }
        var sEl = document.getElementById('wbpStatus');
        if (sEl) sEl.value = (currentArticle && currentArticle.status) || 'published';
        var gEl = document.getElementById('wbpTags');
        if (gEl) gEl.value = ((currentArticle && currentArticle.tags) || []).join(', ');
        setCover((currentArticle && currentArticle.image) || '');
        modal.classList.add('open');
      }
      async function doPublish() {
        var title = (document.getElementById('wbpTitleInput').value || '').trim();
        if (!title) { tip('请填写文章标题'); return; }
        var status = document.getElementById('wbpStatus').value;
        var tags = (document.getElementById('wbpTags').value || '').split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean);
        var image = (document.getElementById('wbpCover').value || '').trim();
        var editable = document.getElementById('wbpEditable').value === '1' ? 1 : 0;
        var okBtn = document.getElementById('wbpOk');
        if (okBtn) okBtn.disabled = true;
        try {
          if (typeof window.__excalidrawSave === 'function') {
            tip('正在保存画板…');
            var saved = await window.__excalidrawSave();
            if (!saved) { tip('画板保存未完成（可能需要口令、画布为空或网络问题）'); return; }
          }
          tip('正在写入画板设置…');
          await api('/api/excalidraw?action=meta&id=' + encodeURIComponent(note), { method: 'POST', body: JSON.stringify({ title: title, editable: editable }) });
          tip('正在发布文章…');
          var body = { title: title, content: '', status: status, type: 'whiteboard', boardId: note, tags: tags, image: image };
          if (currentArticle) body.id = currentArticle.id;
          var r = await api('/api/admin?action=articles', { method: 'POST', body: JSON.stringify(body) });
          if (!r || r.status !== 'success') { tip((r && r.message) || '发布失败'); return; }
          if (titleEl) titleEl.textContent = title;
          document.title = title + ' - Excalidraw';
          tip('');
          modal.classList.remove('open');
          done(status === 'draft' ? '白板文章已存为草稿' : '白板文章已发布');
        } catch (e) {
          tip('发布出错：' + (e && e.message || e));
        } finally {
          if (okBtn) okBtn.disabled = false;
        }
      }

      // 隐藏组件顶栏里的「发布为博文」按钮（其能力已并入本发布弹窗）
      function hideBundlePublish() {
        var bar = document.querySelector('.exc-bar');
        if (!bar) return;
        Array.prototype.forEach.call(bar.querySelectorAll('button'), function (b) {
          var t = (b.textContent || '').trim();
          if (t.indexOf('发布') >= 0 || t.indexOf('博文') >= 0) b.style.display = 'none';
        });
      }
      var tries = 0;
      var timer = setInterval(function () { hideBundlePublish(); if (++tries >= 25) clearInterval(timer); }, 400);

      if (publishBtn && note && isEdit && adminKey) {
        publishBtn.style.display = '';
        publishBtn.addEventListener('click', openModal);
      }
      var cancelBtn = document.getElementById('wbpCancel');
      if (cancelBtn) cancelBtn.addEventListener('click', function () { modal.classList.remove('open'); });
      var mask = document.getElementById('wbpMask');
      if (mask) mask.addEventListener('click', function () { modal.classList.remove('open'); });
      var okBtn2 = document.getElementById('wbpOk');
      if (okBtn2) okBtn2.addEventListener('click', doPublish);
      var clearBtn = document.getElementById('wbpCoverClear');
      if (clearBtn) clearBtn.addEventListener('click', function () { setCover(''); });
      var pickBtn = document.getElementById('wbpCoverPick');
      if (pickBtn) pickBtn.addEventListener('click', openPicker);
      var fileInput = document.getElementById('wbpCoverFile');
      if (fileInput) fileInput.addEventListener('change', function () {
        var f = this.files && this.files[0];
        this.value = '';
        if (f) uploadCover(f);
      });
      var pickerClose = document.getElementById('wbpPickerClose');
      if (pickerClose) pickerClose.addEventListener('click', function () { picker.classList.remove('open'); });
      var pickerMask = document.getElementById('wbpPickerMask');
      if (pickerMask) pickerMask.addEventListener('click', function () { picker.classList.remove('open'); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { if (picker) picker.classList.remove('open'); if (modal) modal.classList.remove('open'); }
      });
      loadMeta();
    })();
  </script>
</body>
</html>
