<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R_N</title>
    <link rel="icon" href="/images/TX/01_TX.webp" type="image/webp">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css?v=2.6.17">

    <!-- Marked.js -->
    <script src="js/vendor/marked.min.js"></script>

    <!-- Highlight.js -->
    <link rel="stylesheet" href="css/highlight-github-dark.min.css">
    <script src="js/vendor/highlight.min.js"></script>

    <!-- Anime.js -->
    <script src="js/vendor/anime.umd.min.js"></script>
</head>

<body>

    <!-- ===== CONTENT WRAPPER ===== -->
    <div class="content-wrapper" id="contentWrapper">

        <!-- 顶部导航栏 -->
        <header class="top-bar">
            <div class="top-bar-inner">
                <a href="index.html" class="top-bar-brand">渡鸦_NULL BLOG</a>
                <div class="top-bar-views" id="viewSwitch">
                    <div class="view-indicator" id="viewIndicator"></div>
                    <button class="view-btn active" data-view="blog" onclick="BlogApp.switchView('blog')">博客</button>
                    <button class="view-btn" data-view="gallery" onclick="BlogApp.switchView('gallery')">图库</button>
                    <button class="view-btn" data-view="dashboard" onclick="BlogApp.switchView('dashboard')">我的</button>
                </div>
            </div>
        </header>

        <!-- Sticky Nav -->
        <nav class="nav-bar" id="navBar">
            <div class="nav-inner">
                <div class="nav-links">
                    <a href="#" class="nav-link active" onclick="BlogApp.filterByTag(null); return false;">全部</a>
                    <a href="#" class="nav-link" onclick="BlogApp.filterByTag('技术'); return false;">技术</a>
                    <a href="#" class="nav-link" onclick="BlogApp.filterByTag('生活'); return false;">生活</a>
                    <a href="#" class="nav-link" onclick="BlogApp.filterByTag('AI'); return false;">AI</a>
                </div>
                <div class="nav-tools">
                    <div class="nav-tools-item">
                        <button class="nav-search-btn" onclick="BlogApp.toggleTagsPanel()" title="标签">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
                                <line x1="7" y1="7" x2="7.01" y2="7"></line>
                            </svg>
                        </button>
                        <div class="tags-dropdown" id="tagsDropdown">
                            <div class="tags-dropdown-title" id="tagsDropdownTitle">全部标签</div>
                            <div class="tags-dropdown-list" id="tagsDropdownList"></div>
                        </div>
                    </div>
                    <div class="nav-tools-item">
                        <button class="nav-search-btn" onclick="BlogApp.toggleSearch()" title="Search">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <circle cx="11" cy="11" r="8" />
                                <path d="m21 21-4.35-4.35" />
                            </svg>
                        </button>
                        <div class="search-dropdown" id="searchDropdown">
                            <input type="text" id="searchInput" placeholder="Search articles..."
                                oninput="BlogApp.searchPosts(this.value)">
                            <button class="search-dropdown-close" onclick="BlogApp.toggleSearch()">&times;</button>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 可滚动内容区（滚动条仅在此区域内显示） -->
        <div class="scroll-area" id="scrollArea">

            <!-- Main Content -->
            <main class="main-content">

                <!-- 视图：博客 -->
                <section class="view view-blog" id="view-blog">
                    <div id="posts">
                        <div class="loading">
                            <div class="loading-spinner"></div>
                            <p>Loading...</p>
                        </div>
                    </div>
                    <div id="pagination"></div>
                </section>

                <!-- 视图：图库 -->
                <section class="view view-gallery" id="view-gallery" style="display:none;">
                    <div class="gallery-grid" id="galleryGrid"></div>
                </section>

            <!-- 视图：仪表盘 -->
            <section class="view view-dashboard" id="view-dashboard" style="display:none;">
                <div class="dashboard">

                    <!-- 欢迎区 -->
                    <div class="dash-hero">
                        <img class="dash-avatar" src="images/TX/01_TX.webp" alt="渡鸦NULL">
                        <div class="dash-identity">
                            <div class="dash-name">渡鸦NULL</div>
                            <div class="dash-bio">全栈开发者 · 内容创作者 · 终身学习者</div>
                        </div>
                    </div>

                    <!-- 统计概览 -->
                    <div class="dashboard-stats" id="dashboardStats"></div>

                    <!-- 最近文章 + 热门标签 -->
                    <div class="dash-grid">
                        <div class="dash-panel">
                            <div class="dash-panel-title">最近文章</div>
                            <div class="dash-recent" id="dashRecent"></div>
                        </div>
                        <div class="dash-panel">
                            <div class="dash-panel-title">热门标签</div>
                            <div class="dash-tags" id="dashTags"></div>
                        </div>
                    </div>

                    <!-- 快捷入口 + 关于 -->
                    <div class="dash-bottom">
                        <div class="dash-panel">
                            <div class="dash-panel-title">快捷入口</div>
                            <div class="dash-quick-links">
                                <a href="https://github.com/raven-null/R_N-Blog" target="_blank" rel="noopener">GitHub</a>
                                <a href="feed.xml" target="_blank" rel="noopener">RSS</a>
                                <a href="article.html?post=01-blog-usage-guide.md">写文章</a>
                            </div>
                        </div>
                        <div class="dash-panel">
                            <div class="dash-panel-title">关于</div>
                            <div class="dash-about-info">
                                <span>版本 v2.6</span>
                                <span>纯前端 · GitHub Pages</span>
                                <span>最后更新 2026-08-05</span>
                            </div>
                        </div>
                    </div>

                </div>
            </section>
            </main>

            <!-- Footer -->
            <footer class="footer">
                <div class="footer-left">&copy; 渡鸦_NULL BLOG 1.3<span class="footer-stats" id="footerStats"></span></div>
                <div class="footer-right">
                    <a href="https://github.com/raven-null/R_N-Blog" class="footer-link" target="_blank" rel="noopener">GitHub</a>
                    <a href="feed.xml" class="footer-link" target="_blank" rel="noopener">RSS</a>
                    <a href="article.html?post=01-blog-usage-guide.md" class="footer-link">About</a>
                </div>
            </footer>
        </div>
    </div>

    <!-- 阅读进度条 -->
    <div class="reading-progress" id="readingProgress"></div>

    <!-- 回到顶部按钮 -->
    <button class="back-to-top" id="backToTop" title="回到顶部">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
    </button>

    <!-- 图库灯箱 -->
    <div class="gallery-lightbox" id="galleryLightbox" onclick="closeGalleryLightbox()">
        <div class="gallery-lightbox-counter" id="galleryLightboxCounter" onclick="event.stopPropagation()">1 / 0</div>
        <button class="gallery-lightbox-btn gallery-lightbox-close" title="关闭" onclick="event.stopPropagation(); closeGalleryLightbox()">&times;</button>
        <button class="gallery-lightbox-btn gallery-lightbox-nav prev" title="上一张" onclick="event.stopPropagation(); galleryLightboxNav(-1)">&#8249;</button>
        <img id="galleryLightboxImg" src="" alt="图片预览" onclick="event.stopPropagation()">
        <button class="gallery-lightbox-btn gallery-lightbox-nav next" title="下一张" onclick="event.stopPropagation(); galleryLightboxNav(1)">&#8250;</button>
        <div class="gallery-lightbox-actions" onclick="event.stopPropagation()">
            <button class="gallery-lightbox-btn gallery-lightbox-action" id="galleryLightboxSlide" title="幻灯片播放" onclick="toggleGallerySlideshow()">▶ 播放</button>
            <a class="gallery-lightbox-btn gallery-lightbox-action" id="galleryLightboxDownload" href="#" download title="下载图片" onclick="event.stopPropagation()">下载</a>
        </div>
    </div>

    <!-- 不蒜子统计（隐藏，用于"我的"页在线人数） -->
    <span id="busuanzi_container_site_uv" style="display:none;"><span id="busuanzi_site_uv"></span></span>

    <!-- Scripts -->
    <script src="js/theme.js?v=2.6.17"></script>
    <script src="js/markdown.js?v=2.6.17"></script>
    <script src="js/app.js?v=2.6.17"></script>
    <script src="js/animations.js?v=2.6.17"></script>

    <script>
        // ===== Scroll Observer =====
        function initScrollObserver() {
            const wrapper = document.getElementById('contentWrapper');

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        wrapper.classList.add('visible');
                    }
                });
            }, { threshold: 0.05 });

            observer.observe(wrapper);
        }

        // ===== Card Reveal Observer =====
        function initCardObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

            // Observe existing cards
            document.querySelectorAll('.card').forEach(card => observer.observe(card));

            // Store observer for dynamic cards
            window._cardObserver = observer;
        }

        // ===== 图库灯箱 =====
        window.__galleryImages = [];
        window.__galleryIndex = 0;
        let __galleryTimer = null;

        function openGalleryLightbox(src, index) {
            const lb = document.getElementById('galleryLightbox');
            const img = document.getElementById('galleryLightboxImg');
            if (!lb || !img) return;
            window.__galleryIndex = index || 0;
            img.src = src;
            updateGalleryLightbox();
            stopGallerySlideshow();
            lb.style.display = 'flex';
            requestAnimationFrame(() => {
                lb.classList.add('show');
                if (typeof anime !== 'undefined') {
                    anime.animate(img, { scale: [0.85, 1], opacity: [0, 1], duration: 300, ease: 'out(3)' });
                    anime.animate(lb, { opacity: [0, 1], duration: 250, ease: 'out(2)' });
                }
            });
        }

        function galleryLightboxNav(dir) {
            const images = window.__galleryImages;
            if (!images.length) return;
            const total = images.length;
            window.__galleryIndex = (window.__galleryIndex + dir + total) % total;
            const img = document.getElementById('galleryLightboxImg');
            const src = 'images/R-N-picture/' + images[window.__galleryIndex];
            if (typeof anime !== 'undefined') {
                anime.animate(img, { opacity: [1, 0], duration: 120, ease: 'in(2)', onComplete: () => {
                    img.src = src;
                    updateGalleryLightbox();
                    anime.animate(img, { opacity: [0, 1], scale: [0.96, 1], duration: 220, ease: 'out(2)' });
                } });
            } else {
                img.src = src;
                updateGalleryLightbox();
            }
        }

        function updateGalleryLightbox() {
            const el = document.getElementById('galleryLightboxCounter');
            if (el) el.textContent = (window.__galleryIndex + 1) + ' / ' + window.__galleryImages.length;
            const dl = document.getElementById('galleryLightboxDownload');
            const img = document.getElementById('galleryLightboxImg');
            if (dl && img) dl.href = img.src;
        }

        function toggleGallerySlideshow() {
            const btn = document.getElementById('galleryLightboxSlide');
            if (__galleryTimer) {
                stopGallerySlideshow();
            } else {
                __galleryTimer = setInterval(() => galleryLightboxNav(1), 2500);
                if (btn) btn.textContent = '⏸ 暂停';
            }
        }

        function stopGallerySlideshow() {
            if (__galleryTimer) {
                clearInterval(__galleryTimer);
                __galleryTimer = null;
            }
            const btn = document.getElementById('galleryLightboxSlide');
            if (btn) btn.textContent = '▶ 播放';
        }

        function closeGalleryLightbox() {
            const lb = document.getElementById('galleryLightbox');
            if (!lb) return;
            stopGallerySlideshow();
            lb.classList.remove('show');
            if (typeof anime !== 'undefined') {
                anime.animate(lb, { opacity: [1, 0], duration: 200, ease: 'in(2)', onComplete: () => { lb.style.display = 'none'; } });
            } else {
                lb.style.display = 'none';
            }
        }

        // ===== Init =====
        document.addEventListener('DOMContentLoaded', () => {
            // Scroll observer
            initScrollObserver();

            // 阅读进度条 + 回到顶部按钮 + 页脚遮挡处理（滚动发生在 #scrollArea）
            (function initScrollUI() {
                const progress = document.getElementById('readingProgress');
                const backToTop = document.getElementById('backToTop');
                const scroller = document.getElementById('scrollArea');
                if (!progress || !backToTop || !scroller) return;

                const update = () => {
                    const scrollTop = scroller.scrollTop;
                    const scrollHeight = scroller.scrollHeight - scroller.clientHeight;
                    progress.style.width = scrollHeight > 0 ? (scrollTop / scrollHeight * 100) + '%' : '0%';
                    backToTop.classList.toggle('show', scrollTop > 400);

                    // 页脚进入视口时隐藏右侧固定按钮，避免遮挡页脚内容
                    const footer = document.querySelector('.footer');
                    const footerInView = !!footer && footer.getBoundingClientRect().top <= window.innerHeight;
                    document.body.classList.toggle('footer-visible', footerInView);
                };
                scroller.addEventListener('scroll', update, { passive: true });
                window.addEventListener('resize', update);
                update();

                backToTop.addEventListener('click', () => {
                    scroller.scrollTo({ top: 0, behavior: 'smooth' });
                });
            })();

            // ESC 关闭搜索 / 图库灯箱；左右方向键切换图片
            document.addEventListener('keydown', (e) => {
                const lb = document.getElementById('galleryLightbox');
                const lbOpen = lb && lb.classList.contains('show');
                if (e.key === 'Escape') {
                    const dropdown = document.getElementById('searchDropdown');
                    if (dropdown && dropdown.classList.contains('show')) {
                        BlogApp.toggleSearch();
                    }
                    if (lbOpen) {
                        closeGalleryLightbox();
                    }
                }
                if (lbOpen && (e.key === 'ArrowLeft')) galleryLightboxNav(-1);
                if (lbOpen && (e.key === 'ArrowRight')) galleryLightboxNav(1);
            });

            // WASD shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                
                switch(e.key.toLowerCase()) {
                    case 'w':
                        document.getElementById('scrollArea').scrollBy({ top: -300, behavior: 'smooth' });
                        break;
                    case 's':
                        document.getElementById('scrollArea').scrollBy({ top: 300, behavior: 'smooth' });
                        break;
                    case 'a':
                        window.history.back();
                        break;
                    case 'd':
                        window.history.forward();
                        break;
                    case 'q':
                        ThemeManager.nextTheme();
                        break;
                }
            });

            // Click outside to close panels（搜索框 / 标签面板）
            document.addEventListener('click', (e) => {
                const tools = document.querySelector('.nav-tools');
                if (tools && !tools.contains(e.target)) {
                    BlogApp.closePanels();
                }
            });

            // Init blog app
            BlogApp.init().then(() => {
                // 文章数 → 页脚；标签数 → "全部标签"面板标题（字数统计已删除）
                const totalPosts = BlogApp.posts.length;
                const tagCount = BlogApp.posts.reduce((set, post) => {
                    (post.tags || []).forEach(tag => set.add(tag));
                    return set;
                }, new Set()).size;

                const footerStats = document.getElementById('footerStats');
                if (footerStats) footerStats.textContent = ` · 文章 ${totalPosts} 篇`;

                const tagsTitle = document.getElementById('tagsDropdownTitle');
                if (tagsTitle) tagsTitle.textContent = `全部标签（${tagCount} 个）`;

                // 初始化视图滑块指示器位置
                setTimeout(() => BlogApp.moveIndicator('blog'), 0);

                // Init card observer after posts render
                setTimeout(() => initCardObserver(), 100);
            });
        });

        // Override renderPosts to re-init card observer
        const originalRenderPosts = BlogApp.renderPosts.bind(BlogApp);
        BlogApp.renderPosts = function () {
            originalRenderPosts();
            setTimeout(() => {
                document.querySelectorAll('.card:not(.visible)').forEach(card => {
                    if (window._cardObserver) window._cardObserver.observe(card);
                });
            }, 50);
        };

    </script>

    <!-- 不蒜子统计 -->
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>

</html>
