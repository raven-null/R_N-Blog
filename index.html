    <script>
        // ===== Hero Particles =====
        class HeroParticles {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.mouse = { x: 0, y: 0 };
                this.cachedAccent = '#ffffff';
                this.lastColorCheck = 0;
                this.resize();
                this.init();
                this.animate();

                window.addEventListener('resize', () => this.resize());
                
                // 鼠标移动事件节流
                let mouseTimer = null;
                window.addEventListener('mousemove', (e) => {
                    if (mouseTimer) return;
                    mouseTimer = requestAnimationFrame(() => {
                        this.mouse.x = e.clientX;
                        this.mouse.y = e.clientY;
                        mouseTimer = null;
                    });
                });
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            init() {
                const count = Math.min(50, Math.floor(window.innerWidth / 20));
                this.particles = [];
                for (let i = 0; i < count; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 0.3,
                        vy: (Math.random() - 0.5) * 0.3,
                        size: Math.random() * 1.5 + 0.5,
                        opacity: Math.random() * 0.4 + 0.1
                    });
                }
            }

            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // 每秒检查一次主题颜色
                const now = Date.now();
                if (now - this.lastColorCheck > 1000) {
                    const style = getComputedStyle(document.documentElement);
                    this.cachedAccent = style.getPropertyValue('--accent').trim() || '#ffffff';
                    this.lastColorCheck = now;
                }

                const particles = this.particles;
                const len = particles.length;
                
                for (let i = 0; i < len; i++) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;

                    // Mouse interaction
                    const dx = this.mouse.x - p.x;
                    const dy = this.mouse.y - p.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 150) {
                        p.x -= dx * 0.01;
                        p.y -= dy * 0.01;
                    }

                    // Wrap around
                    if (p.x < 0) p.x = this.canvas.width;
                    if (p.x > this.canvas.width) p.x = 0;
                    if (p.y < 0) p.y = this.canvas.height;
                    if (p.y > this.canvas.height) p.y = 0;

                    // Draw particle
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = this.hexToRgba(this.cachedAccent, p.opacity);
                    this.ctx.fill();

                    // Connect nearby particles (优化：限制检查范围)
                    for (let j = i + 1; j < len && j < i + 10; j++) {
                        const p2 = particles[j];
                        const d = Math.sqrt((p.x - p2.x) ** 2 + (p.y - p2.y) ** 2);
                        if (d < 120) {
                            this.ctx.beginPath();
                            this.ctx.moveTo(p.x, p.y);
                            this.ctx.lineTo(p2.x, p2.y);
                            this.ctx.strokeStyle = this.hexToRgba(this.cachedAccent, 0.06 * (1 - d / 120));
                            this.ctx.stroke();
                        }
                    }
                }

                requestAnimationFrame(() => this.animate());
            }

            hexToRgba(hex, alpha) {
                hex = hex.replace('#', '');
                if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
                const r = parseInt(hex.substring(0, 2), 16);
                const g = parseInt(hex.substring(2, 4), 16);
                const b = parseInt(hex.substring(4, 6), 16);
                return `rgba(${r}, ${g}, ${b}, ${alpha})`;
            }
        }

        // ===== Scroll Observer =====
        function initScrollObserver() {
            const wrapper = document.getElementById('contentWrapper');

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        wrapper.classList.add('visible');
                    }
                });
            }, { threshold: 0.05 });

            observer.observe(wrapper);
        }

        // ===== Card Reveal Observer =====
        function initCardObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

            // Observe existing cards
            document.querySelectorAll('.card').forEach(card => observer.observe(card));

            // Store observer for dynamic cards
            window._cardObserver = observer;
        }

        // ===== Init =====
        document.addEventListener('DOMContentLoaded', () => {
            // Particles
            const canvas = document.getElementById('heroParticles');
            if (canvas) new HeroParticles(canvas);

            // Scroll observer
            initScrollObserver();

            // 阅读进度条 + 回到顶部按钮
            (function initScrollUI() {
                const progress = document.getElementById('readingProgress');
                const backToTop = document.getElementById('backToTop');
                if (!progress || !backToTop) return;

                const update = () => {
                    const doc = document.documentElement;
                    const scrollTop = window.scrollY || doc.scrollTop;
                    const scrollHeight = doc.scrollHeight - window.innerHeight;
                    progress.style.width = scrollHeight > 0 ? (scrollTop / scrollHeight * 100) + '%' : '0%';
                    backToTop.classList.toggle('show', scrollTop > 400);
                };
                window.addEventListener('scroll', update, { passive: true });
                update();

                backToTop.addEventListener('click', () => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            })();

            // Scroll indicator click
            const scrollIndicator = document.getElementById('scrollIndicator');
            if (scrollIndicator) {
                scrollIndicator.addEventListener('click', () => {
                    document.getElementById('contentWrapper').scrollIntoView({ behavior: 'smooth' });
                });
            }

            // ESC to close search
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    const dropdown = document.getElementById('searchDropdown');
                    if (dropdown && dropdown.classList.contains('show')) {
                        BlogApp.toggleSearch();
                    }
                }
            });

            // WASD shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                
                switch(e.key.toLowerCase()) {
                    case 'w':
                        window.scrollBy({ top: -300, behavior: 'smooth' });
                        break;
                    case 's':
                        window.scrollBy({ top: 300, behavior: 'smooth' });
                        break;
                    case 'a':
                        window.history.back();
                        break;
                    case 'd':
                        window.history.forward();
                        break;
                    case 'q':
                        ThemeManager.nextTheme();
                        break;
                }
            });

            // Click outside to close panels（搜索框 / 标签面板）
            document.addEventListener('click', (e) => {
                const tools = document.querySelector('.nav-tools');
                if (tools && !tools.contains(e.target)) {
                    BlogApp.closePanels();
                }
            });

            // Init blog app
            BlogApp.init().then(() => {
                // 文章数 → 页脚；标签数 → "全部标签"面板标题（字数统计已删除）
                const totalPosts = BlogApp.posts.length;
                const tagCount = BlogApp.posts.reduce((set, post) => {
                    (post.tags || []).forEach(tag => set.add(tag));
                    return set;
                }, new Set()).size;

                const footerStats = document.getElementById('footerStats');
                if (footerStats) footerStats.textContent = ` · 文章 ${totalPosts} 篇`;

                const tagsTitle = document.getElementById('tagsDropdownTitle');
                if (tagsTitle) tagsTitle.textContent = `全部标签（${tagCount} 个）`;

                // Init card observer after posts render
                setTimeout(() => initCardObserver(), 100);
            });
        });

        // Override renderPosts to re-init card observer
        const originalRenderPosts = BlogApp.renderPosts.bind(BlogApp);
        BlogApp.renderPosts = function () {
            originalRenderPosts();
            setTimeout(() => {
                document.querySelectorAll('.card:not(.visible)').forEach(card => {
                    if (window._cardObserver) window._cardObserver.observe(card);
                });
            }, 50);
        };

    </script>
